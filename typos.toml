[files]
# Hidden authored configuration participates; Git metadata and bundled Yarn do not.
ignore-hidden = false
extend-exclude = [
	"/.git/",
	"/.yarn/",
	"yarn.lock",
	"corpus-python/uv.lock",
	"docs/static/sbom/",
	"docs/static/maps/",
	"docs/static/mailwoman/",
	"packages/sentencepiece-wasm/sentencepiece.mjs",
	"packages/mailwoman/tools/eval-harness/gauntlet/cases/",
	"packages/mailwoman/tools/eval-harness/conformance/*.jsonl",
	"packages/mailwoman/tools/eval-harness/activity-lexicon/collision-census.json",
	"packages/codex/lib/us/street-suffix.json",
	"packages/poi-taxonomy/data/",
	"THIRD_PARTY_NOTICES.md",
	# Address datasets, frozen evaluations, and published provenance retain source spelling.
	"data/",
	"evals/",
	"docs/records/evals/",
	"**/*preregistration*.md",
	"**/*preregistration*.mdx",
	"docs/static/benchmarks/",
	"packages/corpus/data/",
	"packages/core/data/libpostal/",
	# Verbatim FINESS and Annuaire de l'éducation records, in French.
	"packages/corpus/lib/fr/adapters/finess/adapter.test.ts",
	"packages/corpus/lib/fr/adapters/annuaire-education/adapter.test.ts",
	"**/model-card.json",
	"**/PROVENANCE.json",
	"**/THIRD-PARTY-NOTICES*",
	# Imported and deliberately malformed fixtures are data, including lint rule examples.
	"**/fixtures/",
	"**/test-fixtures/",
	"config/vale/styles/Spelling.yml",
	"config/vale/styles/ShellNoun.yml",
	# Vale's vocabulary and regex rules contain accepted and rejected spellings as data.
	"config/vale/vocabularies/",
	"config/vale/styles/Grammar/SloganAssertions.yml",
	"packages/mailwoman/tools/eval-harness/**/*receipt*.json",
	"packages/mailwoman/tools/eval-harness/**/*definition*.json",
	"docs/engineering/reference/jurisdiction-coverage.mdx",
	"packages/mailwoman/tools/eval-harness/baselines.json",
	"packages/mailwoman/tools/eval-harness/invariance/suite.jsonl",
	# These modules are generated from models or language registries.
	"packages/registry/lib/models/*-gbt-en-us.ts",
	"packages/codex/lib/country/official-languages.ts",
	"packages/core/lib/resources/languages/types.gen.ts",
]

[default]
locale = "en-us"
# These literal values belong to external interfaces or quoted source names.
extend-ignore-re = [
	# French publisher text quoted by the FINESS and Annuaire de l'éducation readers, and two quotations in
	# the CORDIS reader: an address line and the EU legal notice.
	'''«[^»]*»''',
	'''[Cc]entres? d'accueil[^,.]*|CENTRE D'ACCUEIL FAMILIAL SPECIALISE''',
	'''20 AOUT 7''',
	'''PIA-Air Contro Adem Jashari''',
	# GLEIF's terms quoted verbatim, French legal-form names, and the building words (`centre`, `CENTRE`)
	# that published address lines spell in British English.
	'''CC0 licence''',
	'''[Ee]ntreprise(?:\\s\+|\s+)[Ii]ndividuelle''',
	'''\bCENTRE\b''',
	'''\|centre\|''',
	'''\(CC BY 4\.0\) licence''',
	'''["'`]neighbourhood["'`]''',
	'''\bneighbourhood\s*:|\.neighbourhood\b''',
	'''["'`]licence["'`]''',
	'''["'`]metre["'`]''',
	'''["'`]modelled["'`]''',
	'''\blicence\s*:|\.licence\b''',
	'''#fulfil\b|`fulfil`''',
	'''viewport-centre''',
	'''Licence Ouverte''',
	'''Open (?:Government |Data )?Licence''',
	'''Norwegian Licence for Open Government Data''',
	'''Singapore Open Data Licence''',
	'''\bINSERTs\b|\bUPDATEs\b|\bATTACHed\b''',
	'''\b(?:\d+nd(?:Order)?|\d+PN|\d+BA)\b''',
	'''\b[0-9a-f]{7,40}\b''',
	'''St Mary Axe|st mary axe''',
	'''Generalised Zoning(?: Types)?|generalised-zoning-types|Standardised Zoning Objective''',
	'''District Centre|Neighbourhood Centre|Centre-Val de Loire''',
	'''Church of the Holy Sepulchre''',
	'''Viet Nam|Valles Marineris''',
	'''Courrier d'Entreprise''',
	'''© les contributeurs de la Base Adresse Nationale''',
	'''\b(?:5th Avenue Theatre|Royal Theatre|Grand Theatre|Belfast Grand Opera Theatre)\b''',
	'''\bBroadway Theatre(?: Company)?\b|5th\s+Avenue\s+Theatre''',
	'''\bAvenue du Centre\b|\bPharmacie du Centre\b|100 Centre Street''',
	'''\b(?:Northfields Community|New Cross Learning|New North Health|NATIONAL SHOOTING|DIABETES & METABOLISM) CENTRE\b''',
	'''\b(?:Northfields Community|New Cross Learning|New North Health) Centre\b''',
	'''OR(?:DNANCE SURVEY DATA LICENCE)|http://os.uk/opendata/licence''',
	'''Licence No\. 2023/OSi_NMA_073''',
	'''International Licence \(CC-BY\)''',
	'''Myplan\.ie uses a generalised, homogenised version''',
	'''presence and effect of flood defences''',
	'''\bUnicode-Nd\b|\\p\{Nd\}''',
	'''pre-empted|look-alikes''',
	'''\blicence(?:\\)?\.txt\b''',
	'''\|Licence\|License\|Lizenz''',
	'''\b(?:LPS |Ireland )?End User Licence\b''',
	'''Brussels Regional Informatics Centre''',
	'''National Shooting Centre''',
	'''Licence CC-BY 4\.0''',
	'''\bVIA\s+CONSOLATO DEL MARE\b''',
	'''\bHà Nam\b|\bTây Nam Linh Đàm\b''',
	'''\b(?:band A|city|town) centre\b''',
	'''\b(?:bad|folded)-defence\.db\b|declared defence domain''',
	'''maintaining the existing defence during the period, so the mapped zone reflects the defence''',
	'''\b(?:District, neighbourhood centre|City/Town/village Centre)\b''',
	'''\bNooYork\b''',
	'''\bgb-op2-east-west-fortess\b''',
	'''\b17\. Juni\b''',
	'''sharpen-the-axe''',
	'''["'`]ue["'`]''',
	'''`-feld`''',
	'''\b(?:ban-licence-ouverte|no-such-licence)\b''',
	'''autocomplete\(trie, \["new", "yor"\]''',
	# Existing error text and the frozen filer scorecard retain their tested spelling.
	'''licence condition|sectional centre''',
	'''licence \$\{stringifyJSON\(licenseID\)\} reads''',
	'''one registrant is a modelling choice''',
	'''Extraction or Re-utilisation''',
	'''Separately modelled postal jurisdictions''',
	# Publisher quotations in source surveys retain the quoted spelling.
	'''(?m)^> a link to this licence"$''',
	'''further investigations and modelling may be required''',
	'''Myplan\.ie uses a \*\*generalised, homogenised version\*\*''',
	'''Territory characterised according to its''',
]

