# CENSUS variant of `.vale-code.ini` — the same rule and the same literal-sense exemptions, with
# ONE difference: the instrument files stay MEASURED.
#
# `scripts/vocab-census.ts` needs a file that always trips, so a reported zero can be told apart
# from a run that resolved no files. The enforcing config exempts the Vale fixtures; this one does
# not, which is what keeps `dirty.ts` usable as that control. The census then excludes the
# instrument files from its COUNT in code (`UNMEASURED`), after the control has been checked.
#
# Vale config for the AMBIGUOUS-SHORTHAND ban over SOURCE COMMENTS — TypeScript, TSX and Python.
#
# `AGENTS.md` bans four words "in replies AND in every committed prose surface", and until this
# config existed the code surface was the one that said so and did not enforce it: 2,014 hits
# across 619 of 2,638 tracked files, measured 2026-09-02.
#
# Vale extracts comment prose for these languages natively and leaves code alone — an identifier
# named `promotionEval` is not a hit, the sentence above it is. A config with no `[*.ts]` section
# silently lints nothing, which is what made this gap easy to miss: a run against a `.ts` file
# reports zero alerts and exit 0 whether the rule is off or the file is clean.
#
# Every rule but AmbiguousShorthand is OFF here on purpose. The prose rules — Weasel, StockPhrases,
# BannedWords — are calibrated for published pages, where "many" without a denominator is a defect;
# a comment stating a measured constraint reads differently and bringing it under those rules is a
# separate decision. StylesPath and Vocab match the other three configs so all four resolve the
# same style directory and accept-list.

StylesPath = styles
MinAlertLevel = error
Vocab = Mailwoman

[*.{ts,tsx,py}]
BasedOnStyles = Mailwoman
# The markdown variant's backtick exemption does not reach a code comment; the Code
# variant protects contract-bearing names by name instead. See its docstring.
Mailwoman.AmbiguousShorthand = NO
Mailwoman.Anthropomorphism = NO
Mailwoman.BannedWords = NO
Mailwoman.Spelling = NO
Mailwoman.StockPhrases = NO
Mailwoman.Terms = NO
Mailwoman.Weasel = NO

## Files where the word is DATA, not shorthand, and the rule cannot tell the difference.
##
## This repository ingests OpenStreetMap: `aeroway=check` is a tag, `Check A12` is a `ref` value,
## `Terminal 5` and `Concourse B` are the sub-venue shapes the parser exists to read, and the GB
## The street suffix in Briggate, Kirkgate and Eastgate is a confound class a rule protects against.
## A geocoder that reads OSM keeps meeting the literal noun, and no exceptions list reaches a bare
## one. Every file below was read; each carries the physical sense throughout.
##
## ADDING A PATH HERE IS A CLAIM that the word is data in it. A file where the word is prose belongs
## in the sweep, not in this list.
[{packages/corpus/lib/recipes/sub-venue*.ts,packages/corpus/lib/tools/sub-venue*.ts,packages/corpus/lib/tools/sub-venue/*.ts,packages/corpus/lib/tools/overture-subvenue.ts,packages/corpus/lib/tools/fetch/*.ts,packages/corpus/test/unit/recipes/sub-venue*.ts,packages/corpus/test/unit/tools/sub-venue*.ts,packages/osm/lib/sdk/extract-subvenue.ts,packages/neural/lib/venue-structure.ts,packages/neural/lib/span/proposal-prior.ts,packages/core/lib/pipeline/span-proposer.ts,packages/core/test/unit/pipeline/span-proposer.test.ts,packages/core/lib/decoder/containment.ts,packages/mailwoman/lib/geocode/result.ts,packages/mailwoman/lib/eval-harness/conformance/punctuation.ts,packages/mailwoman/test/integration/venue-structure-confounds.test.ts}]
Mailwoman.AmbiguousShorthandCode = NO

