StylesPath = styles
MinAlertLevel = warning
Vocab = Mailwoman

# Vale's native MDX parser shells out to an external `mdx2vast` binary that
# isn't part of this toolchain (unvendored, would need a second install path).
# Map .mdx to the built-in markdown parser instead — frontmatter, code fences,
# and prose all lint the same way; only JSX/import lines need the TokenIgnores
# below, since the markdown parser sees them as plain text lines.
[formats]
mdx = md

[*.{md,mdx}]
BasedOnStyles = Mailwoman
# MDX: skip imports/JSX blocks. The third TokenIgnores pattern is a defensive
# backstop for `source-of-truth:` frontmatter keys — Vale already strips
# frontmatter before linting, so this only matters if that parsing ever fails.
TokenIgnores = (import .+ from .+), (<[A-Z][^>]*>), (^source-of-truth:.*)
# BlockIgnores deliberately omits a fenced-code-block pattern (the task brief's
# draft had "(?s)(```.*?```), " here). Measured on @vvago/vale 3.17.0: fenced
# code blocks are ALREADY excluded from prose linting natively by the
# markdown parser with NO BlockIgnores entry at all (confirmed: a fence with
# banned words inside never trips a rule, config-free). Adding the fence
# pattern anyway does not just duplicate that exclusion — every one of ~10
# isolated repros (single pattern, reordered patterns, single vs. double
# fence, .md vs. .mdx, with/without a details block) showed it silently
# stops linting EVERYTHING after the first matched fence in the document —
# a real page with a code sample followed by more prose loses all coverage
# past that point. Dropping the fence pattern and keeping only the
# `<details>` one (which does not exhibit this) fixed it: confirmed against
# a doc with two fences, a details block, and trailing prose after each —
# every real violation past every ignored block was caught.
BlockIgnores = (?s)(<details>.*?</details>)
