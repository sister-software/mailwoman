# Vale config for the AMBIGUOUS-SHORTHAND ban ONLY, run over prose that lives
# outside the published-docs corpus: the root markdown contracts (AGENTS.md,
# README.md, RELEASING.md, CONTRIBUTING.md, REPRODUCIBILITY.md), the
# engineering docs under docs/engineering, and every package README.
#
# This config once turned every rule OFF except Mailwoman.AmbiguousShorthand,
# because switching the whole style on over these surfaces failed on 175 alerts
# from Spelling, BannedWords, Weasel and StockPhrases, and that was deferred as
# "a separate sweep". THE SWEEP HAPPENED (#2077): the count had grown to 267 by
# the time it ran, and every error-severity rule now passes, so the full style
# is on. Weasel stays level: warning and does not fail the run — the hedge
# quantities it names need a measured number, which is per-site work rather
# than a rewrite.
#
# The excluded surface is dated point-in-time records — docs/records/,
# docs/engineering/design/ (every file there is date-prefixed),
# docs/superpowers/specs/, CHANGELOG.md, docs/records/evals/. Those are
# historical documents; the acronym-casing convention already exempts them
# from rewrites, and this ban follows the same line. The path list in
# @mailwoman/docs's `lint:prose:vocab` script is what enforces it — the
# engineering entries are globbed at the top level plus reference/, which
# leaves design/ out by construction.
#
# StylesPath and Vocab match .vale.ini so all three configs resolve the same
# style directory and accept-list.

StylesPath = styles
MinAlertLevel = warning
Vocab = Mailwoman

[formats]
mdx = md

[*.{md,mdx}]
BasedOnStyles = Mailwoman
TokenIgnores = (import .+ from .+), (<[A-Z][^>]*>), (^source-of-truth:.*)
BlockIgnores = (?s)(<details>.*?</details>)

## Vendored upstream data carries upstream's own prose. `packages/core/data/` holds the libpostal,
## Who's On First and chromium-i18n corpora, and their READMEs are those projects' text, not this
## one's — rewriting them to house style would misattribute an edit to the upstream author.
[**/core/data/**]
Mailwoman.AmbiguousShorthand = NO
Mailwoman.Anthropomorphism = NO
Mailwoman.BannedWords = NO
Mailwoman.Spelling = NO
Mailwoman.StockPhrases = NO
Mailwoman.Terms = NO
Mailwoman.Weasel = NO

; The dated trees and the planning trees carry the ambiguous-shorthand ban and nothing else: the other rules
; would report several hundred style alerts on prose no reader edits, while the ban is the one rule an agent
; can copy a word back out of.
[{superpowers/**,research/**,records/**}]
Mailwoman.Anthropomorphism = NO
Mailwoman.BannedWords = NO
Mailwoman.Spelling = NO
Mailwoman.StockPhrases = NO
Mailwoman.Terms = NO
Mailwoman.Weasel = NO
