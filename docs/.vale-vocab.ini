# Vale config for the AMBIGUOUS-SHORTHAND ban ONLY, run over prose that lives
# outside the published-docs corpus: the root markdown contracts (AGENTS.md,
# README.md, RELEASING.md, CONTRIBUTING.md, REPRODUCIBILITY.md), the
# engineering docs under docs/engineering, and every package README.
#
# Why a third config instead of widening .vale.ini's path list: those surfaces
# have never been under the house style, and switching the whole Mailwoman
# style on over them at once fails on 175 alerts from Spelling, BannedWords,
# Weasel and StockPhrases (measured at head) that have nothing to do with the
# vocabulary ban. Bringing them under the full style is a separate sweep. This
# config turns every rule OFF except Mailwoman.AmbiguousShorthand, so the four
# banned words fail everywhere prose lives, and nothing else changes meaning.
#
# The excluded surface is dated point-in-time records — docs/records/,
# docs/engineering/design/ (every file there is date-prefixed),
# docs/superpowers/specs/, CHANGELOG.md, docs/records/evals/. Those are
# historical documents; the acronym-casing convention already exempts them
# from rewrites, and this ban follows the same line. The path list in
# @mailwoman/docs's `lint:prose:vocab` script is what enforces it — the
# engineering entries are globbed at the top level plus reference/, which
# leaves design/ out by construction.
#
# StylesPath and Vocab match .vale.ini so all three configs resolve the same
# style directory and accept-list.

StylesPath = styles
MinAlertLevel = warning
Vocab = Mailwoman

[formats]
mdx = md

[*.{md,mdx}]
BasedOnStyles = Mailwoman
Mailwoman.Anthropomorphism = NO
Mailwoman.BannedWords = NO
Mailwoman.Spelling = NO
Mailwoman.StockPhrases = NO
Mailwoman.Terms = NO
Mailwoman.Weasel = NO
TokenIgnores = (import .+ from .+), (<[A-Z][^>]*>), (^source-of-truth:.*)
BlockIgnores = (?s)(<details>.*?</details>)
