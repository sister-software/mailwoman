# Vale config for AGENT REPLIES, not docs pages. The Stop hook
# (packages/dev-mcp/hooks/vale-response-check.ts) pipes the assistant's
# finished reply through this config; docs pages keep .vale.ini.
#
# It layers MailwomanChat (judgment jargon, distance-as-success, chat stock
# forms, opaque IDs, minted metaphors) on top of the shared Mailwoman style,
# so both surfaces share one banned-word list and chat adds only what never
# appears in published prose. It lives beside .vale.ini so both resolve the
# same StylesPath and Vocab.
#
# Replies are plain markdown. Orientation uses of `bearing` are ignored by the
# shared token pattern below. The
# fence/inline-code exclusions are the markdown parser's native behavior
# (see .vale.ini's BlockIgnores comment for the measured details).

StylesPath = styles
MinAlertLevel = warning
Vocab = Mailwoman

[*.md]
BasedOnStyles = Mailwoman, MailwomanChat
TokenIgnores = (?i)(?:qibla|southeast|north|true north|compass|map(?:'s)?|initial) bearing
