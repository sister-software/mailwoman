# Vale config for source comments in TypeScript, TSX, Python, and YAML training configs.
#
# Goal: enforce the shorthand bans in code prose, not code identifiers.
#
# Vale checks comment text in ts/tsx/py files.
# For YAML, Vale reads full file text.
#
# Most prose rules are off here on purpose.
# This config only keeps shorthand bans and capitals-as-emphasis.
# StylesPath and Vocab match the other Vale configs.

StylesPath = styles
MinAlertLevel = error
Vocab = Mailwoman

[*.{ts,tsx,py,yaml,yml}]
BasedOnStyles = Mailwoman
# Use the code-aware shorthand rule for comments.
# It protects contract-bearing names directly.
Mailwoman.AmbiguousShorthand = NO
Mailwoman.Anthropomorphism = NO
Mailwoman.BannedWords = NO
Mailwoman.Spelling = NO
Mailwoman.StockPhrases = NO
Mailwoman.Terms = NO
Mailwoman.Weasel = NO

## Exceptions: files where the matched word is data, not shorthand.
##
## These files contain OpenStreetMap values (tags, refs, venue labels, street names).
## In this context, the word is literal data.
##
## Add a path only when the word is data throughout the file.
[{packages/corpus/lib/recipes/sub/venue*.ts,packages/corpus/lib/tools/sub/venue*.ts,packages/corpus/lib/tools/sub/venue/*.ts,packages/corpus/lib/tools/overture-subvenue.ts,packages/corpus/lib/tools/fetch/*.ts,packages/corpus/test/unit/recipes/sub-venue*.ts,packages/corpus/test/unit/tools/sub-venue*.ts,packages/osm/lib/sdk/extract/subvenue/*.ts,packages/neural/lib/venue-structure.ts,packages/neural/lib/span/proposal-prior.ts,packages/core/lib/pipeline/span-proposer.ts,packages/core/test/unit/pipeline/span-proposer.test.ts,packages/core/lib/decoder/containment.ts,packages/mailwoman/lib/geocode/result.ts,packages/mailwoman/lib/eval-harness/conformance/punctuation.ts,packages/mailwoman/test/integration/venue-structure-confounds.test.ts}]
Mailwoman.AmbiguousShorthandCode = NO

## Rule fixtures and census files must include the words they test.
##
## These paths are repo-relative.
## They match in `yarn lint:prose:code` from repo root.
[{docs/scripts/vale-fixtures/*.ts,packages/repo-health/lib/checks/vocab-census.ts,packages/repo-health/test/unit/vocab-census.test.ts,packages/repo-health/lib/checks/debt.ts,docs/scripts/check/vale-rules.ts}]
Mailwoman.AmbiguousShorthandCode = NO
Mailwoman.EmphasisCapitals = NO
Mailwoman.ReifiedShorthand = NO
