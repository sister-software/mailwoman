# Vale config for the AMBIGUOUS-SHORTHAND ban over SOURCE COMMENTS — TypeScript, TSX and Python.
#
# `AGENTS.md` bans four words "in replies AND in every committed prose surface", and until this
# config existed the code surface was the one that said so and did not enforce it: 2,014 hits
# across 619 of 2,638 tracked files, measured 2026-09-02.
#
# Vale extracts comment prose for these languages natively and leaves code alone — an identifier
# named `promotionGate` is not a hit, the sentence above it is. A config with no `[*.ts]` section
# silently lints nothing, which is what made this gap easy to miss: a run against a `.ts` file
# reports zero alerts and exit 0 whether the rule is off or the file is clean.
#
# Every rule but AmbiguousShorthand is OFF here on purpose. The prose rules — Weasel, StockPhrases,
# BannedWords — are calibrated for published pages, where "many" without a denominator is a defect;
# a comment stating a measured constraint reads differently and bringing it under those rules is a
# separate decision. StylesPath and Vocab match the other three configs so all four resolve the
# same style directory and accept-list.

StylesPath = styles
MinAlertLevel = warning
Vocab = Mailwoman

[*.{ts,tsx,py}]
BasedOnStyles = Mailwoman
Mailwoman.Anthropomorphism = NO
Mailwoman.BannedWords = NO
Mailwoman.Spelling = NO
Mailwoman.StockPhrases = NO
Mailwoman.Terms = NO
Mailwoman.Weasel = NO
