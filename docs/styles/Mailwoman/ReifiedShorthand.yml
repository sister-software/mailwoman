## Mailwoman house style: a hypothesis or result reified into a noun.
##
## Vale existence rule, shared by published prose (.vale.ini), the root and
## engineering markdown (.vale-vocab.ini), source comments and training configs
## (.vale-code.ini) and agent replies (.vale-chat.ini). Each token is the shape
## a stated proposition takes once it has been compressed into a definite noun
## phrase and then handled as if it were an experimental object: "the guard"
## for the hypothesis that a narrower splice range prevents a postcode
## regression, "the win" for a measured rise on one named metric, "the reduce"
## for a chosen scope reduction, "the cost" for a measured fall. The verbs that
## follow — confirmed, held, dropped, recovered, carried — then report on the
## noun, and a reader who did not write the earlier sentence cannot recover
## what was measured.
##
## The remedy is the proposition in full, with its metric and its number:
##
##   "the probe confirmed the guard"
##      -> "the probe showed that excluding 4-5 digit tokens keeps parity
##          postcode at 0.986"
##   "guard HOLDS + date-name UP"
##      -> "parity postcode stays at 0.986 and FR date-name rises above 0.367"
##   "recover the win" / "keep the unit win"
##      -> "recover the 2-digit half of the FR date-name rise" /
##         "keep `unit` at or above 88%"
##   "the cost was carried entirely by the 4-5 digit pieces"
##      -> "the 4-5 digit pieces account for the whole postcode drop (-9.7pp)"
##   "3-digit is the reduce"
##      -> "the 100-999 range is the one to keep"
##   "take THIS to 8k"
##      -> "train this config to 8,000 steps"
##
## Two ordinary uses are deliberately NOT tokens. An indefinite "a win" ("a
## pure win", "a 10x win") is plain English for an improvement with no cost,
## and `win` as a verb ("the higher score wins") is not a noun at all; the
## definite tokens below admit up to two modifiers so a subject that happens to
## precede the verb ("the hand-authored entries win") can trip them, and that
## sentence reads better as "take precedence" anyway. A code guard — a check
## in source — is named freely; only a guard that HOLDS or DROPS or is
## CONFIRMED is the hypothesis sense, because a check refuses or fires.
##
## Emphasis capitals ("the parser is RESTRICTED", "is ABSENT") are house
## register and are not what this rule catches; the case-insensitive tokens
## match the noun-plus-predicate shape whatever its case.
extends: existence
message: "'%s' names a hypothesis or result as if it were an object — state the proposition with its metric and number instead (what was measured, what value it took, what that rules in or out)."
level: error
ignorecase: true
tokens:
  - 'confirm(?:s|ed|ing)? (?:the |a |its )?(?:[\w-]+ )?(?:guard|win)\b'
  - 'confirm(?:s|ed|ing)? guard \+ win'
  - '\b(?:guard|win|lift|gain|reduce) (?:holds|hold|held|drops|dropped|survives|survived|stands|up|down|flat)\b'
  - '\bwin absent\b'
  - '\b(?:the|its|their|half the|half of the) (?:[\w-]+ ){0,2}win\b'
  - '\bthe (?:[\w-]+ ){0,2}wins (?:were|are|hold|held|survive|survived|stand)\b'
  - '\b(?:the|a|this|that) reduce\b'
  - 'cost (?:was|is|were|are) carried'
  - 'carried entirely by'
  - 'carr(?:y|ies|ied) the (?:[\w-]+ )?(?:cost|win|loss|regression)\b'
  - 'take (?:this|it|that|the [\w-]+) to \d+k\b'
