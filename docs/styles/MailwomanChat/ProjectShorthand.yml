## Mailwoman chat style: banned project shorthand.
##
## Vale existence rule. Each token is a name an agent minted for something that
## already has a plain name, and the reader has to decode it. `the null` /
## `the cure` were invented for two fine-tune runs — say "the control run
## (v5.0.1)" / "the treatment run (v5.0.2)". `three-leg` names a
## comparison protocol — say which systems or runs the legs are.
## The word for a tunable change moved to Mailwoman/AmbiguousShorthand.yml
## so both surfaces refuse it.
##
## This file holds the CHAT-ONLY shorthand: words that appear in replies and
## never in published prose. The four words banned on BOTH surfaces —
## seam, shard, cut, gate — live in Mailwoman/AmbiguousShorthand.yml, which
## .vale-chat.ini loads through the shared Mailwoman style, so chat coverage
## of `shard` is unchanged by its move out of this file.
##
## A backticked artifact name (`synth-suffix-boundary`,
## `packages/corpus/lib/shard-recipes/`) survives, because inline code is
## exempt — mention the artifact by its real name instead of the shorthand.
extends: existence
message: "'%s' is banned project shorthand — name the concrete artifact or change in plain words (the config key, the corpus recipe file, the run version, the systems compared)."
level: error
ignorecase: true
tokens:
  - the null
  - the cure
  - three-leg
