## Mailwoman chat style: monetary metaphors for non-monetary costs.
##
## Vale existence rule. "The fine-tune tax", "nearly free", "costs nothing" —
## nothing is free: every decision costs time, rows, or opportunity, and the
## metaphor hides which one. State the actual cost with its unit. A REAL
## dollar figure ("$29 of the $40 Modal budget") is not a metaphor and no
## token here matches it.
##
## `price` AS A VERB is the same move one step further in: "price that ratio",
## "price the change first" say that something should be weighed without
## saying against what, in what unit, or by which measurement. Write the
## measurement — "run the census over all 241", "measure the label ratio in
## `suffix-boundary-v2.jsonl`".
##
## THE NOUNS ARE NOT BANNED, and the distinction is required rather than a
## carve-out. `cost` with a unit is this rule's own REMEDY — the message below
## asks for it by name — and 135 sites already write it that way. `Price` with
## a capital P is a Stripe API object: 106 sites in `packages/license-worker`
## and `@mailwoman/ops-cli` name Price ids, the Price allowlist and the two
## Prices the shop provisions, which is a third-party contract in the same
## class as axios's `HttpStatusCode`. A rule that refused those would be
## refusing correct writing, and its first fix would be an exemption list.
extends: existence
message: "'%s' is a monetary metaphor — state the actual cost and its unit (rows regressed, minutes, dollars of which budget)."
level: error
ignorecase: true
tokens:
  # `tax` in ANY form. There is no non-metaphorical tax in this project: every one of the 116
  # word-boundary occurrences in the tree is the metaphor, and the word boundary protects the 970
  # `taxonomy`/`taxonomies` occurrences (`@mailwoman/poi-taxonomy`) and the `tax` inside `syntax`
  # by construction. A real sales tax would be a Stripe concern and would arrive as a dollar figure,
  # which the rule below already admits.
  - tax(?:es|ed|ing)?
  - '\w+[- ]tax\b'
  - pay(s|ing)? the tax
  - paid the tax
  - nearly free
  - for free
  - costs? (?:approximately |almost )?nothing
  - free lunch
  - free win
  - cheap win
  # `price` as a verb: weighing something without naming the unit or the measurement.
  - pric(?:e|es|ed|ing) (?:the|that|this|a|an|it|them|its|their|each|every|what)\b
  - pric(?:e|es|ed|ing) (?:in|out|up)\b
  - worth the (?:cost|price|spend)
  - pays? for (?:itself|themselves)
  - paid for itself
  - at (?:zero|no) cost
  - buys?
