# v7.1.0 trains on the v0.7.1-osm-exposure corpus: v0.7.0-de-holdout plus OpenStreetMap address rows for
# RU, CN, IN, ID, NG, PK, BD and VN from the 2026-10-02 Geofabrik extracts, clipped to each country's
# geoBoundaries outline and routed through `corpus split-slice`.
#
# The differences from v7.0.0-de-holdout-60k.yaml are:
#
# 1. `data.corpus_dir` moves to v0.7.1-osm-exposure.
#
# 2. Country admission, source admission and sampling weight are three settings here. `country_weights`
#    already admitted all eight countries in v7.0.0 and is unchanged. Each country's OSM rows carry their
#    own source id, so admitting a country does not admit every source for it:
#
#    - `osm-cn` is weighted 0.0. Its 50,963 train rows are Han script, which the weights-family registry
#      routes to the CJK character family rather than to this Latin graph. Admitting them here would
#      teach Han through SentencePiece byte fallback.
#    - `osm`, the September PK, VN and BD rows, is weighted 0.0. `osm-pk`, `osm-vn` and `osm-bd` are the
#      2026-10-02 refresh of the same three extracts, and keeping both would draw the same addresses twice.
#
# 3. The new sources' weights come from their realized train rows through `source_reps`, which sets
#    passes per row over the run's 60,000 × 128 = 7,680,000 samples:
#
#      source   train rows   reps   draws over the run
#      osm-in       51,534    2.0     103,068
#      osm-id       53,012    2.0     106,024
#      osm-ng        6,702    4.0      26,808
#      osm-vn       68,482    1.0      68,482
#      osm-pk       79,482    1.0      79,482
#      osm-bd       11,122    2.0      22,244
#      osm-ru    1,996,290    0.2     399,258
#
#    A source near 50,000 rows takes two passes and the 6,702 Nigerian rows take four, so no country is
#    repeated more than four times. Russia's rows outnumber the run's budget for one country, so its reps
#    is set for about 400,000 draws, 5.2% of the run, rather than for a pass count. The overlay holds a
#    2,000,177-row sample of Russia's 6,453,759 canonical rows, the rows whose sha256(source_id) falls in
#    the lowest 31% of the hash space.
#
# 4. Each new source has a receipt at 90% of its expected draws over the audit's 1,000,000-row epoch,
#    which is the draws above × 1,000,000 / 7,680,000. A mixture change that stopped reaching a source
#    refuses before a GPU starts.
#
# 5. Every admitted new country has a validation floor, so none enters train with an empty held-out
#    split. The floors are presence checks of 20 rows and 10 street rows. NG's val holds 24 rows. That is
#    too few to read a phenomenon from, and the decoder-exposure record states it.
#
# 6. `train.output_dir` and `train.trackio_run_name` name the v710 run.
#
# The run is from scratch with `--resume none`, because a fine-tune cannot introduce sources the base
# never saw except as an explicitly scoped additive run with its placebo in hand. The exposure curve
# v4.15.0 is that scoped run for Russia.

