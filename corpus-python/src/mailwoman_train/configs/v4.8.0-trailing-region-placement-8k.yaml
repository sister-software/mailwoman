# v4.8.0 — trailing-region PLACEMENT (#1748 / #1821)
#
# WHAT v4.7.0 GOT WRONG, and it was not the dose. Its slice emitted the postcode only at the HEAD
# (`const head = ... ${postcode} `), so every one of its 17,908 rows was postcode-LEADING. That was
# correct for its four source countries — FR, DE, ES and IT all write the code first — and it silently
# decided which countries the slice could teach, because the same digits change TAG with position.
#
# Measured on the shipped model, one row moved one slot:
#
#   Heladeria Frappe Mania, Avenida Country Club, Barcelona 6001, Anzoategui, Venezuela
#     -> house_number 6001 | street "Avenida Country Club, Barcelona" | locality "Anzoategui"   573 km
#   Heladeria Frappe Mania, Avenida Country Club, 6001 Barcelona, Anzoategui, Venezuela
#     -> postcode 6001 | locality "Barcelona"                                                   correct
#
# `Sandton 2196` vs `2196 Sandton` behaves the same way. No decode-time lever moves it:
# postcodeShapeCoherence=true leaves all eight VE board rows byte-identical. So this is corpus.
#
# WHAT IS ADDED: synth-trailing-region-structured v25 — 32,125 rows from 32,435 REAL
# (postcode, locality, region) triples, in TWO placements, each attested by a gauntlet board row:
#   leading       16,435 rows  FR DE ES IT NL PT MX   "8600-315 Lagos, Algarve, Portugal"     (pt_structured)
#   after_region  16,000 rows  IN                     "Bengaluru, Karnataka 560038, India"    (in_structured)
#
# The leading arm is NOT filler — it is the counter-distribution. `no-fragment.ts`'s header records
# what happens without one: teaching a new surface alone flips the model's default rather than
# teaching it a distinction. FR/DE/ES/IT pass on the leading form today and must keep passing.
#
# VE gets ZERO rows and cannot get any — GeoNames does not publish Venezuela and nothing else on disk
# carries a VE postcode. Whether IN's after_region rows generalize to VE's after_locality is the
# question this run exists to answer, against 4 ve_city_postcode_trailing_state rows already on the board.
#
# KNOWN LIMITATION for the model card: all 16,000 trailing rows are IN. The run cannot distinguish
# "learned after_region" from "learned India" using the trailing arm alone. The VE rows separate them.
#
# EXTRACTION is committed now (packages/corpus/lib/tools/postcode-triples.ts); v0.24.0's was a one-off
# that never landed, which is why the slice was unbuildable for a new country. Route notes in its
# docstring: parent_id joins for FR/DE/ES/IT/NL only, GeoNames carries the triple inline for PT/MX/IN,
# and nearest-locality-centroid was measured (13.5-81.1% agreement) and REJECTED.
#
# COUNTRY_WEIGHTS is now 134 codes, up from 25. `data_loader.py:301` drops any country absent from the
# map, so the old 25 was the exhaustive training-country list and everything else was silently dropped
# — the Norway bug's mechanism, still live for every other country. The new map is the union of the
# shipped 25, IN, all 129 gauntlet-board countries, and KR/TW.
#
# KR and TW are the one judgement call here: neither is on the board, but both carry corpus rows
# (1,083,156 and 678,660) of the same wof-admin toponym class as CN and JP, which the board does carry.
# #288 validates JP/KR/TW together; admitting two of the three would teach the model that Korean and
# Taiwanese toponyms are not places.
#
# COST of the expansion, measured rather than assumed: 0.778% of every epoch. country_weights is a
# per-row admission gate applied INSIDE each source's stream, and the source multinomial fixes each
# source's draw share — so admitting CN's 11.36M rows does not buy CN 1.7% of the run. CN's rows live
# almost entirely in wof-admin, which is 1.155% of draws, so CN lands at 0.368%.
#
# 101 of the 134 codes have ZERO rows in the corpus. They admit nothing today and are declarations of
# intent; train_remote.py's completeness audit reports them as "0 rows seen", which is correct and not
# a failure. The two that matter and are NOT inert: IN (this slice's 16,000 rows) and NZ (11,957).
#
# ADMITTED FOR THE FIRST TIME, with rows: CN 11,357,947 | JP 2,092,821 | KR 1,083,156 | TW 678,660 |
# NZ 11,957 | TR 1,124 | LB 1,117 | JO 1,101 | GE 1,071 | AS 5. All are 0.0% street-level wof-admin
# toponyms. This is NOT the JP work: #296 and the v8-jp-full slice teach JP block structure under the
# 47-label `stage3-jp` set (STAGE3_TAGS + JP_FINE_TAGS), which needs a wider head and an additive
# fine-tune. Admitting JP here teaches toponym recognition only.
#
# DOSE: 3 reps/row x 32,125 rows against 155.0 other-source total over 8,000 x 128 = 1,024,000 samples
# -> 16.10, a 9.4% share. v4.7.0 was 6 reps x 17,908 -> 18.17 at 10.5%. Nearly the same dose, twice the
# surface breadth, and six reps is now arithmetically impossible at this row count.
#
# PRE-REGISTERED GATE (set before the run):
#   1. the gated fraction does not lose a row;
#   2. FR and DE show no regression anywhere - iron rule 6, the D-rule;
#   3. the 4 ve_city_postcode_trailing_state rows are the IMPROVEMENT metric, not the gate;
#   4. WATCH: tier-1 must not regress from the 134-country admission. If it does, the expansion and the
#      placement change are separable - re-run with the 25-country map to attribute.

