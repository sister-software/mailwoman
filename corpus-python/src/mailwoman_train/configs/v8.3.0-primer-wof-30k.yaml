# v8.3.0-primer-wof-30k is the address-structure primer (#2854): a from-scratch run on the Who's On First sources alone,
# whose final checkpoint v8.3.0-base-c6-60k.yaml starts from. It teaches how an address's admin levels nest, the
# order each country and language writes them in, and each level's written forms, before the corpus teaches the rest.
#
# It is v8.3.0-base-c6-60k.yaml with these differences:
#
# 1. `data.corpus_dir` is the v0.8.5-overlay, whose wof-admin renders every structural chain of a record's canonical
#    and colloquial names (v0.8.5-wof-structure).
# 2. `data.source_weights` names wof-admin and wof-postalcode only. The loader drops every source a config's weights
#    leave out, so the run reads these two.
# 3. The corpus receipts, validation coverage floors and label support floors are left out: they require street,
#    venue and address-system rows, which the two sources do not hold. `source_reps` is left out with them.
# 4. `train.max_steps` is 30,000 with a 500-step warmup, an evaluation every 1,000 steps and a save every 5,000.
#    At 128 rows a step the run reads 3,840,000 rows. The overlay's wof-admin and wof-postalcode files are
#    country-capped samples of their builds in hash order, so each row group the loader reads is a sample of the whole
#    file rather than a run of neighboring records.
# 5. `train.output_dir` and `train.trackio_run_name` name the run.
#
# Launch with `--fresh`: 30,000 steps on an A100-40GB.

data:
  corpus_dir: /data/corpus/versioned/v0.8.5-overlay/corpus-v0.8.5-overlay
  tokenizer_dir: /data/models/tokenizer/v0.10.0-c6-isolated-punctuation
  max_length: 128
  # `NO` is quoted because YAML 1.1 reads a bare `NO` as false. A false key would match no Norwegian row.
  country_weights:
    {
      AD: 1.0, AE: 1.0, AF: 1.0, AG: 1.0, AI: 1.0, AL: 1.0, AM: 1.0, AO: 1.0, AR: 1.0, AS: 1.0, AT: 1.0, AU: 1.0,
      AW: 1.0, AX: 1.0, AZ: 1.0, BA: 1.0, BB: 1.0, BD: 1.0, BE: 1.0, BF: 1.0, BG: 1.0, BH: 1.0, BI: 1.0, BJ: 1.0,
      BL: 1.0, BM: 1.0, BN: 1.0, BQ: 1.0, BR: 1.0, BS: 1.0, BT: 1.0, BW: 1.0, BY: 1.0, BZ: 1.0, CA: 1.0, CD: 1.0,
      CF: 1.0, CG: 1.0, CH: 1.0, CI: 1.0, CK: 1.0, CL: 1.0, CN: 1.0, CO: 1.0, CR: 1.0, CU: 1.0, CV: 1.0, CW: 1.0,
      CY: 1.0, CZ: 1.0, DE: 1.0, DJ: 1.0, DK: 1.0, DM: 1.0, DO: 1.0, DZ: 1.0, EC: 1.0, EE: 1.0, EG: 1.0, ER: 1.0,
      ES: 1.0, ET: 1.0, FI: 1.0, FK: 1.0, FM: 1.0, FO: 1.0, FR: 1.0, GB: 1.0, GD: 1.0, GE: 1.0, GF: 1.0, GG: 1.0,
      GH: 1.0, GI: 1.0, GL: 1.0, GM: 1.0, GN: 1.0, GP: 1.0, GR: 1.0, GT: 1.0, GU: 1.0, GW: 1.0, HK: 1.0, HN: 1.0,
      HR: 1.0, HT: 1.0, HU: 1.0, ID: 1.0, IE: 1.0, IL: 1.0, IM: 1.0, IN: 1.0, IO: 1.0, IQ: 1.0, IR: 1.0, IS: 1.0,
      IT: 1.0, JE: 1.0, JM: 1.0, JO: 1.0, JP: 1.0, KE: 1.0, KG: 1.0, KH: 1.0, KM: 1.0, KN: 1.0, KR: 1.0, KW: 1.0,
      KY: 1.0, KZ: 1.0, LA: 1.0, LB: 1.0, LC: 1.0, LI: 1.0, LK: 1.0, LR: 1.0, LS: 1.0, LT: 1.0, LU: 1.0, LV: 1.0,
      MA: 1.0, MC: 1.0, MD: 1.0, ME: 1.0, MF: 1.0, MG: 1.0, MH: 1.0, MK: 1.0, ML: 1.0, MM: 1.0, MN: 1.0, MO: 1.0,
      MP: 1.0, MQ: 1.0, MS: 1.0, MT: 1.0, MU: 1.0, MV: 1.0, MW: 1.0, MX: 1.0, MY: 1.0, MZ: 1.0, NA: 1.0, NC: 1.0,
      NE: 1.0, NG: 1.0, NI: 1.0, NL: 1.0, "NO": 1.0, NP: 1.0, NZ: 1.0, OM: 1.0, PA: 1.0, PE: 1.0, PF: 1.0, PG: 1.0,
      PH: 1.0, PK: 1.0, PL: 1.0, PM: 1.0, PR: 1.0, PT: 1.0, PY: 1.0, QA: 1.0, RE: 1.0, RO: 1.0, RS: 1.0, RU: 1.0,
      RW: 1.0, SA: 1.0, SB: 1.0, SC: 1.0, SD: 1.0, SE: 1.0, SG: 1.0, SH: 1.0, SI: 1.0, SK: 1.0, SM: 1.0, SN: 1.0,
      SO: 1.0, SR: 1.0, ST: 1.0, SV: 1.0, SX: 1.0, SZ: 1.0, TC: 1.0, TH: 1.0, TJ: 1.0, TK: 1.0, TM: 1.0, TN: 1.0,
      TO: 1.0, TR: 1.0, TT: 1.0, TW: 1.0, TZ: 1.0, UA: 1.0, UG: 1.0, UM: 1.0, US: 1.0, UY: 1.0, UZ: 1.0, VA: 1.0,
      VC: 1.0, VE: 1.0, VG: 1.0, VI: 1.0, VN: 1.0, VU: 1.0, WF: 1.0, YT: 1.0, ZA: 1.0, ZM: 1.0, ZW: 1.0,
    }
  # The admin hierarchy is the primer's subject, and the postcode rows place a postcode inside it.
  source_weights:
    wof-admin: 2.0
    wof-postalcode: 1.0
  train_rows_per_epoch: 1000000
  val_rows: 24576
  coarse_filter: true
  augment_directional_prob: 0.3
  augment_region_prob: 0.3
  augment_glue_prob: 0.25
  augment_ordinal_prob: 0.3
  augment_punct_drop_prob: 0.3
  augment_postcode_move_prob: 0.0
  anchor_lookup_path: /data/anchor/pilot-anchor-lookup-v2-2026-08-05.json
  gazetteer_lexicon_path: /data/gazetteer/anchor-lexicon-v1.json
  country_lexicon_path: /data/gazetteer/country-surface-lexicon-v1.json
  gazetteer_choreography: true
  affix_relabel_lexicon_path: /data/gazetteer/affix-relabel-lexicon-v2.json
  anchor_paint_mode: shaped
  anchor_value_mode: posterior_latlon
  street_type_lexicon_path: /data/gazetteer/street-type-lexicon-v3.json
  locality_surface_lexicon_path: /data/gazetteer/locality-surface-lexicon-v7.json

model:
  hidden_size: 384
  use_span_boundary_head: true
  use_deploc_head: false
  span_boundary_loss_weight: 0.5
  num_hidden_layers: 6
  num_attention_heads: 6
  intermediate_size: 1536
  max_position_embeddings: 128
  type_vocab_size: 1
  hidden_dropout_prob: 0.1
  attention_probs_dropout_prob: 0.1
  use_crf: true
  crf_loss_weight: 0.0
  crf_normalization: per_sequence
  label_smoothing: 0.1
  use_locale_conditioning: true
  locale_loss_weight: 0.3
  use_address_system_head: true
  address_system_loss_weight: 0.3
  use_locale_hint: true
  locale_hint_drop_prob: 0.5
  locale_hint_noise_prob: 0.05
  use_postcode_anchor: true
  use_gazetteer_anchor: true
  gazetteer_feature_dim: 5
  use_country_anchor: true
  country_feature_dim: 2
  use_street_type_anchor: true
  street_type_feature_dim: 1
  use_locality_surface_anchor: true
  locality_surface_feature_dim: 2
  country_ambiguous_scale: 0.5
  class_weights:
    O: 0.5
    B-country: 3.5
    I-country: 3.5
    B-region: 1.5
    I-region: 1.5
    B-locality: 2.0
    I-locality: 2.0
    B-dependent_locality: 1.0
    I-dependent_locality: 1.0
    B-postcode: 1.5
    I-postcode: 1.5
    B-subregion: 0.3
    I-subregion: 0.3
    B-cedex: 1.0
    I-cedex: 1.0
    B-venue: 1.5
    I-venue: 1.5
    B-street: 2.0
    I-street: 2.0
    B-house_number: 1.5
    I-house_number: 1.5
    B-street_prefix: 1.5
    I-street_prefix: 1.5
    B-street_suffix: 1.5
    I-street_suffix: 1.5
    B-unit: 1.5
    I-unit: 1.5
    B-po_box: 1.5
    I-po_box: 1.5
    B-intersection_a: 1.0
    I-intersection_a: 1.0
    B-intersection_b: 1.0
    I-intersection_b: 1.0
  use_phrase_priors: true
  phrase_feature_dim: 10

train:
  output_dir: /data/output-v830-primer-wof-30k-s42/checkpoints
  seed: 42
  batch_size: 128
  eval_batch_size: 128
  grad_accum_steps: 1
  learning_rate: 5.0e-4
  weight_decay: 0.01
  warmup_steps: 500
  grad_clip_norm: 1.0
  max_steps: 30000
  eval_every_steps: 1000
  save_every_steps: 5000
  log_every_steps: 100
  precision: bf16
  num_workers: 0
  csv_log_path: "{output_dir}/../train_log.csv"
  lr_schedule: cosine
  gazetteer_curriculum: true
  evidence_curriculum: true
  evidence_noise_prob: 0.15
  fisher_capture: false
  trackio_project: mailwoman
  trackio_run_name: v830-primer-wof-30k-s42

eval:
  golden_dir: /data/eval/golden/v0.1.3
  val_jsonl: ""
