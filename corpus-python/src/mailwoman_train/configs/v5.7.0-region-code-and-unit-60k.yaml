# v5.7.0 — three admin-tail surfaces the corpus has never carried, each with its own probe
#
# Control: v5.6.0-bare-postcode-60k.yaml at seed 42. This config differs from it in the corpus
# version, three `source_reps`/`source_weights` lines, one supersession, and three receipts. FROM
# SCRATCH: no `init_from`, launched with `--resume none`.
#
# WHY ONE ARM CARRIES THREE ADDED SOURCES. v5.6.0 added exactly one and said so, because a single
# added source makes every difference between the arms attributable to it. Three stays attributable
# here for a different reason: each has its own pre-registered probe over a capability the other two
# cannot touch, and none of the three shares an instrument with another.
#
#   #2303  a US city in front of a state code and a ZIP   the four-arm table over 581 US cities
#   #2299  the Canadian province codes `NL` and `PE`      the thirteen-province probe
#   #2298  a bare identifier as a secondary unit          the six-row ablation on `301 College Ave, 101, …`
#
# Run separately these are three 60,000-step runs answering three questions that share no metric.
#
# WHAT IS BEING FIXED, and the count behind each.
#
# 1. `Washington, DC 20003` answers a locality 53.2% of the time (309/581 distinct US cities through
#    the production path) against 99.7% for `123 Main St, Washington, DC 20003` (579/581). Every US
#    recipe that pairs a city with a state code and a ZIP puts a STREET in front of the city, and
#    `POSTCODE_CONVENTIONS` had no US entry at all, so the bare surface was never written. Adding it
#    needed three things besides the table row: `lookupUSState`, because GeoNames publishes
#    `California` and never `CA`; a per-country GeoNames locality COLUMN, because column 3 is the city
#    for the US while admin2 is the county — the inverse of PT/MX/IN. and a round-robin over the
#    region in `applyCountryBudget`, because source order is postcode order and the US was taking its
#    16,000 rows from 23 of 56 states.
#
# 2. `Swiss Chalet, 92 Laurel Rd, Gander, NL A1V 0A9, Canada` answers `country: NL` — the Netherlands
#    — with `Canada` written in full in the same string. `census_region_code_token` counted every
#    two-letter uppercase token by the tag it opens over one epoch of the v5.6.0 mixture: `NL` appears
#    45 times per million emitted rows and every one is `country`; `PE` never opens a span at all;
#    only `DE` and `CA` carry both readings. So the region reading of a Canadian province code is at
#    ZERO, which is the same shape as v5.6.0's bare postcode and not a margin to beat.
#
# 3. `301 College Ave, 101, Athens, GA 30601` drops the `101` entirely. `census_comma_segment_number`
#    counted a digit group standing alone in its own comma segment: 2,923 per million in the leading
#    position, every one a postcode, and zero in a later segment at either level. Nothing competes —
#    but `Athens, GA, 30601` puts a postcode in exactly that position and is right today only by
#    generalization, so the rebuilt recipe writes both readings rather than the unit alone.
#
# EXPOSURE, and where each number comes from. 60,000 steps x batch 128 = 7,680,000 samples.
#
#   synth-trailing-region-us       1.0 x 16,000 =  16,000 draws, 0.21% of the run
#   synth-trailing-region-ca-bare  4.0 x 13,740 =  54,960 draws, 0.72% of the run
#   synth-unit-v30                 weight 1.5, the exposure `synth-unit` already drew (9,013/epoch)
#
# The US source takes one pass, like `synth-bare-postcode`, because its 16,000 rows are distinct real
# (postcode, city, state) triples rather than templated variations. 12,000 of them carry no street at
# all and 4,000 write the region as a code, so one pass delivers 4,000 instances of the exact family
# the issue measured against v5.6.0's ~3,900 for the shape that worked.
#
# The Canadian source takes four, and that number is set against a count rather than by symmetry. Its
# 13,740 rows carry 188 that write `NL` and 169 that write `PE`. The mixture already carries `NL` as a
# country 45 times per million emitted rows, which is about 345 over this run. One pass leaves the
# region reading outnumbered 188 to 345. two reaches parity. four puts it at 752 against 345, on the
# right side of 2:1. Eight would reach 4.4:1 and spend 1.43% of the run on one country's admin tail,
# which is more than the margin needs.
#
# `synth-unit-v30` SUPERSEDES `synth-unit` and inherits its weight unchanged, because it is the same
# recipe over the same sources with two surfaces added — not a new exposure decision. Its predecessor
# goes to 0.0, the `-v22`/`-v21` pattern.
#
# PRE-REGISTERED WATCH. Grade these in order, before any target metric:
#
#   1. The D-rule floors. `fr.bare_street_intact` in the promotion battery (v5.5.0 raised it 95 -> 100)
#      and the target-family boards v5.4.0 won: `sg/register.jsonl` 118/240, `us/family-po-box.jsonl`
#      6/6, `ve/family-locality-postcode.jsonl` 5/5. FR and US are tier 1. a drop disqualifies the arm.
#
#   2. #2303's four arms, `us-city-state-postcode-arms.run.ts`, same 581-city panel. Baseline under
#      v5.6.0: bare 53.2% (309/581), with-country 61.4% (357/581), with-street 99.7% (579/581). The
#      bare arm must approach the street arm. THE REVERSE IS THE SAME MEASUREMENT: `street_only`
#      renders each city's own street where the city would sit, and 579 of 581 correctly answer no
#      locality today. That number may not fall — teaching `«city», «ST» «ZIP»` must not turn a street
#      before a state code into a locality.
#
#   3. #2299's thirteen-province probe. `Gander, NL A1V 1M6, Canada` must answer `country: Canada` and
#      `region: NL`; `Charlottetown, PE C1A 7W6, Canada` must keep `Charlottetown` as the locality.
#      The two passing controls in `cases/ca/region-code-collision.jsonl` must stay passing:
#      `Charlottetown, PE, Canada` and `Halifax, NS B3H 1R2, Canada`.
#
#   4. #2298's ablation, and a PO-BOX arm beside it. `301 College Ave #101, Athens, GA 30601` must
#      reach `address_point` at 33.959694 / -83.3763072, and `301 College Ave, 101, Athens, GA 30601`
#      must tag `101` as a unit. `Athens, GA, 30601` must still answer `postcode: 30601` and not a
#      unit — that is the counter-reading the recipe writes for exactly this check. A gain on units
#      may not be paid for with a loss on `PMB #`.
#
# The three receipts below fail the run before the GPU starts if any added source does not draw.

