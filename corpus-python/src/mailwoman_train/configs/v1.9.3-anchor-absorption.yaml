# This probe resumes v1.9.2-multilocale-au.yaml from its step-40000 checkpoint and trains 2000 more
# steps with the postcode anchor painted by shape. It keeps the v1.9.2 corpus, whose US rows already
# contain five-digit house numbers. The a1 to a3 recipes add the synth-anchor-absorption source.
#
# At inference, the postcode anchor fires on every postcode-shaped span. Training painted it only on
# gold postcode spans, so the model never saw the anchor fire on a house number shaped like a postcode,
# such as the 12345 in "12345 Main St". With anchor_paint_mode set to shaped, training paints the anchor
# on postcode-shaped spans as well. The loader paints when it encodes a row, so the corpus needs no rebuild.
#
# Launch it from corpus-python with:
#   modal run -d -m launch.train_remote --config v1.9.3-anchor-absorption.yaml --resume <v192-ckpt>
data:
  corpus_dir: /data/corpus/versioned/v0.9.2-multilocale-au/corpus-v0.9.2-multilocale-au
  tokenizer_dir: /data/models/tokenizer/v0.6.0-a0
  max_length: 128
  country_weights: # These match v1.9.2.
    US: 1.0
    FR: 1.0
    DE: 1.0
    ES: 1.0
    IT: 1.0
    NL: 1.0
    PT: 1.0
    BE: 1.0
    PL: 1.0
    AT: 1.0
    CH: 1.0
    CZ: 1.0
    DK: 1.0
    "NO": 1.0
    SE: 1.0
    FI: 1.0
    IE: 1.0
    GB: 1.0
    SK: 1.0
    SI: 1.0
    HR: 1.0
    HU: 1.0
    AU: 1.0
  source_weights: # These match v1.9.2.
    wof-admin: 2.0
    wof-postalcode: 2.0
    ban: 3.0
    tiger: 4.0
    usgov-nppes: 2.0
    usgov-hrsa-fqhc: 2.0
    usgov-imls-pls: 2.0
    usgov-nad: 1.0
    state-ia-contractors: 2.0
    state-tx-notaries: 1.5
    state-ny-notaries: 2.0
    deepseek-kryptonite: 3.0
    synth-intersection: 1.0
    synth-german: 6.0
    synth-fr-order: 3.0
    synth-fr-admin-split: 6.0
    synth-unit: 1.5
    synth-po-box-cedex: 1.5
    synth-affix: 2.0
    synth-country: 2.0
    overture: 3.0
    gnaf: 6.0
    # The v1.9.2 corpus has no synth-anchor-absorption rows. The a1 to a3 recipes enable this source.
    # synth-anchor-absorption: 6.0
  train_rows_per_epoch: 1000000
  val_rows: 4096
  coarse_filter: true
  augment_directional_prob: 0.3
  augment_region_prob: 0.3
  augment_glue_prob: 0.25
  anchor_lookup_path: /data/anchor/pilot-anchor-lookup.json
  gazetteer_lexicon_path: /data/gazetteer/anchor-lexicon-v1.json
  gazetteer_choreography: true
  affix_relabel_lexicon_path: /data/gazetteer/affix-relabel-lexicon-v1.json
  # anchor_paint_mode accepts gold, the default, or shaped.
  anchor_paint_mode: shaped
  # The anchor value keeps the country posterior, which separates five-digit US, DE and FR postcodes.
  # No training code reads anchor_value_mode or region_centroids_path yet.
  anchor_value_mode: posterior_latlon
  # region_centroids_path: /data/anchor/region-centroids.json
  # Anchor dropout comes from the curriculum in train/noise.py, which zeroes the anchor on up to 15% of
  # rows. The ramp ends at half of max_steps, so a run resumed at step 40000 starts at full strength.

model: # These match v1.9.2.
  hidden_size: 384
  num_hidden_layers: 6
  num_attention_heads: 6
  intermediate_size: 1536
  max_position_embeddings: 128
  type_vocab_size: 1
  hidden_dropout_prob: 0.1
  attention_probs_dropout_prob: 0.1
  use_crf: true
  crf_loss_weight: 0.0
  crf_normalization: per_sequence
  label_smoothing: 0.1
  use_locale_conditioning: true
  locale_loss_weight: 0.3 # A low weight keeps the model from relying on the locale head for this decision.
  use_postcode_anchor: true
  use_gazetteer_anchor: true
  gazetteer_feature_dim: 5
  class_weights:
    O: 0.5
    B-country: 3.5
    I-country: 3.5
    B-region: 1.5
    I-region: 1.5
    B-locality: 2.0
    I-locality: 2.0
    B-dependent_locality: 0.3
    I-dependent_locality: 0.3
    B-postcode: 1.5
    I-postcode: 1.5
    B-subregion: 0.3
    I-subregion: 0.3
    B-cedex: 1.0
    I-cedex: 1.0
    B-venue: 1.5
    I-venue: 1.5
    B-street: 2.0
    I-street: 2.0
    B-house_number: 1.5
    I-house_number: 1.5
    B-street_prefix: 1.5
    I-street_prefix: 1.5
    B-street_suffix: 1.5
    I-street_suffix: 1.5
    B-unit: 1.5
    I-unit: 1.5
    B-po_box: 1.5
    I-po_box: 1.5
    B-intersection_a: 1.0
    I-intersection_a: 1.0
    B-intersection_b: 1.0
    I-intersection_b: 1.0
  use_phrase_priors: true
  phrase_feature_dim: 10

train: # These match v1.9.2 except for output_dir, max_steps and trackio_run_name.
  output_dir: /data/output-v193-anchor-absorption-s42/checkpoints
  seed: 42
  batch_size: 128
  eval_batch_size: 128
  grad_accum_steps: 1
  learning_rate: 1.5e-4
  weight_decay: 0.01
  warmup_steps: 1000
  grad_clip_norm: 1.0
  # A resume restores the step counter at 40000, so this limit trains 2000 more steps.
  max_steps: 42000
  eval_every_steps: 2000
  save_every_steps: 2000
  log_every_steps: 50
  precision: bf16
  num_workers: 0
  csv_log_path: "{output_dir}/../train_log.csv"
  lr_schedule: constant
  gazetteer_curriculum: false
  trackio_project: mailwoman
  trackio_run_name: v1.9.3-anchor-absorption-s42

eval:
  golden_dir: /data/eval/golden/v0.1.2
  val_jsonl: ""
