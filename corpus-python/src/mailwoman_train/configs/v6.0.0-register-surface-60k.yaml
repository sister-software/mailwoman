# v6.0.0 — the corpus every row of which says where it came from, and five locales it had never read
#
# This config moves several variables at once, and a header claiming one would be false. It reads a
# corpus rebuilt from source rather than overlaid onto v0.5.0, so every row in it is redrawn. What
# follows is each difference from v5.9.0-locality-shape-60k.yaml and what it costs to read.
#
# 1. `data.corpus_dir` moves to v0.6.0-register-surface, which is the v0.5.0 base rebuilt from the
#    same 11 adapters and the same inputs. Every row carries three columns v0.32.0 had not:
#
#      recipe    which recipe produced the surface — the old `synth_method` values, renamed
#      register  which publication the underlying record came from, or null when the row names none
#      surface   attested | composed | invented
#
#    `synth_method` answered two questions with one value. `de/recipes/locale.ts` wrote "german" on a
#    row built from a German OpenAddresses register and `recipes/intersection.ts` wrote
#    "intersection" on a row assembled from templates, and `locale_supply_census` read both as
#    synthesized. It reported GB's 800,000 HM Land Registry rows as fabricated, and a reader
#    concluded GB had little real supply.
#
#    Measured over the 33 overlays, 5,232,708 rows: attested 3,180,624, composed 1,862,561, invented
#    189,523. The 189,523 rows carrying no register are exactly the 189,523 reading `invented`.
#
# 2. The rows are shuffled within a 250,000-row window before they are written (#2347). A source's
#    epoch draw reads one row-group, a row-group holds 50,000 rows, and a source's draw was measured
#    at 17,269 — 35% of one group. Rows reached parquet in adapter order. Adapter order is country
#    order within a source: `wof-admin/part-0000.parquet` row-group 0 held JP, CN, FR and US, while
#    row-groups 10 and 19 held 50,000 US rows each. 204 of that source's 800 row-groups held exactly
#    one country. The draw now samples the source instead of a corner of it.
#
#    This is the change that makes every row of this corpus a different row from v0.32.0's, and it
#    is why no arm trained on this corpus is a controlled comparison against one trained on that.
#    `tests/mailwoman_train/data/test_loader_split_parity.py` pins the seeded row sequence and is
#    re-pinned against this corpus rather than adjusted until it passes.
#
# 3. Five locales the corpus had never read, each a national address register with one countrywide
#    CSV already on disk and no reader pointed at it:
#
#      synth-pt  800,000 rows drawn from 5,667,574   Portugal
#      synth-ch  800,000 rows drawn from 2,759,181   Switzerland
#      synth-hr  800,000 rows drawn from 1,679,500   Croatia
#      synth-sk  200,000 rows drawn from   219,728   Slovakia
#      synth-lu  150,000 rows drawn from   164,415   Luxembourg
#
#    Each at weight 6.0, which is what `synth-gb` and `synth-german` carry, because they are the same
#    kind of source. The weight is per draw rather than per row, so Luxembourg at 150,000 rows is
#    presented more often per row it holds than Portugal at 800,000. For a locale the model has never
#    seen, that is the intended reading rather than an accident.
#
#    `country_weights` gains LU. It already admitted PT, CH, HR and SK at 1.0 while the corpus held
#    no row for any of them, which is the gap #2347's funnel exists to make visible.
#
#    Three countries with an extract on disk are deliberately absent, each recorded at its
#    `COUNTRY_SOURCES` call site. Saudi Arabia is Arabic script and this repository ships no Arabic
#    graph. Iceland carries a locality on 19 of its 125,681 rows. Estonia is blocked by
#    `cleanCityNoise`, not by supply: its CITY is two admin levels joined by a comma
#    (`Rae vald,Rae küla`) and rule 1 drops any city containing one, which is 355,767 of its first
#    400,000 rows. That rule was derived from an audit of ES, IT and NL and Estonia was never
#    measured against it.
#
# 4. `data.required_validation_coverage` is declared for the first time. `ValidationCoverageConfig`
#    and the audit that raises on a shortfall were added earlier in this arc, and no config carried
#    the key, so iron rule 6's precondition — 1,000 validation rows and 1,000 street rows per
#    locale — was stated in prose and checked by nothing.
#
#    GB declares both floors, and that is the test of whether the holdout added to
#    `defaultHoldouts()` reached its rows. The last census read 0 validation rows and 0 validation
#    street rows for GB. A holdout takes effect only at a base rebuild, and this is that rebuild.
#
#    FR and DE declare a row floor and no street floor. Both carry validation rows and neither
#    carries a validation street row — FR 12,898 rows and 0 street, DE 33,801 test rows and 0 street.
#    Closing that needs a holdout change rather than a run that refuses to start, so the floor states
#    what holds today and the gap stays recorded in CONTRIBUTING_MODEL_WORK.mdx.
#
# 5. `data.required_corpus_receipts` gains a 1,000-draw floor for each of the five new locales and
#    one for each of Brazil and Mexico, so a run that fails to reach one stops rather than training.
#    1,000 is a requirement rather than a prediction: below it a locale has not been taught at all.
#    Brazil and Mexico draw from the same source, `overture-latam`, so each receipt names its country
#    as well. `audit_epoch_mixture` reports the realized draw beside each floor, and it now also
#    reports every admitted country's draw including the zeros, so a country at weight 1.0 that draws
#    nothing is distinguishable from one nobody admitted.
#
# Run shape: from scratch. No `train.init_from`, launched with `--resume none`, the same shape
# v5.7.0, v5.8.0 and v5.9.0 used. A fine-tune cannot introduce a source the base never saw, and this
# corpus introduces six.
#
# Control: none of the arms before it. v5.9.0 read a corpus this one does not extend, so the placebo
# for this base has to be run against this base. `mwdev_arc`'s `null=` arm is a no-new-data
# fine-tune off this corpus, and it has not been run.
#
# Everything else — every other weight, every rep target, the model and train blocks, the eval
# block — is v5.9.0 verbatim.

data:
  corpus_dir: /data/corpus/versioned/v0.6.0-register-surface/corpus-v0.6.0-register-surface
  tokenizer_dir: /data/models/tokenizer/v0.9.0-multisplice
  max_length: 128
  country_weights:
    AD: 1.0
    AE: 1.0
    AF: 1.0
    AG: 1.0
    AI: 1.0
    AL: 1.0
    AO: 1.0
    AR: 1.0
    AS: 1.0
    AT: 1.0
    AU: 1.0
    AW: 1.0
    BA: 1.0
    BB: 1.0
    BD: 1.0
    BE: 1.0
    BF: 1.0
    BI: 1.0
    BJ: 1.0
    BM: 1.0
    BN: 1.0
    BQ: 1.0
    BR: 1.0
