    FR: 1.0
    GB: 1.0
    GD: 1.0
    GE: 1.0
    GH: 1.0
    GM: 1.0
    GT: 1.0
    GW: 1.0
    HK: 1.0
    HR: 1.0
    HU: 1.0
    ID: 1.0
    IE: 1.0
    IL: 1.0
    IM: 1.0
    IN: 1.0
    IO: 1.0
    IS: 1.0
    IT: 1.0
    JO: 1.0
    JP: 1.0
    KH: 1.0
    KR: 1.0
    KW: 1.0
    KY: 1.0
    LB: 1.0
    LU: 1.0
    MA: 1.0
    ML: 1.0
    MN: 1.0
    MP: 1.0
    MS: 1.0
    MU: 1.0
    MW: 1.0
    MX: 1.0
    MY: 1.0
    NA: 1.0
    NE: 1.0
    NG: 1.0
    NI: 1.0
    NL: 1.0
    # Quoted, because YAML 1.1 reads a bare `no` as the boolean false — the key then never matches a
    # row's `country`, and `synth-no-fragment` (33,203 rows, all no) becomes unselectable.
    "NO": 1.0
    NZ: 1.0
    OM: 1.0
    PE: 1.0
    PG: 1.0
    PH: 1.0
    PK: 1.0
    PL: 1.0
    PM: 1.0
    PR: 1.0
    PT: 1.0
    RU: 1.0
    RW: 1.0
    SA: 1.0
    SB: 1.0
    SC: 1.0
    SE: 1.0
    SG: 1.0
    SH: 1.0
    SI: 1.0
    SK: 1.0
    SM: 1.0
    SO: 1.0
    SR: 1.0
    ST: 1.0
    SV: 1.0
    SX: 1.0
    TH: 1.0
    TK: 1.0
    TM: 1.0
    TO: 1.0
    TR: 1.0
    TT: 1.0
    TW: 1.0
    UA: 1.0
    US: 1.0
    VE: 1.0
    VG: 1.0
    VI: 1.0
    VN: 1.0
    VU: 1.0
    ZA: 1.0
  source_weights:
    synth-house-venue: 2.0
    synth-reviewed-postcode-tail: 0.05
    overture-latam: 6.0
    wof-admin: 2.0
    wof-postalcode: 2.0
    ban: 3.0
    tiger: 4.0
    usgov-nppes: 2.0
    usgov-hrsa-fqhc: 2.0
    usgov-nad: 1.0
    state-tx-notaries: 1.5
    state-ny-notaries: 2.0
    # Declined, and the decline is what keeps this arm v5.7.0's twin. Each of these two sources lives
    # entirely inside a parquet file whose first row belongs to another source, so the loader v5.7.0
    # ran — which took a file's first row as the whole file's source — never indexed them and drew
    # zero rows from either. `_index_by_source` now reads every source in a file, which makes them
    # visible, and `_apply_source_weights` refuses a source the weights never mention. Naming them at
    # zero reproduces the exposure v5.7.0 had. Measured on the shared v0.30.0-bare-postcode base,
    # which this corpus overlays unchanged: state-ia-contractors 74,587 rows in part-0672,
    # usgov-imls-pls 80,402 rows in the same file.
    state-ia-contractors: 0.0
    usgov-imls-pls: 0.0
    deepseek-kryptonite: 3.0
    synth-intersection: 1.0
    synth-german: 6.0
    synth-fr-order: 3.0
    synth-fr-admin-split: 6.0
    synth-unit: 0.0 # SUPERSEDED by -v30
    synth-unit-v30: 1.5
    synth-po-box-cedex: 1.5
    synth-affix: 2.0
    synth-country: 2.0
    overture: 3.0
    gnaf: 6.0
    synth-anchor-absorption: 6.0
    synth-fr-bare-street: 0.0 # v0.9.4 vintage, SUPERSEDED by -v22
    synth-fr-bare-street-v22: 12.0
    synth-si-bare-village: 12.0
    synth-no-street-led: 0.0
    synth-cz-pcfirst-preposition: 0.0 # SUPERSEDED by -v21
    synth-cz-pcfirst-preposition-v21: 12.0
    synth-nl-postcode: 6.0
    synth-fragment: 6.0
    synth-fr-fragment: 12.0
    synth-no-fragment: 12.0
    synth-gb: 6.0
    synth-pt: 6.0
    synth-ch: 6.0
    synth-hr: 6.0
    synth-sk: 6.0
    synth-lu: 6.0
    synth-sub-venue: 12.0
    synth-suffix-boundary: 2.5
  # Reps per row rather than weights (#1677). 60,000 steps x batch 128 = 7,680,000 samples, so the nine
  # sources below demand 1.0*142083 + 1.0*80081 + 8.0*4551 + 8.0*4944 + 8.0*5279 + 0.5*153965 +
  # 1.0*20460 + 1.0*15976 + 4.0*13740 = 508,735 draws, 6.6% of the run. The big register sources take
  # one pass each because they carry their diversity in the rows. the four-to-five-thousand-row ones
  # take eight, which is the exposure `synth-suffix-boundary` already draws at weight 2.5.
  #
  # Every line here is carried from v5.7.0 unchanged. `synth-trailing-region-us` demands 24 fewer
  # draws than it did there because the rebuilt recipe output emitted 15,976 rows against 16,000, and
  # the 24 dropped rows are the ones the recipe's own label audit refused.
  source_reps:
    synth-sg-register: 1.0
    synth-pk-register: 1.0
    synth-bd-register: 8.0
    synth-trailing-region-es-v28: 8.0
    synth-po-box-military: 8.0
    osm: 0.5
    synth-bare-postcode: 1.0
    synth-trailing-region-us: 1.0
    synth-trailing-region-ca-bare: 4.0
  required_corpus_receipts:
    # A receipt is what turns "the weights name it" into "the sampler drew it": the generations
    # dropped before v5.5.0 were named nowhere and cost nothing to omit, which is why nothing failed
    # for five model versions.
    #
    # Each floor is counted. A reps target of 1.0 is exactly rows/samples of the run
    # (`derive_source_weights`), so 15,976 US rows draw about 2,080 per 1,000,000-row epoch and 500
    # is a floor a real draw clears four times over. The Canadian source at 4.0 draws about 7,156,
    # and 1,000 clears seven times over. `synth-unit-v30` inherits its predecessor's weight, which
    # the v5.6.0 audit measured at 9,013 draws per epoch, so 2,000 is the same four-times margin.
    - name: us-city-state-postcode
      min_draws: 500
      source: synth-trailing-region-us
      country: US
      component_sequence:
        - locality
        - region
        - postcode
    - name: ca-region-code-tail
      min_draws: 1000
      source: synth-trailing-region-ca-bare
      country: CA
    - name: us-secondary-unit-current-generation
      min_draws: 2000
      source: synth-unit-v30
      country: US
    # Carried forward from v5.6.0 unchanged.
    - name: bare-postcode-czech
      min_draws: 250
      source: synth-bare-postcode
      country: CZ
    - name: cz-postcode-first-current-generation
      min_draws: 1000
      source: synth-cz-pcfirst-preposition-v21
      country: CZ
    - name: fr-bare-street-current-generation
      min_draws: 1000
      source: synth-fr-bare-street-v22
      country: FR
    - name: ve-locality-postcode-region
      min_draws: 250
      source: synth-reviewed-postcode-tail
      country: VE
      component_sequence:
        - locality
        - postcode
        - region
    - name: sg-registers
      min_draws: 1000
      source: synth-sg-register
      country: SG
    - name: pk-house-line
      min_draws: 1000
      source: synth-pk-register
      country: PK
    - name: bd-trailing-postcode
      min_draws: 500
      source: synth-bd-register
      country: BD
    - name: es-trailing-region-local-surfaces
      min_draws: 500
      source: synth-trailing-region-es-v28
      country: ES
    - name: us-military-po-box
      min_draws: 500
      source: synth-po-box-military
      country: US
    - name: osm-south-asia-formats
      min_draws: 1000
      source: osm
    # The five locales read for the first time in this corpus. 1,000 is a requirement rather than a
    # prediction: below it a locale has not been taught at all, and a run that cannot reach one
    # stops instead of training on a corpus that silently omits it.
    - name: pt-native-order
      min_draws: 1000
      source: synth-pt
      country: PT
    - name: ch-native-order
      min_draws: 1000
      source: synth-ch
      country: CH
    - name: hr-native-order
      min_draws: 1000
      source: synth-hr
      country: HR
    - name: sk-native-order
      min_draws: 1000
      source: synth-sk
      country: SK
    - name: lu-native-order
      min_draws: 1000
      source: synth-lu
      country: LU
    # Brazil and Mexico were admitted in `country_weights` at weight 1.0 while the corpus held no row
    # for either. These two receipts are what distinguishes admission from being taught: both draw
    # from `overture-latam`, so a country filter is required to tell one from the other.
    - name: br-overture-rooftops
      min_draws: 1000
      source: overture-latam
      country: BR
    - name: mx-overture-rooftops
      min_draws: 1000
      source: overture-latam
      country: MX
  # Held-out coverage floors, iron rule 6's precondition. See the header for why GB and US declare a
  # street floor and FR and DE do not.
  required_validation_coverage:
    - country: GB
      min_rows: 1000
      min_street_rows: 1000
    - country: FR
      min_rows: 1000
    - country: DE
      min_rows: 1000
    - country: US
      min_rows: 1000
      min_street_rows: 1000
  augment_exclude_sources:
    - synth-suffix-boundary
    # A bare postcode has nothing to augment: a directional, a region or a glue token appended to
    # `119 00` produces a row whose label sequence no longer matches its surface, and the shape this
    # source exists to teach is the two-token input with nothing else in it.
    - synth-bare-postcode
  train_rows_per_epoch: 1000000
  val_rows: 4096
  coarse_filter: true
  augment_directional_prob: 0.3
  augment_region_prob: 0.3
  augment_glue_prob: 0.25
  augment_ordinal_prob: 0.3
  augment_punct_drop_prob: 0.3
  anchor_lookup_path: /data/anchor/pilot-anchor-lookup-v2-2026-08-05.json
  gazetteer_lexicon_path: /data/gazetteer/anchor-lexicon-v1.json
  country_lexicon_path: /data/gazetteer/country-surface-lexicon-v1.json
  gazetteer_choreography: true
  affix_relabel_lexicon_path: /data/gazetteer/affix-relabel-lexicon-v2.json
  anchor_paint_mode: shaped
  anchor_value_mode: posterior_latlon
  street_type_lexicon_path: /data/gazetteer/street-type-lexicon-v3.json
  locality_surface_lexicon_path: /data/gazetteer/locality-surface-lexicon-v7.json

