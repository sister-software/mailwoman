    # The key is quoted because YAML 1.1 reads a bare `NO` as false, which would match no Norwegian row.
    "NO": 1.0
    NZ: 1.0
    OM: 1.0
    PE: 1.0
    PG: 1.0
    PH: 1.0
    PK: 1.0
    PL: 1.0
    PM: 1.0
    PR: 1.0
    PT: 1.0
    RU: 1.0
    RW: 1.0
    SA: 1.0
    SB: 1.0
    SC: 1.0
    SE: 1.0
    SG: 1.0
    SH: 1.0
