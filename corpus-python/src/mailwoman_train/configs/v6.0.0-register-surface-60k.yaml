# v6.0.0 trains on a corpus rebuilt from source with row provenance columns and five new national
# address registers.
#
# Several variables change at once. The differences from v5.9.0-locality-shape-60k.yaml are:
#
# 1. `data.corpus_dir` moves to v0.6.0-register-surface, the v0.5.0 base rebuilt from the same
#    adapters and inputs. Every row gains three columns:
#
#      recipe    the recipe that produced the surface
#      register  the publication the underlying record came from, or null
#      surface   attested, composed or invented
#
# 2. Rows are shuffled within a 250,000-row window before they are written. A source's epoch draw
#    reads a small part of one row group, and rows used to reach parquet in country order, so a draw
#    could see only one country. Because every row moved, a run on this corpus cannot serve as a
#    controlled comparison with a run on v0.32.0.
#
# 3. Five national address registers are added, each under its own source id at weight 6.0, the
#    weight of `synth-gb` and `synth-german`:
#
#      synth-pt  800,000 rows   Portugal
#      synth-ch  500,000 rows   Switzerland
#      synth-hr  300,000 rows   Croatia
#      synth-sk  150,000 rows   Slovakia
#      synth-lu  150,000 rows   Luxembourg
#
#    `country_weights` gains LU. PT, CH, HR and SK were already admitted with Overture rows.
#    Saudi Arabia, Iceland and Estonia are left out, and the `COUNTRY_SOURCES` call sites record why.
#
# 4. `data.required_validation_coverage` sets held-out row and street-row floors for US, FR, GB and
#    DE. DE has no test street rows yet, so a run on this corpus stops at the CPU preflight until the
#    base is rebuilt with the new DE holdout.
#
# 5. `data.required_corpus_receipts` adds a 1,000-draw floor for each new register and for Brazil and
#    Mexico.
#
# The run starts from scratch with `--resume none`, because a fine-tune cannot learn sources that its
# base never saw. No earlier arm is a control, since they read a different corpus.
#
# All other weights, reps targets and the model, train and eval blocks match v5.9.0.

data:
  corpus_dir: /data/corpus/versioned/v0.6.0-register-surface/corpus-v0.6.0-register-surface
  tokenizer_dir: /data/models/tokenizer/v0.9.0-multisplice
  max_length: 128
  country_weights:
