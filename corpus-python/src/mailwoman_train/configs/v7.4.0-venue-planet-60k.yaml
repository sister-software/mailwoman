# v7.4.0 trains from scratch on the v0.7.3.2-venue-planet corpus: v0.7.2-address-systems plus the venue recipe's
# rows for 147 countries (#2511), with the v7.2.0 run shape unchanged (#2438 adds the label floor).
#
# The differences from v7.2.0-address-systems-60k.yaml are:
#
# 1. `data.corpus_dir` moves to v0.7.3.2-venue-planet. The corpus adds 1,637,640 `spliced-venue-locality`
#    rows and 1,478,399 `fragment-venue-bare` rows from Overture place names over WOF admin tuples, at
#    `--venue-region-fraction 0`, with bare rows for spaceless-script names that end in a venue head.
#
# 2. `country_weights` is the v7.3.2 arm's list: the base's countries plus every country the venue recipe covers.
#
# 3. The venue sources draw 3% of the run through `source_reps`, fifteen times the v7.3.2 arm's reps because
#    that arm divided the inherited reps by 15 for its 4,000 steps. The v7.3.1 arm at this share graded net
#    +6 attributable on the 1,226-row board with 18 of 18 promotion floors. The v7.3.2 arm over this corpus
#    graded net +10 attributable and missed `us.region` and `fr.region` by about one point, a fine-tune
#    cost that a from-scratch run does not inherit.
#
# 4. The inherited receipt floors are the base's times 0.97 for the venue share and times 0.9 again, the
#    margin the v7.3.2 arm needed after `ve-locality-postcode-region` drew 185 against 194. The two venue
#    receipts are the arm's, because the audit's epoch window is a fixed 1,000,000 rows.
#
# 5. `data.required_validation_label_support` declares a floor of 500 validation rows holding `unit`
#    (745 under v7.2.0). `po_box` has no floor: the US, FR and DE holdouts gave it 3 validation rows, and
#    a floor it can meet waits on a validation draw that reaches the register rows (#2438). `train_log.csv`
#    reports its support beside its F1.
#
# 6. `train.output_dir` and `train.trackio_run_name` name the v740 run.
#
# The run is from scratch with `--resume none`.

