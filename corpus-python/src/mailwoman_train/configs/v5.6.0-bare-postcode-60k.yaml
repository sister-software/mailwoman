# v5.6.0 — v5.5.0's mixture plus the bare-postcode slice, the shape the corpus never carried
#
# Control: v5.5.0-restored-generations-60k.yaml at seed 42. This config differs from it in the corpus
# version, ONE `source_doses` line and ONE receipt, so every difference between the two arms is the
# added slice. FROM SCRATCH: no `init_from`, launched with `--resume none`.
#
# WHAT IS BEING FIXED. `100 00` is a real Prague postcode. v5.3.0 read it as one; v5.4.0 and v5.5.0 read
# `100` as a house number and `00` as a street, so the resolver is handed no postcode and returns
# nothing. Held out, 32 CZ/SK codes of the `NNN NN` shape: 31/32 under v5.0.0, v5.2.0 and v5.3.0, then
# 0/32 under v5.4.0 and v5.5.0. The v5.0.0/v5.2.0 pair share a corpus and differ only in seed, so their
# agreement at 31/32 is what makes the collapse attributable to the corpus rather than to seed noise.
#
# WHY IT COLLAPSED. Across all 685,187,151 rows of the v0.29.0 mixture the bare two-token `NNN NN` shape
# appears ZERO times, and `NNNN LL` appears once. The correct reading was always generalization off
# longer addresses. v5.4.0's added OpenStreetMap PK/BD/VN rows raise the evidence for "a leading digit
# group is a house number" at that opening from 393.2 to 443.7 rows per pass, and an unsupported
# generalization gives way. Nothing in v5.5.0 addressed that: restoring the two dropped generations put
# 12,759 IN-CONTEXT `NNN NN` rows back, and they do not transfer to the bare input — 0/32 confirms it.
#
# WHAT IS ADDED. `synth-bare-postcode`: 20,460 rows of REAL codes read from the OpenAddresses extracts,
# no synthesis, each emitting a postcode and nothing else. CZ 5,290 / SK 2,112 / SE 3,058 / NL 10,000,
# half spaced and half compact per country. Every surface is checked through `computeQueryShape` at build
# time, so a surface the detector will not read as a postcode cannot ship.
#
# HELD-OUT INTEGRITY. All 56 evaluation strings (32 CZ/SK, 24 NL) are excluded from the recipe GLOBALLY
# by normalized form, so a Czech case cannot re-enter training as the identical Swedish input. Verified
# against the built parquet, not its source jsonl: 0 of 56 present.
#
# THE GAUNTLET BARE-POSTCODE ROWS ARE NOT HELD OUT, and two of the nine are now memorization checks.
# Checked each of the nine against the built parquet: `cz/bare-postcode.jsonl`'s `100 00` and `110 00`
# are real OpenAddresses Czech codes and are IN training — they were never on the 56-string reserve,
# which is the designed held-out set. Read those two rows as "the source drew", never as the capability.
# The other seven are clean: `Praha 100 00, Czechia` is an in-context surface this source never emits,
# GB is absent from the recipe by design (`SW1A 1AA` opens with letters and was never in doubt), US is
# not a recipe country, and `1012 LG` and `811 01` did not draw.
#
# EXPOSURE IS NOT SETTLED BY THIS FILE. `synth-bare-postcode: 1.0` below is an exposure the operator has
# to choose, and the epoch audit against these exact bytes has now measured what it delivers. Realized,
# over 1,000,000 sampled rows at seed 43:
#
#   draw level      2,652 rows, 0.2652% of the epoch, 0.130 passes per row of the source
#   emitted level   2,049 rows, 0.2049% — what the trainer actually reads
#   CZ receipt        668 rows observed against a floor of 250
#
# The draw level matches the intent exactly: 0.130 per epoch x 7.68 epochs in a 60,000-step run is 1.0
# pass per row, and it lands beside `synth-sg-register` (0.132) and `synth-pk-register` (0.130), well
# under the audit's outlier threshold of 8 x a 0.2 median.
#
# THE EMITTED LEVEL IS 23% LOWER, AND THAT IS THE NUMBER TO REASON WITH. Augmentation expands long
# addresses into more rows, so a short-row source keeps a smaller part of a fixed emitted budget: at
# 0.2049% this source delivers about 15,736 rows over the run, or 0.77 passes per row, not 1.0. That is
# not the `augment_exclude_sources` entry below — `synth-no-fragment` (0.7696) and `synth-fr-fragment`
# (0.7708) are not excluded and carry the same ratio, and `synth-sg-register` sits at 0.8247.
#
# THERE IS NO RATIO TO BEAT AT THIS SHAPE, and the 443.7 comparison this file used to carry was the
# wrong instrument. `census_opening_token` counted the openings over the same 1,000,000 sampled rows:
#
#   opening                      as house_number   as postcode
#   any digit group                    249,934         93,665     2.67:1 toward house_number
#   exactly three digits                53,451         18,140     2.95:1 toward house_number
#   three then two digits                  273         18,140       66:1 toward POSTCODE
#   the same, as a COMPLETE row              0            508     no contrary evidence at all
#
# At the exact failing opening the mixture ALREADY favours postcode 66 to 1, and v5.5.0 still reads
# `100 00` as a house number 0 times out of 32. So no exposure justified by an opening-level ratio can
# be right: 17,632 of those 18,140 rows come from `synth-cz-pcfirst-preposition-v21` and are in-context
# surfaces like `100 00 Praha, Czechia`, which the 0/32 result already showed do not transfer.
#
# What separates `100 00` from `100 00 Praha, Czechia` is that the row ENDS after two tokens. Counted as
# a complete row, the mixture carries 508 per 1,000,000 emitted — 3,901 over the run, every one from
# this source — against ZERO labelled house_number at either level, and against zero of any kind before
# v0.30.0. The quantity is a shape going from absent to present, not a margin over rival evidence, so
# the only open question is whether about 3,900 instances teach it. A census cannot answer that; the run
# can.
#
# PRE-REGISTERED WATCH. Grade these in order, before any target metric:
#
#   1. The held-out spaced-postcode sweep — `eval bare-postcode`, 32 CZ/SK `NNN NN` and 24 NL `NNNN LL`,
#      none of them on the board. v5.5.0 reads 0/32 and 19/24. This arm must recover CZ/SK WITHOUT
#      losing NL; a partial recovery is a partial result, not a pass.
#   2. `fr.bare_street_intact` in the promotion battery, which v5.5.0 raised 95 -> 100. FR is tier 1, so
#      a drop here disqualifies the arm outright.
#   3. The target-family boards v5.4.0 won and v5.5.0 held, which must not give any of it back:
#      `sg/register.jsonl` 118/240, `us/family-po-box.jsonl` 6/6, `ve/family-locality-postcode.jsonl` 5/5.
#
# The new receipt below fails the run if the added slice does not actually draw — the check that would
# have caught the silent generation drop five model versions earlier.

data:
  corpus_dir: /data/corpus/versioned/v0.30.0-bare-postcode/corpus-v0.30.0-bare-postcode
  tokenizer_dir: /data/models/tokenizer/v0.9.0-multisplice
