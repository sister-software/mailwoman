# v5.8.0 — the near-postcode gazetteer choreography, off
#
# One variable. This config is v5.7.0-region-code-and-unit-60k.yaml with `data.gazetteer_choreography`
# taken true -> false, and two sources named at zero weight so the run starts (the paragraph below says
# why, and zero is the exposure v5.7.0 gave them). Corpus version, seed, steps, every other weight, every
# reps target and every receipt are identical. From scratch: no `init_from`, launched with
# `--resume none`, the same shape v5.7.0 used.
#
# Control: v5.7.0 itself. It is from-scratch at seed 42 on this corpus with the flag on, so it is this
# arm's exact twin and no control run has to be paid for. That is the whole reason this arm is one run
# rather than two.
#
# One difference between the arms is not the flag, and grading has to carry it. v5.7.0 trained under a
# loader that took a parquet file's first row as the whole file's source, so a source whose rows sat in
# another source's file was unreachable. Reading every source in a file reaches them: across the 718
# train files, 8 carry more than one source, and the rows those files hold for a source other than their
# first row's number 4,084,591 — 0.60% of the 681,901,687 train rows a full read of the split counts, of
# which 154,989 belong to the two sources declined below. The manifest's own `counts.train` says
# 681,408,112 and is the figure to distrust: it disagrees with the sum of the per-file `rows` it carries,
# and the read agrees with that sum. Every share is unchanged — the reps-targeted sources' row
# counts do not move, the fixed weights come from this file, and the two newly visible sources are
# declined — so what differs is which distinct rows back a source's draws, not how many it gets.
#
# What the flag does. `gazetteer_choreography` zeroes the gazetteer clue on tokens within one piece of
# a postcode-anchor hit, at train time. Inference mirrors it through the model card's
# `suppress_gazetteer_near_postcode`, and the two must agree — a model trained with the choreography
# and served without it is a mismatch. It was added for the v0.9.12 US-postcode fix: the clue fires on
# the region token immediately before a US postcode, strengthens `B-region`, makes the
# `B-region -> B-postcode` transition less competitive, and cost about 3 points of US postcode.
#
# Why turn it off. On the bare admin surface the same suppression removes the locality's only world
# evidence. `Orland Park, IL 60467` reaches the decode with a silent gazetteer channel and answers no
# locality at all; `Orland Park, Illinois` and `Orland Park, IL` both answer the place.
#
# v5.7.0 already spent a corpus arm on this surface (#2303) and it worked: the bare arm went 53.2%
# (309/581) under v5.6.0 to 92.0% (555/603) under v5.7.0, measured by
# `us/locality-region-postcode-arms.run.ts`. What it did not reach is the residual, which is
# concentrated in one name shape. Serving v5.7.0 with the choreography off, same panel, same probe:
#
#   shape                     n     choreography on    choreography off
#   single word              240    98.8%             100.0%
#   multi-word                84    84.5%              98.8%
#   ends in a USPS suffix     77    59.7%              93.5%
#
# That is an inference-only ablation on a model trained with the choreography, so it estimates the
# upside rather than reporting what a model trained without it does. This run is what answers that.
#
# Pre-registered bars. Read against v5.7.0 on the same instruments.
#
#   1. `us/locality-region-postcode-arms.run.ts`, the 603-city panel. The bare arm must not fall below
#      v5.7.0's 92.0% (555/603), and its suffix-tail bucket must improve on 59.7% (46/77). The reverse
#      is the same measurement: `street_only` answers no locality for 594 of 603 today and may not
#      fall — recovering the locality surface must not turn a street before a state code into a
#      locality.
#
#   2. US POSTCODE, the tag this flag was added to guard. The choreography's own receipt is about 3
#      points of US postcode under v0.9.12. Per-tag US postcode F1 may not regress against v5.7.0. A
#      loss here is the expected cost of the change and the number that decides whether it ships.
#
#   3. The regression board, 1,029 cases. The 33 bare-admin rows added for this arc
#      (`cases/us/family-city-state-postcode.jsonl`) carry 22 improvement targets and 6 reverse-risk
#      rows. net improved-minus-regressed must be >= 0 and the six reverse-risk rows must stay passing.
#
#   4. The D-rule, iron rule 6: no regression anywhere on FR, GB or DE.
#
# Pair the inference half by hand before grading. `cli/commands/package.py` does not write
# `suppress_gazetteer_near_postcode` into the model card, and the shipped card
# (`packages/neural-weights-en-us/model-card.json`, line 62) carries `true` as a hand-maintained
# value. A candidate staged from this run with that card unedited is served with the choreography the
# run was trained without, which is the mismatch this whole arm is about, and every number measured
# that way is void. Set the candidate card's `suppress_gazetteer_near_postcode` to false and confirm
# it before the first grade:
#
#   node -e "console.log(require('<candidate>/model-card.json').requires.suppress_gazetteer_near_postcode)"
#
# The staged control (v5.7.0) keeps `true`. The two cards differing is what makes the arms differ at
# serve time as well as at train time.
#
# Spend: one 60,000-step from-scratch run, about 4.3 h and about $9 on an A100-40GB. The control is
# already trained, so this is the whole cost of the arm.

data:
  corpus_dir: /data/corpus/versioned/v0.31.0-region-code-and-unit/corpus-v0.31.0-region-code-and-unit
  tokenizer_dir: /data/models/tokenizer/v0.9.0-multisplice
