    ST: 1.0
    SV: 1.0
    SX: 1.0
    TH: 1.0
    TK: 1.0
    TM: 1.0
    TO: 1.0
    TR: 1.0
    TT: 1.0
    TW: 1.0
    UA: 1.0
    US: 1.0
    VE: 1.0
    VG: 1.0
    VI: 1.0
    VN: 1.0
    VU: 1.0
    ZA: 1.0
  source_weights:
    synth-house-venue: 2.0
    synth-reviewed-postcode-tail: 0.05
    overture-latam: 6.0
    wof-admin: 2.0
    wof-postalcode: 2.0
    ban: 3.0
    tiger: 4.0
    usgov-nppes: 2.0
    usgov-hrsa-fqhc: 2.0
    usgov-nad: 1.0
    state-tx-notaries: 1.5
    state-ny-notaries: 2.0
    # Declined, and the decline is what keeps this arm v5.7.0's twin. Each of these two sources lives
    # entirely inside a parquet file whose first row belongs to another source, so the loader v5.7.0
    # ran — which took a file's first row as the whole file's source — never indexed them and drew
    # zero rows from either. `_index_by_source` now reads every source in a file, which makes them
    # visible, and `_apply_source_weights` refuses a source the weights never mention. Naming them at
    # zero reproduces the exposure v5.7.0 had. Measured on v0.31.0-region-code-and-unit:
    # state-ia-contractors 74,587 rows in part-0672, usgov-imls-pls 80,402 rows in the same file.
    state-ia-contractors: 0.0
    usgov-imls-pls: 0.0
    deepseek-kryptonite: 3.0
    synth-intersection: 1.0
    synth-german: 6.0
    synth-fr-order: 3.0
    synth-fr-admin-split: 6.0
    synth-unit: 0.0 # SUPERSEDED by -v30
    synth-unit-v30: 1.5
    synth-po-box-cedex: 1.5
    synth-affix: 2.0
    synth-country: 2.0
    overture: 3.0
    gnaf: 6.0
    synth-anchor-absorption: 6.0
    synth-fr-bare-street: 0.0 # v0.9.4 vintage, SUPERSEDED by -v22
    synth-fr-bare-street-v22: 12.0
    synth-si-bare-village: 12.0
    synth-no-street-led: 0.0
    synth-cz-pcfirst-preposition: 0.0 # SUPERSEDED by -v21
    synth-cz-pcfirst-preposition-v21: 12.0
    synth-nl-postcode: 6.0
    synth-fragment: 6.0
    synth-fr-fragment: 12.0
    synth-no-fragment: 12.0
    synth-gb: 6.0
    synth-sub-venue: 12.0
    synth-suffix-boundary: 2.5
  # Reps per row, not weights (#1677). 60,000 steps x batch 128 = 7,680,000 samples, so the nine
  # sources below demand 1.0*142083 + 1.0*80081 + 8.0*4551 + 8.0*4944 + 8.0*5279 + 0.5*153965 +
  # 1.0*20460 + 1.0*16000 + 4.0*13740 = 508,759 draws, 6.6% of the run. The big register sources take
  # one pass each because they carry their diversity in the rows. the four-to-five-thousand-row ones
  # take eight, which is the exposure `synth-suffix-boundary` already draws at weight 2.5.
  #
  # The two added lines are the arm's exposure decisions and the epoch audit is what confirms them —
  # see the header for the count behind each.
  source_reps:
    synth-sg-register: 1.0
    synth-pk-register: 1.0
    synth-bd-register: 8.0
    synth-trailing-region-es-v28: 8.0
    synth-po-box-military: 8.0
    osm: 0.5
    synth-bare-postcode: 1.0
    synth-trailing-region-us: 1.0
    synth-trailing-region-ca-bare: 4.0
  required_corpus_receipts:
    # The three added sources. A receipt is what turns "the weights name it" into "the sampler drew
    # it": the generations dropped before v5.5.0 were named nowhere and cost nothing to omit, which is
    # why nothing failed for five model versions.
    #
    # Each floor is COUNTED. A reps target of 1.0 is exactly rows/samples of the run (`derive_source_weights`),
    # so 16,000 US rows draw about 2,083 per 1,000,000-row epoch and 500 is a floor a real draw clears
    # four times over. The Canadian source at 4.0 draws about 7,156, and 1,000 clears seven times over.
    # `synth-unit-v30` inherits its predecessor's weight, which the v5.6.0 audit measured at 9,013
    # draws per epoch, so 2,000 is the same four-times margin.
    - name: us-city-state-postcode
      min_draws: 500
      source: synth-trailing-region-us
      country: US
      component_sequence:
        - locality
        - region
        - postcode
    - name: ca-region-code-tail
      min_draws: 1000
      source: synth-trailing-region-ca-bare
      country: CA
    - name: us-secondary-unit-current-generation
      min_draws: 2000
      source: synth-unit-v30
      country: US
    # Carried forward from v5.6.0 unchanged.
    - name: bare-postcode-czech
      min_draws: 250
      source: synth-bare-postcode
      country: CZ
    - name: cz-postcode-first-current-generation
      min_draws: 1000
      source: synth-cz-pcfirst-preposition-v21
      country: CZ
    - name: fr-bare-street-current-generation
      min_draws: 1000
      source: synth-fr-bare-street-v22
      country: FR
    - name: ve-locality-postcode-region
      min_draws: 250
      source: synth-reviewed-postcode-tail
      country: VE
      component_sequence:
        - locality
        - postcode
        - region
    - name: sg-registers
      min_draws: 1000
      source: synth-sg-register
      country: SG
    - name: pk-house-line
      min_draws: 1000
      source: synth-pk-register
      country: PK
    - name: bd-trailing-postcode
      min_draws: 500
      source: synth-bd-register
      country: BD
    - name: es-trailing-region-local-surfaces
      min_draws: 500
      source: synth-trailing-region-es-v28
      country: ES
    - name: us-military-po-box
      min_draws: 500
      source: synth-po-box-military
      country: US
    - name: osm-south-asia-formats
      min_draws: 1000
      source: osm
  augment_exclude_sources:
    - synth-suffix-boundary
    # A bare postcode has nothing to augment: a directional, a region or a glue token appended to
    # `119 00` produces a row whose label sequence no longer matches its surface, and the shape this
    # source exists to teach is the two-token input with nothing else in it.
    - synth-bare-postcode
  train_rows_per_epoch: 1000000
  val_rows: 4096
  coarse_filter: true
  augment_directional_prob: 0.3
  augment_region_prob: 0.3
  augment_glue_prob: 0.25
  augment_ordinal_prob: 0.3
  augment_punct_drop_prob: 0.3
  anchor_lookup_path: /data/anchor/pilot-anchor-lookup-v2-2026-08-05.json
  gazetteer_lexicon_path: /data/gazetteer/anchor-lexicon-v1.json
  country_lexicon_path: /data/gazetteer/country-surface-lexicon-v1.json
  gazetteer_choreography: false
  affix_relabel_lexicon_path: /data/gazetteer/affix-relabel-lexicon-v2.json
  anchor_paint_mode: shaped
  anchor_value_mode: posterior_latlon
  street_type_lexicon_path: /data/gazetteer/street-type-lexicon-v3.json
  locality_surface_lexicon_path: /data/gazetteer/locality-surface-lexicon-v7.json

model:
  hidden_size: 384
  use_span_boundary_head: true
  use_deploc_head: false
  span_boundary_loss_weight: 0.5
  num_hidden_layers: 6
  num_attention_heads: 6
  intermediate_size: 1536
  max_position_embeddings: 128
  type_vocab_size: 1
  hidden_dropout_prob: 0.1
  attention_probs_dropout_prob: 0.1
  use_crf: true
  crf_loss_weight: 0.0
  crf_normalization: per_sequence
  label_smoothing: 0.1
  use_locale_conditioning: true
  locale_loss_weight: 0.3
  use_postcode_anchor: true
  use_gazetteer_anchor: true
  gazetteer_feature_dim: 5
  use_country_anchor: true
  country_feature_dim: 2
  use_street_type_anchor: true
  street_type_feature_dim: 1
  use_locality_surface_anchor: true
  locality_surface_feature_dim: 2
  country_ambiguous_scale: 0.5
  class_weights:
    O: 0.5
    B-country: 3.5
    I-country: 3.5
    B-region: 1.5
    I-region: 1.5
    B-locality: 2.0
    I-locality: 2.0
    B-dependent_locality: 1.0
    I-dependent_locality: 1.0
    B-postcode: 1.5
    I-postcode: 1.5
    B-subregion: 0.3
    I-subregion: 0.3
    B-cedex: 1.0
    I-cedex: 1.0
    B-venue: 1.5
    I-venue: 1.5
    B-street: 2.0
    I-street: 2.0
    B-house_number: 1.5
    I-house_number: 1.5
    B-street_prefix: 1.5
    I-street_prefix: 1.5
    B-street_suffix: 1.5
    I-street_suffix: 1.5
    B-unit: 1.5
    I-unit: 1.5
    B-po_box: 1.5
    I-po_box: 1.5
    B-intersection_a: 1.0
    I-intersection_a: 1.0
    B-intersection_b: 1.0
    I-intersection_b: 1.0
  use_phrase_priors: true
  phrase_feature_dim: 10

train:
  output_dir: /data/output-v580-gazetteer-choreography-off-s42/checkpoints
  seed: 42
  batch_size: 128
  eval_batch_size: 128
  grad_accum_steps: 1
  learning_rate: 5.0e-4
  weight_decay: 0.01
  warmup_steps: 1000
  grad_clip_norm: 1.0
  max_steps: 60000
  eval_every_steps: 2000
  save_every_steps: 5000
  log_every_steps: 100
  precision: bf16
  num_workers: 0
  csv_log_path: "{output_dir}/../train_log.csv"
  lr_schedule: cosine
  gazetteer_curriculum: true
  evidence_curriculum: true
  evidence_noise_prob: 0.15
  fisher_capture: true
  fisher_capture_last_n_steps: 2000
  trackio_project: mailwoman
  trackio_run_name: v580-gazetteer-choreography-off-60k-s42

eval:
  golden_dir: /data/eval/golden/v0.1.3
  val_jsonl: ""
