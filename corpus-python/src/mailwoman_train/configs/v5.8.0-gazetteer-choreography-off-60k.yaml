    JP: 1.0
    KH: 1.0
    KR: 1.0
    KW: 1.0
    KY: 1.0
    LB: 1.0
    MA: 1.0
    ML: 1.0
    MN: 1.0
    MP: 1.0
    MS: 1.0
    MU: 1.0
    MW: 1.0
    MX: 1.0
    MY: 1.0
    NA: 1.0
    NE: 1.0
