# === v3.19.0-bundle-8k — THE PRODUCTION BUNDLE CANDIDATE (Option-A Phase 3). ===
# (Claude-owned productionization; operator go 2026-07-27 "Proceed with Phase 3".)
#
# THE RECIPE (confirmed buildable by the five-run chain v3.15→v3.18): street_type [1] +
# locality_surface [2] evidence channels + absence-curriculum + three-law lexicon selectivity.
# TWO NAMED DELTAS vs the passing v3.18 probe:
#   1. 8k steps (the v385/feed-8k production precedent; probes were 3k). Over-trust was
#      TIME-DEPENDENT in P-A — the per-checkpoint watch below is the guard.
#   2. locality-surface-lexicon-v4 (the register fold: +neighbourhood surfaces, parent-derived
#      prominence with the law-3 guard; US+FR unchanged — the DE country fold is deliberately the
#      NEXT increment, not this one).
#
# PRE-REGISTERED GATES (graded at EVERY save: 2k/4k/6k/8k via grade_evidence_bundle, both
# case=asis|lower, heal on/off; the v385 checkpoint graded through the SAME raw grader as the
# reference row — the v3.17 leg-3 instrument lesson):
#   G1 bundle bars HOLD AT 8k: homonym ON−OFF ≥ +0.050 (asis) and ≥ +0.25 (lower+heal);
#      house-number classes ON−OFF ≥ −0.020 each (asis, raw); lowercase-heal ALL ≥ +0.015.
#   G2 ABLATION (base competence): the OFF column within ±0.015 per class of the v385 same-grader
#      reference (evidence-zeroed parse must not degrade what v385 already does).
#   G3 INVARIANCE (exported int8, standard instrument, --baseline v385): ZERO new violation
#      classes; the P-B signature watch is us-white-house [comma-drop] staying INVARIANT.
#   G4 GAUNTLET ×3 PASS on the exported candidate (weights-cache with the bundle lexicons).
#   G5 GOLDEN us/fr (standard gate instrument on the int8): within the standing floors vs v385.
#   VERDICT: all five ⇒ the promotion battery proceeds (card bump, weights-package wiring, ship).
#   Any G1/G2 miss at 8k but pass at an earlier save ⇒ the earlier checkpoint is the candidate
#   (the over-trust watch working as designed). G3 new-class ⇒ STOP: the Wall-A lock-in question
#   reopens and the operator decides. No knob iteration inside this run.
#
# Launch: modal run -d corpus-python/modal/train_remote.py --config v3.19.0-bundle-8k.yaml --resume none
#
data:
  corpus_dir: /data/corpus/versioned/v0.15.0-deploc/corpus-v0.15.0-deploc # FEED — v0.14.0-gb + synth-nz-v2 + synth-es-pedania (+synth-fr-lieudit if landed).
  tokenizer_dir: /data/models/tokenizer/v0.9.0-multisplice
  max_length: 128
  country_weights: # VERBATIM v2.4.1.
    US: 1.0
    FR: 1.0
    DE: 1.0
    ES: 1.0
    IT: 1.0
    NL: 1.0
    PT: 1.0
    BE: 1.0
    PL: 1.0
    AT: 1.0
    CH: 1.0
    CZ: 1.0
    DK: 1.0
    "NO": 1.0
    SE: 1.0
    FI: 1.0
    IE: 1.0
    GB: 1.0
    SK: 1.0
    SI: 1.0
    HR: 1.0
    HU: 1.0
    AU: 1.0
    CA: 1.0 # NEW (Overture) — live locality, sidesteps NZ's dead dependent_locality
    MX: 1.0 # NEW (Overture) — BR dropped (0% OA-lineage + SN-garbage numbers)
    NZ: 1.0 # v3.12 COMPANION BUG FIX (not the variable): the allowlist lacked NZ through the whole v3.11.x lineage — synth-nz drew ZERO rows (step-0 measured; the documented v3.8.2-era allowlist trap re-triggered). Restores the recipe's DECLARED 4-locale intent.
  source_weights: # v3.1.0 weights + overture-latam (CA/MX/BR, dedicated source so it doesn't dilute the trained EU overture rows) + synth-no-fragment (the ONE new variable); synth-no-street-led ZEROED (its on-disk part predates --exclude-surfaces and is contaminated vs the board — see the overlay note).
    overture-latam: 6.0 # NEW — CA/MX/BR Overture shards. 6.0/~142 ≈ 4.2%, within Fable's ≤5-8% new-mass band. Distinct from  (EU) so EU exposure is untouched.
    wof-admin: 2.0
    wof-postalcode: 2.0
    ban: 3.0
    tiger: 4.0
    usgov-nppes: 2.0
    usgov-hrsa-fqhc: 2.0
    usgov-imls-pls: 2.0
    usgov-nad: 1.0
    state-ia-contractors: 2.0
    state-tx-notaries: 1.5
    state-ny-notaries: 2.0
    deepseek-kryptonite: 3.0
    synth-intersection: 1.0
    synth-german: 6.0
    synth-fr-order: 3.0
    synth-fr-admin-split: 6.0
    synth-unit: 1.5
    synth-po-box-cedex: 1.5
    synth-affix: 2.0
    synth-country: 2.0
    overture: 3.0
    gnaf: 6.0
    synth-anchor-absorption: 6.0
    synth-fr-bare-street: 12.0
    synth-si-bare-village: 12.0
    synth-no-street-led: 0.0
    synth-cz-pcfirst-preposition: 12.0
    synth-nl-postcode: 6.0
    # PROBE 1: the fragment/autocomplete shard (assay weight — moderate precedent).
    synth-fragment: 6.0
    # #727 T2 NEW — the ONE variable. 12.0 = the targeted-fix precedent (fr-bare-street,
    # si-bare-village, no-street-led are all 12.0). Streets with NO house number + the
    # bare-locality counter.
    synth-fr-fragment: 12.0
    # Track B — the NO house-number-licence lever. 12.0 = the targeted-fix tier
    # (matches fr-fragment). Bare streets + street+number with NO postcode partner, + counters.
    synth-no-fragment: 12.0
    synth-gb: 10.0 # FEED: 6.1% stream × .328 dep-loc (probe-2 had this at 20.2% — the skew culprit)
    synth-nz: 4.0 # FEED NEW: 2.4% stream × .792 (synth-nz-v2 800k; key also covers the old 2,990-row po-box shard — harmless, same country)
    synth-es-pedania: 5.0 # FEED NEW: 3.0% stream × .303 (post-4b formatter fix)
    synth-fr-lieudit: 3.0 # FEED NEW: 1.8% stream × 1.00 (BAN nom_ld, 4ce6821a; directly feeds the bare-locality regression class)
  train_rows_per_epoch: 1000000
  val_rows: 4096
  coarse_filter: true
  augment_directional_prob: 0.3
  augment_region_prob: 0.3
  augment_glue_prob: 0.25
  # #1101 FIX — the delimiter-free augmentation (built+tested, never shipped): an extra comma-stripped
  # copy per row so the model segments street/locality without leaning on the comma. Closes the gauntlet
  # comma-drop INV (White House + FR Rue du Chevaleret). ONE new variable vs v373.
  augment_punct_drop_prob: 0.6 # v3.12 DELTA (the ONE pre-registered variable): 0.3->0.6, solves p/(1+p)=0.377 = base comma-free rate (step-0 measured)
  anchor_lookup_path: /data/anchor/pilot-anchor-lookup.json
  gazetteer_lexicon_path: /data/gazetteer/anchor-lexicon-v1.json
  # #1104 country-lexicon channel — the dedicated country soft-feed vocabulary (feature_dim 2).
  country_lexicon_path: /data/gazetteer/country-surface-lexicon-v1.json
  # P-A street-type channel — the codex street-type lexicon (feature_dim 1). Same JSON schema as the
  # gazetteer lexicon; the loader reuses load_gazetteer_lexicon + realign_gazetteer_to_pieces.
  street_type_lexicon_path: /data/gazetteer/street-type-lexicon-v1.json
  # v3.16.0 — the bundle's second channel (see header).
  locality_surface_lexicon_path: /data/gazetteer/locality-surface-lexicon-v4.json
  gazetteer_choreography: true
  affix_relabel_lexicon_path: /data/gazetteer/affix-relabel-lexicon-v1.json
  anchor_paint_mode: shaped
  anchor_value_mode: posterior_latlon

model: # VERBATIM v2.4.1.
  hidden_size: 384
  use_span_boundary_head: true
  use_deploc_head: false # P-A: OFF — orthogonal to P-B's head experiment; don't confound the street-type read.
  span_boundary_loss_weight: 0.5
  num_hidden_layers: 6
  num_attention_heads: 6
  intermediate_size: 1536
  max_position_embeddings: 128
  type_vocab_size: 1
  hidden_dropout_prob: 0.1
  attention_probs_dropout_prob: 0.1
  use_crf: true
  crf_loss_weight: 0.0
  crf_normalization: per_sequence
  label_smoothing: 0.1
  use_locale_conditioning: true
  locale_loss_weight: 0.3
  use_postcode_anchor: true
  use_gazetteer_anchor: true
  gazetteer_feature_dim: 5
  # #1104 country channel ON — dedicated 2-dim [country_surface, country_ambiguous] soft feed with its
  # own projection + confidence (must equal the lexicon's feature_dim). Default-False elsewhere, so a
  # resume from a pre-country checkpoint stays byte-identical until this flips.
  use_country_anchor: true
  country_feature_dim: 2
  # P-A street-type channel ON — a dedicated 1-dim street_type soft feed with its own projection +
  # confidence (must equal the lexicon's feature_dim=1). Separate from the gazetteer, so init_from v385
  # loads clean (v385 lacks street_type_* → strict=False leaves ONLY those fresh).
  use_street_type_anchor: true
  street_type_feature_dim: 1
  # v3.16.0 — the locality-surface channel ON (the bundle).
  use_locality_surface_anchor: true
  locality_surface_feature_dim: 2
  # #1104 homograph-guard SOFTENER — the ONE variable vs v263. Scales the country_ambiguous dim by 0.5
  # before the country_projection (bakes into the exported ONNX; no lexicon/inference change). v263's
  # hard guard (scale 1.0) over-suppressed homograph countries Georgia/Jordan (country-homograph F1
  # 89.8->82.6); softening should recover homograph recall while holding the WOF-admin country win.
  country_ambiguous_scale: 0.5
  class_weights:
    O: 0.5
    B-country: 3.5
    I-country: 3.5
    B-region: 1.5
    I-region: 1.5
    B-locality: 2.0
    I-locality: 2.0
    B-dependent_locality: 1.0 # DELTA (0.3 -> 1.0) — the third suppressor: re-init + hot LR are useless under a 0.3 downweight.
    I-dependent_locality: 1.0 # DELTA (0.3 -> 1.0) — see B-dependent_locality above.
    B-postcode: 1.5
    I-postcode: 1.5
    B-subregion: 0.3
    I-subregion: 0.3
    B-cedex: 1.0
    I-cedex: 1.0
    B-venue: 1.5
    I-venue: 1.5
    B-street: 2.0
    I-street: 2.0
    B-house_number: 1.5
    I-house_number: 1.5
    B-street_prefix: 1.5
    I-street_prefix: 1.5
    B-street_suffix: 1.5
    I-street_suffix: 1.5
    B-unit: 1.5
    I-unit: 1.5
    B-po_box: 1.5
    I-po_box: 1.5
    B-intersection_a: 1.0
    I-intersection_a: 1.0
    B-intersection_b: 1.0
    I-intersection_b: 1.0
  use_phrase_priors: true
  phrase_feature_dim: 10

train: # Same-vocab init_from fine-tune off the SHIPPED v385 (fresh optimizer; --resume none on a fresh
  # output_dir honors init_from, weights only).
  output_dir: /data/output-v3190-bundle-8k-s42/checkpoints # v3.19.0 production candidate.
  seed: 42
  init_from: /data/output-v384-latam-probe-s42/checkpoints/step-008000 # DELTA — the verified v385 (6.6.0) checkpoint. See header for the volume-verification evidence.
  batch_size: 128
  eval_batch_size: 128
  grad_accum_steps: 1
  learning_rate: 1.0e-5
  weight_decay: 0.01
  warmup_steps: 500
  grad_clip_norm: 1.0
  max_steps: 8000 # Production duration (the v385 precedent). Checkpoints every 2k, EACH graded (the over-trust watch).
  eval_every_steps: 2000
  save_every_steps: 2000
  log_every_steps: 50
  precision: bf16
  num_workers: 0
  csv_log_path: "{output_dir}/../train_log.csv"
  lr_schedule: constant
  gazetteer_curriculum: false
  evidence_curriculum: true # v3.16.0 — the anti-over-trust leg (ramped zero-out on BOTH bundle channels).
  classifier_learning_rate: 1.0e-3 # P-A: hot LR for the FRESH street_type channel (the carveout covers street_type_projection/cue) + the classifier. Single phase, 3k window.
  trackio_project: mailwoman
  trackio_run_name: v3.19.0-bundle-8k-s42

eval:
  golden_dir: /data/eval/golden/v0.1.2
  val_jsonl: ""
