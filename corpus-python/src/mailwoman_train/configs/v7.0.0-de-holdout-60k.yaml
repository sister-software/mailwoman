  # These sources set passes per row, and the loader derives their weights. Large register sources
  # take one pass, and sources of about 5,000 rows take eight. The values are unchanged from v5.7.0.
  source_reps:
    rendered-sg-register: 1.0
    rendered-pk-register: 1.0
    rendered-bd-register: 8.0
    spliced-trailing-region-es-v28: 8.0
    invented-po-box-military: 8.0
    osm: 0.5
    codex-bare-postcode: 1.0
    spliced-trailing-region-us: 1.0
    spliced-trailing-region-ca-bare: 4.0
  required_corpus_receipts:
    # Each receipt stops the run when the epoch-mixture audit draws fewer matching rows than `min_draws`.
    - name: us-city-state-postcode
      min_draws: 500
      source: spliced-trailing-region-us
      country: US
      component_sequence:
        - locality
        - region
        - postcode
    - name: ca-region-code-tail
      min_draws: 1000
      source: spliced-trailing-region-ca-bare
      country: CA
    - name: us-secondary-unit-current-generation
      min_draws: 2000
      source: spliced-unit-v30
      country: US
    # The receipts below are unchanged from v5.6.0.
    - name: bare-postcode-czech
      min_draws: 250
      source: codex-bare-postcode
      country: CZ
    - name: cz-postcode-first-current-generation
      min_draws: 1000
      source: rendered-cz-pcfirst-preposition-v21
      country: CZ
    - name: fr-bare-street-current-generation
      min_draws: 1000
      source: fragment-fr-bare-street-v22
      country: FR
    # 200 rather than v6.0.0's 250: the expectation is 244.4 draws at weight 0.05, so 250 refuses 63.1%
    # of seeds and 200 refuses 0.2%. The header states the derivation.
    - name: ve-locality-postcode-region
      min_draws: 200
      source: reviewed-postcode-tail
      country: VE
      component_sequence:
        - locality
        - postcode
        - region
    - name: sg-registers
      min_draws: 1000
      source: rendered-sg-register
      country: SG
    - name: pk-house-line
      min_draws: 1000
      source: rendered-pk-register
      country: PK
    - name: bd-trailing-postcode
      min_draws: 500
      source: rendered-bd-register
      country: BD
    - name: es-trailing-region-local-surfaces
      min_draws: 500
      source: spliced-trailing-region-es-v28
      country: ES
    - name: us-military-po-box
      min_draws: 500
      source: invented-po-box-military
      country: US
    - name: osm-south-asia-formats
      min_draws: 1000
      source: osm
    # Each national register needs 1,000 draws from its own source id. Rows from `overture` in the same
    # country do not count.
    - name: pt-native-order
      min_draws: 1000
      source: rendered-pt
      country: PT
    - name: ch-native-order
      min_draws: 1000
      source: rendered-ch
