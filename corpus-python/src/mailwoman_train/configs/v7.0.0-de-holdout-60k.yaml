# v7.0.0 trains on the v0.7.0-de-holdout corpus, the first assembly whose held-out splits carry German
# street rows and the first whose rows store the operation spelling of every recipe-output source.
#
# The differences from v6.0.0-register-surface-60k.yaml are:
#
# 1. `data.corpus_dir` moves to v0.7.0-de-holdout. A run on v0.6.0-register-surface stopped at the CPU
#    preflight because its DE test split held no street row. Measured on the assembled corpus with
#    `python -m mailwoman_train.audits.validation_coverage`: DE val holds 49,831 rows of which 12,537
#    carry a street or a house number, and DE test holds 49,511 rows of which 12,583 do. All four
#    declared floors are met.
#
# 2. Every recipe-output source key carries the operation spelling. The corpus stores it: the assembly
#    rewrote each routed overlay file before the manifest computed its digest, and the per-file record
#    beside those files states the row count and the ordered source_id digest verified on both sides.
#    The mapping is a prefix swap recorded in packages/corpus/lib/recipes/sources.ts, and the tail of
#    each name is unchanged except for Germany, whose retired name spelled a language word where every
#    other locale read as an ISO code. The 54 keys below are the same 54 sources v6.0.0 weighted, and
#    the weights and reps targets are unchanged value for value.
#
# 3. `train.output_dir` and `train.trackio_run_name` name the v700 run.
#
# The corpus vocabulary and the key set agree exactly: the corpus holds 43 overlay sources and 11
# adapter ids, and each of those 54 appears once in source_weights or source_reps. The loader rejects a
# source without a weight, so a missing key stops the run rather than dropping rows silently.
#
# The run starts from scratch with `--resume none`. A fine-tune from the v6.0.0 checkpoint is not
# available, because no v6.0.0 run reached a checkpoint on this corpus family.
#
# 4. `ve-locality-postcode-region` asks for 200 draws where v6.0.0 asked for 250. Every other receipt
#    floor, weight and reps target, and the model, train and eval blocks, match v6.0.0.
#
#    v6.0.0's floor of 250 sat above the mixture's own expectation. `reviewed-postcode-tail` carries
#    weight 0.05, and a source's requested share follows its weight alone: measured over the audit's
#    `requested` map, every source reads `share / weight = 0.00488798`, and `rendered-de` at 187,485 rows
#    and `rendered-nl-postcode` at 10,000 rows both read 0.02932786 at weight 6.0. So the share is
#    0.05 / 204.58 = 0.00024440, and 1,000,000 draws expect 244.4 with a binomial standard deviation of
#    15.6. A floor of 250 refuses 63.1% of seeds and a floor of 200 refuses 0.2%, both computed exactly
#    from Poisson(244.4). Seed 43 drew 240.
#
#    200 is 2.85 standard deviations below the expectation, so it is a function of the weight and the
#    draw count rather than of the 240 observed. Had seed 43 drawn 262 and passed, the same arithmetic
#    would still give 200. The floor keeps its purpose: a mixture change that stopped routing these rows
#    to the trainer still refuses. It is stale if the weight moves, which is the argument for a receipt
#    field stating a fraction of the expected draws rather than a constant.
#
#    The other two candidate changes were declined. Raising the weight above 0.05 would choose a training
#    parameter so that a check passes, and it would shift every other source's share. Emitting more than
#    the 22 rows leaves the expected draws at 244.4, because the share follows the weight alone, so it
#    cannot move this receipt. It would lower the 10.9 reps per row, and that number is 240 divided by 22,
#    so it carries the same information as the draw count.

