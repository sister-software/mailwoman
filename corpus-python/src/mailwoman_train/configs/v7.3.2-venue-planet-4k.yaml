# v7.3.2 treatment: the v7.2.0 base fine-tuned with venue rows for 147 countries (#2511).
#
# The same fine-tune as v7.3.1-venue-nr-4k.yaml (v7.2.0 step-060000 checkpoint, EWC 1e4, learning rate 1e-5,
# 4,000 steps at batch 128, `source_reps` divided by 15, venue share 3% of
# the run's draws) over corpus 0.7.3.2-venue-planet: the venue recipe at `--venue-region-fraction 0` over admin
# tuples for the 147 countries with at least 1,000 distinct Overture names and WOF admin pairs, with bare rows for
# spaceless-script names that end in a venue head. Each country's rows draw about a fifth as often as in v7.3.1,
# which covered 27 countries at the same share. Graded against the same placebo, v7.3.0-null-4k.yaml.
#
# The inherited receipt floors are the base's times 0.97 for the venue share and times 0.9 again. The base
# floors sit at 90% of their expected draws, and a receipt of about 200 draws has a standard deviation near 14,
# so that margin fails one audit in twelve by chance: `ve-locality-postcode-region` drew 223, 208, 197 and 207
# in the base, placebo, v7.3.0 and v7.3.1 audits and 185 against 194 in this corpus's first audit, with every
# large source within 1% of v7.3.1.
# 1637640 `spliced-venue-locality` rows and 1478399 `fragment-venue-bare` rows.

