# v5.9.0 — the US admin tail redrawn over locality name shape
#
# One variable. This config is v5.8.0-gazetteer-choreography-off-60k.yaml with
# `data.gazetteer_choreography` returned to v5.7.0's `true` and `data.corpus_dir` moved from
# v0.31.0-region-code-and-unit to v0.32.0-locality-shape. Seed, steps, every weight, every reps
# target and every receipt are identical. From scratch: no `init_from`, launched with
# `--resume none`, the same shape v5.7.0 and v5.8.0 used.
#
# Control: v5.7.0 itself, from-scratch at seed 42 with the flag on, so this arm is its twin and the
# only difference between them is which rows the US admin-tail source carries.
#
# what moved IN the corpus. v0.32.0-locality-shape overlays v0.30.0-bare-postcode with the same
# three sources v0.31.0 carries. `synth-trailing-region-ca-bare` and `synth-unit-v30` are copies of
# v0.31.0's parquet files, byte for byte. `synth-trailing-region-us` is rebuilt from the same
# `applyCountryBudget` round-robin with locality name shape added to the bucket key, so the tuple
# budget spends across (cc, region, shape) rather than (cc, region):
#
#   bucket                        v0.31.0            v0.32.0
#   ends in a USPS suffix word     1,653 (10.3%)      3,575 (22.4%)
#   other multi-word               1,924 (12.0%)      3,871 (24.2%)
#   single word                   12,423 (77.6%)      8,530 (53.4%)
#   total                         16,000             15,976
#
# 22.4% is the ceiling this budget can reach, and the reason is supply. The US GeoNames postal
# export carries 40,979 rows with both a place and an admin1, of which 4,189 end in a USPS suffix
# word; `createKnownLocalityCheck("US")` admits 4,060 of those, and the draw takes 3,575 of them
# (88.1%). An even three-way split at 16,000 tuples would need 5,333, which the source does not
# hold. Raising the share past 4,060/16,000 = 25.4% needs a smaller tuple budget or a second postal
# source.
#
# what is being fixed, and the reading behind it. `Saint Louis, MO 63131` answers no locality under
# v5.7.0, while `Saint Louis, MO 63131, USA` and `123 Main St, Saint Louis, MO 63131` both answer
# `Saint Louis`. Read through `diagnoseParse`, the first token of every failure carries `B-street`
# at 0.78 to 0.93:
#
#   Saint Louis, MO 63131    ▁Saint     B-street    0.92     locality: none
#   Little Rock, AR 72210    ▁Little    B-street    0.92     locality: none
#   Sparta, TN 38583         ▁Sparta    B-street    0.88     locality: none
#   Oxford, AR 72565         ▁Oxford    B-street    0.78     locality: none
#   Orland Park, IL 60467    ▁Orland    B-street    0.81     locality: none
#   Forrest City, AR 72335   ▁Forrest   B-locality  0.10     locality: Forrest City
#   Chicago, IL 60639        ▁Chicago   B-locality  0.87     locality: Chicago
#   Burlington, VT 05401     ▁Burlington B-locality 0.91     locality: Burlington
#
# Every name in the failing group is also a common US street name, and word count does not separate
# the two groups — `Sparta` and `Oxford` are single words and fail, `Forrest City` is two words and
# passes at 0.10. The quantity that moves is which names the model reads as a locality in the
# leading position of a three-component surface.
#
# The suffix-word bucket reads worst because a name ending in `Park`, `Valley`, `Creek` or
# `Springs` is street-shaped, so that bucket is a partial reading of the same ambiguity: it catches
# `Orland Park` and misses `Sparta`. The corpus change raises exposure to the part the bucket
# catches, by a factor of 3,575/1,653 = 2.16, and adds nothing for `Sparta`. Bar 2 exists to say
# whether the arm's gain follows that division or spreads across all three buckets, which would
# mean the stratification claimed nothing the extra rows alone would not have delivered.
#
# exposure. 60,000 steps x batch 128 = 7,680,000 samples. `synth-trailing-region-us` keeps
# `source_reps: 1.0`, so 15,976 rows draw about 2,080 per 1,000,000-row epoch, the same exposure
# v5.7.0 and v5.8.0 gave 16,000 rows. This arm adds no extra passes. It changes which rows the one
# pass reads.
#
# PRE-registered bars. Grade in order. Baselines were measured under the v5.7.0 candidate
# (`candidates/v570-cache`, `model.onnx` md5 e72b0cbb) with
# `packages/mailwoman/lib/dev-tools/us/locality-region-postcode-arms.run.ts`.
#
# Both panels are build-local and neither is committed, so the bars name how each is rebuilt.
# `$MAILWOMAN_DATA_ROOT/eval/coord/us-shape-stratified.jsonl` comes from
# `packages/mailwoman/lib/dev-tools/locality/stratified-panel.run.ts --stratify shape --per-region
# 400`, which rebuilds it byte for byte at sha256
# af671e351d3be6faa9dabf0ec9122d0b3ecd12140d03aa1c6b2bef9248d53a60. A bar that names a panel nobody
# can rebuild cannot be graded a second time.
#
#   1. target bucket. `us-shape-stratified.jsonl` carries 1,200 rows, 400 per bucket, over 1,132
#      distinct localities. Bare arm, suffix-word bucket: 123/379 (32.5%) under v5.7.0. It must
#      rise. This is the bucket the corpus change adds 1,922 rows for.
#
#   2. untargeted buckets, which is what separates a shape result from a row-count result. Same
#      panel, same arm: other multi-word 189/358 (52.8%) and single word 321/395 (81.3%). Neither
#      may fall. If both rise by as much as bucket 1 does, the arm measured more US admin-tail rows
#      rather than their shape, and the stratification carries no separate result.
#
#   3. continuity and the reverse risk. `us.jsonl` (603 distinct localities), the panel v5.7.0 and
#      v5.8.0 were graded on: bare 555/603 (92.0%) may not fall, and `street_only` 594/603 may not
#      fall. `street_only` puts a real street where the locality belongs and a row answering no
#      locality is the pass, so it is where teaching this surface would show up as harm.
#
#   4. the D-rule, and the number v5.8.0 failed at. `mwdev_promotion_eval --spec v9.0.0-base` must
#      pass every declared floor, no row may regress on FR, GB or DE, and US `postcode` per-tag F1
#      must hold at v5.7.0's 95.6% (n=2,660). v5.8.0 read 95.2% there and 10 FR/GB/DE regressions,
#      and both readings are why its mechanism did not ship.
#
# The receipts below fail the run before the GPU starts if the US source does not draw.

data:
  corpus_dir: /data/corpus/versioned/v0.32.0-locality-shape/corpus-v0.32.0-locality-shape
  tokenizer_dir: /data/models/tokenizer/v0.9.0-multisplice
  max_length: 128
  country_weights:
