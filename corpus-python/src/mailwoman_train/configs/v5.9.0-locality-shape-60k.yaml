    overture: 3.0
    gnaf: 6.0
    synth-anchor-absorption: 6.0
    synth-fr-bare-street: 0.0 # Replaced by synth-fr-bare-street-v22.
    synth-fr-bare-street-v22: 12.0
    synth-si-bare-village: 12.0
    synth-no-street-led: 0.0
    synth-cz-pcfirst-preposition: 0.0 # Replaced by synth-cz-pcfirst-preposition-v21.
    synth-cz-pcfirst-preposition-v21: 12.0
    synth-nl-postcode: 6.0
    synth-fragment: 6.0
    synth-fr-fragment: 12.0
    synth-no-fragment: 12.0
    synth-gb: 6.0
    synth-sub-venue: 12.0
    synth-suffix-boundary: 2.5
  # These sources set passes per row, and the loader derives their weights. Together they take about
  # 6.6% of the 7,680,000 samples in the run. Large register sources take one pass, and sources of
  # about 5,000 rows take eight. The values are unchanged from v5.7.0.
  source_reps:
    synth-sg-register: 1.0
    synth-pk-register: 1.0
    synth-bd-register: 8.0
    synth-trailing-region-es-v28: 8.0
    synth-po-box-military: 8.0
    osm: 0.5
    synth-bare-postcode: 1.0
    synth-trailing-region-us: 1.0
    synth-trailing-region-ca-bare: 4.0
  required_corpus_receipts:
    # Each receipt stops the run when the epoch-mixture audit draws fewer matching rows than `min_draws`.
    # Each floor sits at a quarter or less of the expected draw.
    - name: us-city-state-postcode
      min_draws: 500
      source: synth-trailing-region-us
      country: US
      component_sequence:
        - locality
        - region
        - postcode
    - name: ca-region-code-tail
      min_draws: 1000
      source: synth-trailing-region-ca-bare
      country: CA
    - name: us-secondary-unit-current-generation
      min_draws: 2000
      source: synth-unit-v30
      country: US
    # The receipts below are unchanged from v5.6.0.
    - name: bare-postcode-czech
      min_draws: 250
      source: synth-bare-postcode
      country: CZ
    - name: cz-postcode-first-current-generation
      min_draws: 1000
      source: synth-cz-pcfirst-preposition-v21
      country: CZ
    - name: fr-bare-street-current-generation
      min_draws: 1000
      source: synth-fr-bare-street-v22
      country: FR
    - name: ve-locality-postcode-region
      min_draws: 250
      source: synth-reviewed-postcode-tail
      country: VE
      component_sequence:
        - locality
        - postcode
        - region
    - name: sg-registers
      min_draws: 1000
      source: synth-sg-register
      country: SG
    - name: pk-house-line
      min_draws: 1000
      source: synth-pk-register
      country: PK
    - name: bd-trailing-postcode
      min_draws: 500
      source: synth-bd-register
      country: BD
    - name: es-trailing-region-local-surfaces
      min_draws: 500
      source: synth-trailing-region-es-v28
      country: ES
    - name: us-military-po-box
      min_draws: 500
      source: synth-po-box-military
      country: US
    - name: osm-south-asia-formats
      min_draws: 1000
      source: osm
  augment_exclude_sources:
    - synth-suffix-boundary
    # This source teaches a postcode alone, such as `119 00`, so augmentation would add tokens the row
    # must not contain.
    - synth-bare-postcode
  train_rows_per_epoch: 1000000
  val_rows: 4096
  coarse_filter: true
  augment_directional_prob: 0.3
  augment_region_prob: 0.3
  augment_glue_prob: 0.25
  augment_ordinal_prob: 0.3
  augment_punct_drop_prob: 0.3
  anchor_lookup_path: /data/anchor/pilot-anchor-lookup-v2-2026-08-05.json
  gazetteer_lexicon_path: /data/gazetteer/anchor-lexicon-v1.json
  country_lexicon_path: /data/gazetteer/country-surface-lexicon-v1.json
  gazetteer_choreography: true
  affix_relabel_lexicon_path: /data/gazetteer/affix-relabel-lexicon-v2.json
  anchor_paint_mode: shaped
  anchor_value_mode: posterior_latlon
  street_type_lexicon_path: /data/gazetteer/street-type-lexicon-v3.json
  locality_surface_lexicon_path: /data/gazetteer/locality-surface-lexicon-v7.json

model:
  hidden_size: 384
  use_span_boundary_head: true
  use_deploc_head: false
  span_boundary_loss_weight: 0.5
  num_hidden_layers: 6
  num_attention_heads: 6
  intermediate_size: 1536
  max_position_embeddings: 128
  type_vocab_size: 1
  hidden_dropout_prob: 0.1
  attention_probs_dropout_prob: 0.1
  use_crf: true
  crf_loss_weight: 0.0
  crf_normalization: per_sequence
  label_smoothing: 0.1
  use_locale_conditioning: true
  locale_loss_weight: 0.3
  use_postcode_anchor: true
  use_gazetteer_anchor: true
  gazetteer_feature_dim: 5
  use_country_anchor: true
  country_feature_dim: 2
  use_street_type_anchor: true
  street_type_feature_dim: 1
  use_locality_surface_anchor: true
  locality_surface_feature_dim: 2
  country_ambiguous_scale: 0.5
  class_weights:
    O: 0.5
    B-country: 3.5
    I-country: 3.5
    B-region: 1.5
    I-region: 1.5
    B-locality: 2.0
    I-locality: 2.0
    B-dependent_locality: 1.0
    I-dependent_locality: 1.0
    B-postcode: 1.5
    I-postcode: 1.5
    B-subregion: 0.3
    I-subregion: 0.3
    B-cedex: 1.0
    I-cedex: 1.0
    B-venue: 1.5
    I-venue: 1.5
    B-street: 2.0
    I-street: 2.0
    B-house_number: 1.5
    I-house_number: 1.5
    B-street_prefix: 1.5
    I-street_prefix: 1.5
    B-street_suffix: 1.5
    I-street_suffix: 1.5
    B-unit: 1.5
    I-unit: 1.5
    B-po_box: 1.5
    I-po_box: 1.5
    B-intersection_a: 1.0
    I-intersection_a: 1.0
    B-intersection_b: 1.0
    I-intersection_b: 1.0
  use_phrase_priors: true
  phrase_feature_dim: 10

train:
  output_dir: /data/output-v590-locality-shape-s42/checkpoints
  seed: 42
  batch_size: 128
  eval_batch_size: 128
  grad_accum_steps: 1
  learning_rate: 5.0e-4
  weight_decay: 0.01
  warmup_steps: 1000
  grad_clip_norm: 1.0
  max_steps: 60000
  eval_every_steps: 2000
  save_every_steps: 5000
  log_every_steps: 100
  precision: bf16
  num_workers: 0
  csv_log_path: "{output_dir}/../train_log.csv"
  lr_schedule: cosine
  gazetteer_curriculum: true
  evidence_curriculum: true
  evidence_noise_prob: 0.15
  fisher_capture: true
  fisher_capture_last_n_steps: 2000
  trackio_project: mailwoman
  trackio_run_name: v590-locality-shape-60k-s42

eval:
  golden_dir: /data/eval/golden/v0.1.3
  val_jsonl: ""
