    usgov-nad: 1.0
    state-tx-notaries: 1.5
    state-ny-notaries: 2.0
    # These two sources are set to zero to match v5.7.0, whose loader never indexed them. The current
    # loader sees them and rejects any source without a weight, so they must be listed.
    state-ia-contractors: 0.0
    usgov-imls-pls: 0.0
    deepseek-kryptonite: 3.0
    synth-intersection: 1.0
    synth-german: 6.0
    synth-fr-order: 3.0
    synth-fr-admin-split: 6.0
    synth-unit: 0.0 # Replaced by synth-unit-v30.
