# v5.9.0 redraws the US admin-tail source so that it covers locality name shapes more evenly.
#
# The control is v5.7.0. This config matches it except for `data.corpus_dir`, which moves from
# v0.31.0-region-code-and-unit to v0.32.0-locality-shape. Seed, steps, weights, reps targets and
# receipts are unchanged, and the run starts from scratch with `--resume none`.
#
# The corpus change: v0.32.0-locality-shape overlays v0.30.0-bare-postcode with the three sources
# that v0.31.0 carries. Two of them are byte-identical copies. `synth-trailing-region-us` is rebuilt
# with locality name shape added to the `applyCountryBudget` bucket key:
#
#   bucket                        v0.31.0            v0.32.0
#   ends in a USPS suffix word     1,653 (10.3%)      3,575 (22.4%)
#   other multi-word               1,924 (12.0%)      3,871 (24.2%)
#   single word                   12,423 (77.6%)      8,530 (53.4%)
#   total                         16,000             15,976
#
# The suffix-word share cannot rise much further, because the US GeoNames postal export holds only
# about 4,060 admitted suffix-word localities.
#
# The target failure is a bare `<locality>, <region> <postcode>` input whose locality is also a
# common street name, such as `Saint Louis, MO 63131`. The model tags its first token `B-street`
# and returns no locality.
#
# `synth-trailing-region-us` keeps `source_reps: 1.0`, so its exposure matches v5.7.0. Only the
# choice of rows changes.
#
# Pre-registered bars, graded in order against v5.7.0 baselines:
#
#   1. On `us-shape-stratified.jsonl`, the bare-arm suffix-word bucket (123/379 under v5.7.0) must rise.
#   2. On the same panel, the other multi-word (189/358) and single-word (321/395) buckets must not fall.
#      If they rise as much as bucket 1, the extra rows explain the result and the shape split adds nothing.
#   3. On `us.jsonl`, bare (555/603) and `street_only` (594/603) must not fall.
#   4. `mwdev_promotion_eval --spec v9.0.0-base` must pass every floor with no FR, GB or DE row
#      regression, and US `postcode` per-tag F1 must stay at 95.6%.
#
# `packages/mailwoman/lib/dev-tools/locality/stratified-panel.run.ts --stratify shape --per-region 400`
# rebuilds `$MAILWOMAN_DATA_ROOT/eval/coord/us-shape-stratified.jsonl`.
#
# The receipts below stop the run before the GPU starts if the US source does not draw.

