# === v1.0.0-consolidation (#466) — the v0-parity flag-plant ======================================
# One model carrying every proven parity change, at a larger step budget (the cumulative-dilution
# lesson: never stack N sources into a fixed 20k budget — give them room). This is not a single-variable
# experiment. it's the integration run. Changes folded in:
#   - unit          (shipped v4.1.0)                      → synth-unit 1.5
#   - affix         (multi-locale reroll, #469)           → synth-affix 2.0  (corpus v0.4.11-affix-ml)
#   - country       (balanced recipe output, #464)        → synth-country 2.0 (corpus v0.4.10-country-bal)
#   - gazetteer anchor (#464, knowledge-ladder rung 3.2)  → use_gazetteer_anchor + lexicon
#   - choreography  (#468, the v0.9.12 US-postcode fix)   → data.gazetteer_choreography (first trained here)
# po_box/cedex deferred (matcher-proven 100%; coverage recipes are a follow-up rather than in this flag-plant).
#
# Corpus v0.4.12-consolidation = the v0.4.11-affix-ml parquet files (base+unit+german+deepseek+multi-locale affix)
# + the v0.4.10-country-bal balanced country parquet file, referenced verbatim (pure manifest concat. every
# parquet already on the volume). Recipe inherits v0.9.13 (gazetteer anchor + country class-weight 3.5).
#
# Two deliberate changes vs v0.9.13:
#   1. max_steps 20k → 40k. The solo affix reroll (v0.9.14) showed fixed-budget dilution (FR
#      house_number 92→87, US street 80.4→79.0) when 40K balance rows competed for 20k steps. A larger
#      budget is the prescribed fix. 40k ≈ 2x exposure per source.
#   2. gazetteer_curriculum is off and gazetteer_choreography is on. The curriculum (random clue zero-out) only
#      recovered +0.6 of the −3.7 US-postcode dip in v0.9.13. The choreography (zero the clue on tokens
#      adjacent to a postcode-anchor hit, train+inference paired) is the targeted, DeepSeek-diagnosed
#      fix — and this run is its first training test. Stacking both suppressions would over-zero the
#      clue, so curriculum is dropped.
#
# PRE-registered check (stop at 40k), fp32-to-fp32 vs v4.1.0 (+ the solo-change banks):
#   - country ≥ v0.9.12 (83.3 F1 on country-homograph-real), P high, over-fire 0.
#   - affix: street_prefix ≥ 78, street_suffix ≥ 67 (score-affix, real-affix eval).
#   - unit ≥ 92 (unit-real-designators).
#   - US postcode back to baseline (≥ 97, fp32) — the choreography must absorb the v0.9.12 −3.7.
#   - FR postcode ≥ 99.5 and FR house_number ≥ 91 (the v0.9.14 watch-item — confirm the bigger budget
#     recovers it).
#   - US spine (street/locality/region/house_number) ≥ v0.9.8. DE native-order locality ≥ 83.8.
#   decision: all hold → v0-parity flag-plant. ship candidate (int8 → v4.2.0). Any tag short → the
#     dilution isn't budget-bound. fall back to weight-merge (#466's titled approach) or raise that
#     source's weight/budget. Measure: score-country-homograph.ts + score-affix.ts (incl. unit) +
#     per-locale-f1.ts (US/FR, --tokenizer + --model-anchor-lookup + --gazetteer-lexicon) +
#     de-order-eval.ts, all fp32.
#
# Required on the volume (synced before launch): the #468 choreography modules (gazetteer_anchor.py
# suppress_gazetteer_near_postcode + tokenizer/config/data_loader threading), the gazetteer lexicon at
# /data/gazetteer/anchor-lexicon-v1.json, and corpus v0.4.12-consolidation. Repro of the corpus:
#   (build the multi-locale affix + balanced country recipe outputs per #469 / #464, then assemble the manifest:
#    the affix-ml parquet files + the v0.4.10-country-bal `synth-country` train parquet file.)
# Launch:
#   cd corpus-python && modal run -d -m launch.train_remote \
#     --config v1.0.0-consolidation.yaml --resume none \
#     --trackio --trackio-space sister-software/mailwoman-trackio

data:
  corpus_dir: /data/corpus/versioned/v0.4.12-consolidation/corpus-v0.4.12-consolidation
  tokenizer_dir: /data/models/tokenizer/v0.6.0-a0
  max_length: 128
  country_weights:
    US: 1.0
    FR: 1.0
    DE: 1.0
  source_weights:
    wof-admin: 2.0
    wof-postalcode: 2.0
    ban: 3.0
    tiger: 4.0
    usgov-nppes: 2.0
    usgov-hrsa-fqhc: 2.0
    usgov-imls-pls: 2.0
    usgov-nad: 1.0
    state-ia-builders: 2.0
    state-tx-notaries: 1.5
    state-ny-notaries: 2.0
    deepseek-kryptonite: 3.0
    synth-po-box: 1.5
    synth-intersection: 0.2
    synth-german: 6.0
    # Every proven change rides at its solo-validated weight.
    synth-unit: 1.5
    # Run B (consensus #2): Run A's 5x (10.0) undershot — affix prefix 64.9/suffix 52.4 (need 72/64),
    # US postcode 96.1. Finding: affix is per-step density-bound — the affix-good diagnostic (20.0) beat
    # Run A (10.0) on affix and postcode despite 1/10th the steps. So land ~70% of the gap between Run A
    # (10.0→prefix 64.9) and the diagnostic (20.0→prefix 75): 17.0. Country (the opposer) held 85.7 at
    # 10.0 with headroom to the 83.3 floor, so it absorbs the denser affix schedule.
    synth-affix: 17.0
    synth-country: 2.0
  train_rows_per_epoch: 1000000
  val_rows: 4096
  coarse_filter: true
  augment_directional_prob: 0.3
  augment_region_prob: 0.3
  anchor_lookup_path: /data/anchor/pilot-anchor-lookup.json
  gazetteer_lexicon_path: /data/gazetteer/anchor-lexicon-v1.json
  # The v0.9.12 US-postcode fix (#468): zero the gazetteer clue on tokens adjacent to a postcode-anchor
  # hit, at train time (paired with classifier.suppressGazetteerNearPostcode at inference). First trained here.
  gazetteer_choreography: true

model:
  hidden_size: 384
  num_hidden_layers: 6
  num_attention_heads: 6
  intermediate_size: 1536
  max_position_embeddings: 128
  type_vocab_size: 1
  hidden_dropout_prob: 0.1
  attention_probs_dropout_prob: 0.1
  use_crf: true
  crf_loss_weight: 0.0
  crf_normalization: per_sequence
  label_smoothing: 0.1
  use_locale_conditioning: true
  locale_loss_weight: 0.3
  use_postcode_anchor: true
  use_gazetteer_anchor: true
  gazetteer_feature_dim: 5
  class_weights:
    O: 0.5
    B-country: 3.5
    I-country: 3.5
    B-region: 1.5
    I-region: 1.5
    B-locality: 2.0
    I-locality: 2.0
    B-dependent_locality: 0.3
    I-dependent_locality: 0.3
    B-postcode: 1.5
    I-postcode: 1.5
    B-subregion: 0.3
    I-subregion: 0.3
    B-cedex: 1.0
    I-cedex: 1.0
    B-venue: 1.5
    I-venue: 1.5
    B-street: 2.0
    I-street: 2.0
    B-house_number: 1.5
    I-house_number: 1.5
    # Run B: keep prefix at 2.0 (it recovered to 64.9, close), but suffix -> 4.0. Suffix is recall-
    # limited (52.4); a per-tag loss boost lifts it without changing batch composition — surgical, and
    # safe for country (country isn't in the affix source, so a suffix-tag weight can't touch its batches).
    B-street_prefix: 2.0
    I-street_prefix: 2.0
    B-street_suffix: 4.0
    I-street_suffix: 4.0
    B-unit: 1.5
    I-unit: 1.5
    B-po_box: 1.5
    I-po_box: 1.5
    B-intersection_a: 1.0
    I-intersection_a: 1.0
    B-intersection_b: 1.0
    I-intersection_b: 1.0
  use_phrase_priors: true
  phrase_feature_dim: 10

train:
  # Run B: init_from the clean consolidation step-040000 (weights only, fresh optimizer) into a new dir
  # — avoids Run A's 5x-biased momentum (DeepSeek) and avoids destructive deletes of Run A's checkpoints.
  # 20k steps on the 040000 weights ≈ the "+20k → 60k" continuation. the equilibrium is set by the
  # sampling weights rather than the optimizer init. Launch with --resume none so init_from takes effect.
  output_dir: /data/output-v101-runB-s42/checkpoints
  init_from: /data/output-v100-consolidation-s42/checkpoints/step-040000
  seed: 42
  batch_size: 128
  eval_batch_size: 128
  grad_accum_steps: 1
  learning_rate: 1.5e-4
  weight_decay: 0.01
  warmup_steps: 300
  grad_clip_norm: 1.0
  max_steps: 20000
  # eval every 2k → the DeepSeek capacity-tell is at step 8000 (8k into the resume): if suffix < 55 and
  # country < 84.5 there, stop — genuine equilibrium ceiling, escalate to a wider model (do not iterate).
  eval_every_steps: 2000
  save_every_steps: 2000
  log_every_steps: 50
  precision: bf16
  num_workers: 0
  csv_log_path: "{output_dir}/../train_log.csv"
  lr_schedule: constant
  gazetteer_curriculum: false
  trackio_project: mailwoman
  trackio_run_name: v1.0.2-consolidation-runB-s42

eval:
  golden_dir: /data/eval/golden/v0.1.2
  val_jsonl: ""
