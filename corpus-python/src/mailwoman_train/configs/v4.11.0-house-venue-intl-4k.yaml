# v4.11.0 — house-venue INTL (#1748 / #1821)
#
# THE FOURTH SHAPE, AND THE FIRST THAT CONTAINS ITS OWN ALTERNATIVES.
#
# Four trailing-region runs graded DO-NOT-SHIP because the slice carried ONLY admin segments and so
# damaged whichever class occupied the position it taught:
#
#   v4.8.0   9.4%   7/25 regressed, 12 venue-led   "Ye Three Lords, 27 Minories, London EC3N 1DE"
#                                                    -> locality "Ye Three Lords", venue AND street gone
#   v4.9.0   9.4%  11/31 regressed, 15 venue-led   binding moved to dependent_locality; bare streets broke
#   v4.10.0  3.1%   9/22 regressed,  9 venue-led   damage scales with dose, sub-linearly, and does not vanish
#
# `house-venue` was already emitting the surface those slices were built to teach. Its default tail is
# `${locality}, ${region} ${postcode}` — `Springfield, IL 02101` and `Bengaluru, Karnataka 560038` are
# the same shape — and EVERY row it emits carries a venue, a street AND a house number. The surface is
# taught with its alternatives present rather than against them.
#
# WHAT IS ADDED: 18,000 rows, IN/PT/MX, REAL (postcode, locality, region) triples from the GeoNames
# postal exports with the corrected column mapping (admin2 is the city; column 3 is a street or a
# colonia and becomes the dependent locality). Measured on the emitted slice: venue 100%, street 100%,
# house_number 100%.
#
#   Bob's Pizza, 9 Lake Dr, Srikakulam, Andhra Pradesh 532001
#   8457 Maple Blvd, Brasserie du Marche, Aguascalientes, Aguascalientes 20000
#
# DOSE: none to tune. The rows are emitted under the EXISTING `synth-house-venue` source, so they join
# a bucket that has shipped at weight 2.0 and take their share of it rather than claiming their own.
# That is deliberate — every previous failure in this arc came from a new source carrying ~9% of the
# stream on its own.
#
# STEPS: 4,000 rather than 8,000. The change is small and additive to a proven bucket, and the wall
# clock is real; if it needs longer it can resume.
#
# PRE-REGISTERED GATE:
#   1. the 12 venue-led rows v4.8.0 regressed must ALL hold — that is the defect this design fixes;
#   2. FR, GB and DE show no regression anywhere (D-rule, iron rule 6);
#   3. net improved-minus-regressed >= 0 on the 649-row board.

