# === v8-jp-probe — CJK Leg 1: bare char-level CharCNN on JP (the Arc-2 viability gate). ===
# FROM SCRATCH (no init_from): fresh MailwomanCoarseEncoder on the Latin-substrate width (hidden 384,
# 4 layers per the probe spec), STAGE3 33-label head, use_char_embed over the sealed JP char vocab
# (D2), one unit per character at ctx 3 → W 7, S 96 (D1/D3/D6). NO anchor/gazetteer/country/street/
# locality channels (channel re-alignment is per-unit, post-probe), no CRF, no locale conditioning.
#
# Corpus: v8-jp-probe (200k train / 4k val), rendered native large-to-small space-free from
# Overture-JP 2026-06-17.0 (MLIT lineage) by corpus-python/scripts/build_jp_probe_shard.py —
# stratified per-prefecture reservoirs, compact numbers as whole-span house_number (D4), 〒 fraction
# 0.30 joined from KEN_ALL, municipality-bucket board held out (never in train/val).
#
# PRE-REGISTERED GATE (2026-07-18-v8-jp-char-encoder-design §d, committed before any GPU):
#   PASS = JP coordinate-acceptability >= 0.70 on the held-out municipality board (the bare-Latin
#   substrate floor). PASS → Phases 2-5 (JP-seven activation, full shard, channels, ship).
#   FAIL → the written ladder: per-tag split → boundary audit → collapse check. A FAIL indicts ONLY
#   "bare char CharCNN alone reaches the floor" — never alignment (Phase 0 retired 1,560/1,560).
#   Leg 2 (unification bake-off, char-word vs SP on Latin) runs in the same session, gates v9 only.
#
# Launch: modal run -d corpus-python/modal/train_remote.py --config v8-jp-probe.yaml --resume none

data:
  corpus_dir: /data/corpus/versioned/v8-jp-probe
  # Unused in char mode (SentencePiece is skipped entirely); kept pointing at the production
  # tokenizer so config auditing stays uniform.
  tokenizer_dir: /data/models/tokenizer/v0.9.0-multisplice
  max_length: 96
  country_weights:
    JP: 1.0
  coarse_filter: false
  val_rows: 4096
  # --- The char path (D1/D3/D6): one unit per character, window = char ± 3 neighbors. ---
  char_mode: char
  char_vocab_path: /data/corpus/versioned/v8-jp-probe/char-vocab-jp-v1.json
  char_ctx: 3
  max_unit_width: 7
  max_units: 96

model:
  hidden_size: 384
  num_hidden_layers: 4
  num_attention_heads: 6
  intermediate_size: 1536
  max_position_embeddings: 96
  use_crf: false
  label_smoothing: 0.1
  use_char_embed: true
  char_embed_dim: 64

train:
  output_dir: /data/output-v8-jp-probe-s42
  seed: 42
  batch_size: 256
  eval_batch_size: 512
  learning_rate: 5.0e-4
  warmup_steps: 1000
  max_steps: 8000
  eval_every_steps: 1000
  save_every_steps: 2000
  log_every_steps: 100
  precision: bf16
  lr_schedule: cosine
  grad_clip_norm: 1.0
