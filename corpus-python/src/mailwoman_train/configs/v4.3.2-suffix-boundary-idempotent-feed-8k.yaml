# === v4.3.2-suffix-boundary-idempotent-feed-8k — #1569 corrected-label fine-tune ===
#
# ONE CHANGE: add the 30k-row `synth-suffix-boundary` overlay/dose to the shipped 9.0.0 base's
# v0.17.0 feed. Same tokenizer, model geometry, trained channels and data weights as
# v4.2.0-base-anchor-v2. This is a fresh-optimizer same-vocab fine-tune from that run's step-60000;
# it is NOT a resume or an extension of the completed cosine schedule. EWC lambda 1e4 is the B11
# calibration winner from v4.1.2. Launch exactly once with `--resume none`.
#
# ONE EFFECTIVE CHANGE: repair the load-time target labels. The v4.3.0/v4.3.1 runs were trained after the
# affix relabel pass corrupted an already-decomposed terminal-only street into two suffixes. The corrected
# 250k selectable-feed audit holds carrier prevalence fixed and moves the target slice from 5,183/16,143
# correct to 16,143/16,143; terminal contrast remains exactly 5,405/5,505. Removing two absent positive
# source weights is declarative cleanup only: the old loader already omitted them, so the sampled mix is
# unchanged (33 positive sources, denominator 170.5, target share 7.04%).
#
# ORIGINAL PRE-RUN BASE CONSISTENCY CLAIM (superseded): existing affix rows label terminal contrasts correctly;
# the target terminal-only class was believed sparse/absent. OA source pools before sampling:
# 163,606 terminal-only and 11,734 terminal-contrast. The emitted slice is exactly 24,000/6,000
# (80%/20%) after alignment, seed 1569, JSONL sha256
# f3c4948ed446800390fb5ac7c59063ea9ed57d6b0c358f2f620286003e23e9f5.
#
# HISTORICAL RECIPE CORRECTION: the first 40/60 run moved a 100-row TRAIN target sample only 4→11 while
# contrast was already 95/100 shipped (93/100 at 8k). This run reverses only the class mix to 80/20; total
# rows, source weight, optimizer, EWC and every bar below are unchanged.
#
# PRE-REGISTERED JOINT BOARD (golden v0.1.3 only; never mix v0.1.2):
# B1 target — 128 dev/us rows structurally classified `terminal-only` by the same corpus classifier.
#   fp32 shipped baseline exact street+street_suffix = 6/128. PASS >=116/128, which recovers at
#   least 110/122 current fp32 misses (>=90%). This reconciles #1569's rounded 125-miss issue text
#   with the reproducible fp32 instrument instead of changing board membership after training.
# B2 contrast — 48 dev/us rows structurally classified `terminal-contrast`; fp32 baseline exact
#   street+street_suffix = 34/48. PASS >=34/48.
# B3 D-rule — `mailwoman eval promote --spec v9.0.0-base` on every candidate save; zero known tier-1
#   regression. Compare fp32 candidate to fp32 shipped checkpoint with tokenizer v0.9.0-multisplice.
# B4 opposite-direction #1519 guard — Tel Aviv-Yafo, Port Louis, Port of Spain. Baseline exact
#   locality 0/3 and locality-token retention 3/7. PASS retention >=3/7; exact is a tracked upside.
#   `Amphitheatre Parkway` is deliberately absent: under v0.1.3 it is correctly street
#   `Amphitheatre` + suffix `Parkway`, not a truncation sentinel.
# STOP: grade steps 2000/4000/6000/8000. Choose the earliest save clearing B1/B2/B4 + D-rule. If none
# clears, stop and escalate to the pre-registered base-run hypothesis; no recipe treadmill and no #1570 decode patch.

data:
  corpus_dir: /data/corpus/versioned/v0.18.1-suffix-boundary/corpus-v0.18.1-suffix-boundary
  tokenizer_dir: /data/models/tokenizer/v0.9.0-multisplice
  max_length: 128
  country_weights:
    US: 1.0
    FR: 1.0
    DE: 1.0
    ES: 1.0
    IT: 1.0
    NL: 1.0
    PT: 1.0
    BE: 1.0
    PL: 1.0
    AT: 1.0
    CH: 1.0
    CZ: 1.0
    DK: 1.0
    "NO": 1.0
    SE: 1.0
    FI: 1.0
    IE: 1.0
    GB: 1.0
    SK: 1.0
    SI: 1.0
    HR: 1.0
    HU: 1.0
    AU: 1.0
    CA: 1.0
    MX: 1.0
  source_weights: # v4.2.0 selectable mix + the ONE new source below; absent train sources removed.
    synth-house-venue: 2.0
    overture-latam: 6.0
    wof-admin: 2.0
    wof-postalcode: 2.0
    ban: 3.0
    tiger: 4.0
    usgov-nppes: 2.0
    usgov-hrsa-fqhc: 2.0
    usgov-nad: 1.0
    state-tx-notaries: 1.5
    state-ny-notaries: 2.0
    deepseek-kryptonite: 3.0
    synth-intersection: 1.0
    synth-german: 6.0
    synth-fr-order: 3.0
    synth-fr-admin-split: 6.0
    synth-unit: 1.5
    synth-po-box-cedex: 1.5
    synth-affix: 2.0
    synth-country: 2.0
    overture: 3.0
    gnaf: 6.0
    synth-anchor-absorption: 6.0
    synth-fr-bare-street: 12.0
    synth-si-bare-village: 12.0
    synth-no-street-led: 0.0
    synth-cz-pcfirst-preposition: 12.0
    synth-nl-postcode: 6.0
    synth-fragment: 6.0
    synth-fr-fragment: 12.0
    synth-no-fragment: 12.0
    synth-gb: 6.0
    synth-sub-venue: 12.0
    synth-suffix-boundary: 12.0 # ONE DELTA: 7.04% configured/selectable share.
  train_rows_per_epoch: 1000000
  val_rows: 4096
  coarse_filter: true
  augment_directional_prob: 0.3
  augment_region_prob: 0.3
  augment_glue_prob: 0.25
  augment_ordinal_prob: 0.3
  augment_punct_drop_prob: 0.3
  anchor_lookup_path: /data/anchor/pilot-anchor-lookup-v2-2026-08-05.json
  gazetteer_lexicon_path: /data/gazetteer/anchor-lexicon-v1.json
  country_lexicon_path: /data/gazetteer/country-surface-lexicon-v1.json
  gazetteer_choreography: true
  affix_relabel_lexicon_path: /data/gazetteer/affix-relabel-lexicon-v1.json
  anchor_paint_mode: shaped
  anchor_value_mode: posterior_latlon
  street_type_lexicon_path: /data/gazetteer/street-type-lexicon-v3.json
  locality_surface_lexicon_path: /data/gazetteer/locality-surface-lexicon-v7.json

model: # v4.2.0 geometry VERBATIM.
  hidden_size: 384
  use_span_boundary_head: true
  use_deploc_head: false
  span_boundary_loss_weight: 0.5
  num_hidden_layers: 6
  num_attention_heads: 6
  intermediate_size: 1536
  max_position_embeddings: 128
  type_vocab_size: 1
  hidden_dropout_prob: 0.1
  attention_probs_dropout_prob: 0.1
  use_crf: true
  crf_loss_weight: 0.0
  crf_normalization: per_sequence
  label_smoothing: 0.1
  use_locale_conditioning: true
  locale_loss_weight: 0.3
  use_postcode_anchor: true
  use_gazetteer_anchor: true
  gazetteer_feature_dim: 5
  use_country_anchor: true
  country_feature_dim: 2
  use_street_type_anchor: true
  street_type_feature_dim: 1
  use_locality_surface_anchor: true
  locality_surface_feature_dim: 2
  country_ambiguous_scale: 0.5
  class_weights:
    O: 0.5
    B-country: 3.5
    I-country: 3.5
    B-region: 1.5
    I-region: 1.5
    B-locality: 2.0
    I-locality: 2.0
    B-dependent_locality: 1.0
    I-dependent_locality: 1.0
    B-postcode: 1.5
    I-postcode: 1.5
    B-subregion: 0.3
    I-subregion: 0.3
    B-cedex: 1.0
    I-cedex: 1.0
    B-venue: 1.5
    I-venue: 1.5
    B-street: 2.0
    I-street: 2.0
    B-house_number: 1.5
    I-house_number: 1.5
    B-street_prefix: 1.5
    I-street_prefix: 1.5
    B-street_suffix: 1.5
    I-street_suffix: 1.5
    B-unit: 1.5
    I-unit: 1.5
    B-po_box: 1.5
    I-po_box: 1.5
    B-intersection_a: 1.0
    I-intersection_a: 1.0
    B-intersection_b: 1.0
    I-intersection_b: 1.0
  use_phrase_priors: true
  phrase_feature_dim: 10

train: # Same-vocab fine-tune from shipped 9.0.0, fresh optimizer, EWC brake.
  init_from: /data/output-v420-base-anchor-v2-s42/checkpoints/step-060000
  ewc_lambda: 1.0e4
  ewc_fisher_path: /data/output-v420-base-anchor-v2-s42/checkpoints/step-060000/fisher-diag-v1.npz
  ewc_reference: /data/output-v420-base-anchor-v2-s42/checkpoints/step-060000
  output_dir: /data/output-v432-suffix-boundary-idempotent-feed-s42/checkpoints
  seed: 42
  batch_size: 128
  eval_batch_size: 128
  grad_accum_steps: 1
  learning_rate: 1.0e-5
  weight_decay: 0.01
  warmup_steps: 200
  grad_clip_norm: 1.0
  max_steps: 8000
  eval_every_steps: 2000
  save_every_steps: 2000
  log_every_steps: 100
  precision: bf16
  num_workers: 0
  csv_log_path: "{output_dir}/../train_log.csv"
  lr_schedule: cosine
  gazetteer_curriculum: true
  evidence_curriculum: true
  evidence_noise_prob: 0.15
  trackio_project: mailwoman
  trackio_run_name: v432-suffix-boundary-idempotent-feed-s42

eval:
  golden_dir: /data/eval/golden/v0.1.3
  val_jsonl: ""
