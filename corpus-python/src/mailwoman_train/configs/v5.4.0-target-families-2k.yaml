  weight_decay: 0.01
  warmup_steps: 100
  grad_clip_norm: 1.0
  max_steps: 2000
  eval_every_steps: 500
  save_every_steps: 1000
  log_every_steps: 50
  precision: bf16
  num_workers: 0
  csv_log_path: "{output_dir}/../train_log.csv"
  lr_schedule: cosine
  gazetteer_curriculum: true
  evidence_curriculum: true
  evidence_noise_prob: 0.15
