  # Reps per row, not weights (#1677). 60,000 steps x batch 128 = 7,680,000 samples, so the six
  # sources below demand 1.0*142083 + 1.0*80081 + 8.0*4551 + 8.0*4944 + 8.0*5279 + 0.5*153965 =
  # 417,339 draws, 5.4% of the run. The big register slices take one pass each because they carry
  # their diversity in the rows; the four-to-five-thousand-row slices take eight, which is the
  # exposure `synth-suffix-boundary` already draws at weight 2.5.
