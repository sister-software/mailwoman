# This recipe is v0.9.8-affix.yaml trained on a multi-locale affix corpus.
# The v0.4.11-affix-ml corpus is v0.4.6-affix with the synth-affix rows replaced. The new rows come
# from packages/corpus/lib/recipes/street/affix.ts: 50,000 US affix splits, which match the v0.9.8
# exposure, plus 40,000 FR, DE, IT and NL rows in native component order without affix splits.
# The added rows restore the postcode-before-locality order that US-only affix rows diluted in FR.
#
# The per-locale F1 scorer folds affixes into `street`, so the affix split needs a separate scorer.
# The real-affix eval set is data/eval/external/street-affix-real.jsonl.
#
# Stage the corpus through R2 before launch:
#   mailwoman corpus upload --corpus-version v0.4.11-affix-ml
#   modal run -m launch.train_remote::sync_assets --corpus-versions v0.4.11-affix-ml
#
# Launch it from corpus-python with:
#   modal run -d -m launch.train_remote \
#     --config v0.9.14-affix-ml.yaml --resume none \
#     --trackio --trackio-space sister-software/mailwoman-trackio

data:
  corpus_dir: /data/corpus/versioned/v0.4.11-affix-ml/corpus-v0.4.11-affix-ml
  tokenizer_dir: /data/models/tokenizer/v0.6.0-a0
  max_length: 128
  country_weights:
    US: 1.0
    FR: 1.0
    DE: 1.0
  source_weights:
    wof-admin: 2.0
    wof-postalcode: 2.0
    ban: 3.0
    tiger: 4.0
    usgov-nppes: 2.0
    usgov-hrsa-fqhc: 2.0
    usgov-imls-pls: 2.0
    usgov-nad: 1.0
    state-ia-contractors: 2.0
    state-tx-notaries: 1.5
    state-ny-notaries: 2.0
    deepseek-kryptonite: 3.0
    synth-po-box: 1.5
    synth-intersection: 0.2
    synth-german: 6.0
    # The synth-unit source keeps the unit training that the v4.1.0 model shipped with.
    synth-unit: 1.5
    # At weight 2.0 the 50,000 US affix rows match the v0.9.8 exposure. The balance rows share the weight.
    synth-affix: 2.0
  train_rows_per_epoch: 1000000
  val_rows: 4096
  coarse_filter: true
  augment_directional_prob: 0.3
  augment_region_prob: 0.3
  anchor_lookup_path: /data/anchor/pilot-anchor-lookup.json

model:
  hidden_size: 384
  num_hidden_layers: 6
  num_attention_heads: 6
  intermediate_size: 1536
  max_position_embeddings: 128
  type_vocab_size: 1
  hidden_dropout_prob: 0.1
  attention_probs_dropout_prob: 0.1
  use_crf: true
  crf_loss_weight: 0.0
  crf_normalization: per_sequence
  label_smoothing: 0.1
  use_locale_conditioning: true
  locale_loss_weight: 0.3
  use_postcode_anchor: true
  class_weights:
    O: 0.5
    B-country: 2.0
    I-country: 2.0
    B-region: 1.5
    I-region: 1.5
    B-locality: 2.0
    I-locality: 2.0
    B-dependent_locality: 0.3
    I-dependent_locality: 0.3
    B-postcode: 1.5
    I-postcode: 1.5
    B-subregion: 0.3
    I-subregion: 0.3
    B-cedex: 1.0
    I-cedex: 1.0
    B-venue: 1.5
    I-venue: 1.5
    B-street: 2.0
    I-street: 2.0
    B-house_number: 1.5
    I-house_number: 1.5
    B-street_prefix: 1.5
    I-street_prefix: 1.5
    B-street_suffix: 1.5
    I-street_suffix: 1.5
    B-unit: 1.5
    I-unit: 1.5
    B-po_box: 1.5
    I-po_box: 1.5
    B-intersection_a: 1.0
    I-intersection_a: 1.0
    B-intersection_b: 1.0
    I-intersection_b: 1.0
  use_phrase_priors: true
  phrase_feature_dim: 10

train:
  output_dir: /data/output-v0914-affix-ml-s42/checkpoints
  seed: 42
  batch_size: 128
  eval_batch_size: 128
  grad_accum_steps: 1
  learning_rate: 1.5e-4
  weight_decay: 0.01
  warmup_steps: 1000
  grad_clip_norm: 1.0
  max_steps: 20000
  eval_every_steps: 2000
  save_every_steps: 2000
  log_every_steps: 50
  precision: bf16
  num_workers: 0
  csv_log_path: "{output_dir}/../train_log.csv"
  lr_schedule: constant
  trackio_project: mailwoman
  trackio_run_name: v0.9.14-affix-ml-s42

eval:
  golden_dir: /data/eval/golden/v0.1.2
  val_jsonl: ""
