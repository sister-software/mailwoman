# v4.6.0-admin-surfaces — the first-refusal-era from-scratch base (2026-08-15).
#
# The v4.4.0 suffix-boundary-v2 recipe VERBATIM (from scratch, 60k cosine, s42) over the
# v0.23.0-admin-surfaces overlay. Four corpus deltas, each carrying a standing board failure:
#   1. cz-pcfirst v21 + fr-bare-street v22 — the v4.5.x counter-form shards, doses held at their
#      probe-verified values (fr 6.0 / cz 12.0). The fine-tune arc proved these classes need a
#      BASE run (three cycles, Fisher brake blind to rare classes — scratchpad/v45x-final-verdict.md).
#   2. bare-country v23 (277 rows, weight 1.0 — per-source draw share, so a small weight still
#      repeats each row ~20x/epoch; the Japan-parses-as-locality class, #1651's parse half).
#   3. trailing-region es v23 (Portopetro: '«locality», «region», Spain' tails from WOF pairs).
#   4. trailing-region gb v23 (St Margaret's Hope: venue-looking locality names, 8x extraction
#      weight on the venue-ish subset).
# Gates: the 500-step feed smoke precedes the launch; the full battery + the 349-row regression
# board grade the result; the two standing board rows (es-op3-southeast-portopetro,
# gb-op2-st-margarets-hope) are the acceptance tests. PROMOTE IS THE OPERATOR'S.
#
# === v4.4.0-suffix-boundary-v2-base-60k — #1569 corrected-contract base (five-whys countermeasures) ===
#
# HYPOTHESIS: the v4.3.3 B1 plateau (72-85/128 across 5k-46k incl. the completed-schedule
# cooldown branch) was caused by a CONTRADICTORY feed — ~78% of ordinary-source terminal-only
# carriers taught "absorb the suffix" (the relabel guard refused name-prone splits) while the
# synthetic shard taught "split", and the model learned the context discrimination instead
# (rich rows 5/43 vs bare 53/65). This run trains the same geometry from scratch with the
# contradiction removed and the dose/diversity levers corrected.
#
# EFFECTIVE DELTAS vs v4.3.3 (each carries its own receipt in scratchpad/SUFFIX_BOUNDARY_TRAINING.md):
#   1. affix lexicon v2 — positional licensing: ordinary terminal-only carriers 21.0% -> 94.0%
#      correct (250k feed audit, contrast classes unchanged). The absorb signal is gone.
#   2. corpus v0.19.0 — suffix shard v2: real 16,432-name venue shell at 30% (was 6 template
#      strings; the failing context), 3,694 stem-pair hard negatives ('Menlo Park Road' +
#      'Menlo Park' sharing a stem), A/B byte-identical at seed 1569 (sha256 d939a762...).
#   3. dose: source weight 12.0 -> 2.5 = ~1.55% of draws = ~4.0 effective passes over the 30k
#      shard per 60k run (the published repetition knee; was ~18 passes/row, ~140 per unique span).
#   4. augment_exclude_sources: the shard bypasses augmentation (copies of an oversampled
#      template shard compound repetition without adding diversity; augmented rows measured at
#      25.5% of the emitted budget).
# TRAINING SEMANTICS otherwise verbatim v4.3.3: from scratch, no init_from, no EWC, LR 5e-4,
# warmup 1,000, 60k cosine, batch 128, bf16, Fisher capture over the final 2k steps, seed 42.
# The loader is the repaired substrate (stationary sampler, clean val, atomic checkpoints).
#
# GATES (fp32, unchanged):
#   B1 terminal-only >=116/128
#   B2 terminal-contrast >=34/48
#   B4 locality-token retention >=3/7 (exact locality is an upside watch)
#   B3 `mailwoman eval gate --gate v9.0.0-base`, zero known tier-1 regression, only after B1/B2/B4
# Grade 5k/10k/20k/40k/60k fp32. GRADE DISCIPLINE: mid-cosine reads understate the finished
# model (the 40k cooldown branch measured the tail worth +3 B1) — interim grades are curve
# telemetry, the 60k grade is the verdict. If 60k misses B1, stop this lever; the next moves
# are the street-type channel position-encoding and decode-time span scoring, not a re-dose.

data:
  corpus_dir: /data/corpus/versioned/v0.23.0-admin-surfaces/corpus-v0.23.0-admin-surfaces
  tokenizer_dir: /data/models/tokenizer/v0.9.0-multisplice
  max_length: 128
  country_weights:
    US: 1.0
    FR: 1.0
    DE: 1.0
    ES: 1.0
    IT: 1.0
    NL: 1.0
    PT: 1.0
    BE: 1.0
    PL: 1.0
    AT: 1.0
    CH: 1.0
    CZ: 1.0
    DK: 1.0
    "NO": 1.0
    SE: 1.0
    FI: 1.0
    IE: 1.0
    GB: 1.0
    SK: 1.0
    SI: 1.0
    HR: 1.0
    HU: 1.0
    AU: 1.0
    CA: 1.0
    MX: 1.0
  source_weights:
    synth-house-venue: 2.0
    overture-latam: 6.0
    wof-admin: 2.0
    wof-postalcode: 2.0
    ban: 3.0
    tiger: 4.0
    usgov-nppes: 2.0
    usgov-hrsa-fqhc: 2.0
    usgov-nad: 1.0
    state-tx-notaries: 1.5
    state-ny-notaries: 2.0
    deepseek-kryptonite: 3.0
    synth-intersection: 1.0
    synth-german: 6.0
    synth-fr-order: 3.0
    synth-fr-admin-split: 6.0
    synth-unit: 1.5
    synth-po-box-cedex: 1.5
    synth-affix: 2.0
    synth-country: 2.0
    overture: 3.0
    gnaf: 6.0
    synth-anchor-absorption: 6.0
    synth-fr-bare-street: 0.0 # v0.9.4 vintage SUPERSEDED by -v22
    synth-si-bare-village: 12.0
    synth-no-street-led: 0.0
    synth-cz-pcfirst-preposition: 0.0 # SUPERSEDED by -v21
    synth-nl-postcode: 6.0
    synth-fragment: 6.0
    synth-fr-fragment: 12.0
    synth-no-fragment: 12.0
    synth-gb: 6.0
    synth-sub-venue: 12.0
    synth-suffix-boundary: 2.5
    # The v4.5.x counter-form vintages (see the header). Superseded vintages NEVER co-feed.
    synth-fr-bare-street-v20: 0.0 # SUPERSEDED by -v22
    synth-fr-bare-street-v21: 0.0 # SUPERSEDED by -v22
    synth-fr-bare-street-v22: 6.0
    synth-cz-pcfirst-preposition-v20: 0.0 # SUPERSEDED by -v21
    synth-cz-pcfirst-preposition-v21: 12.0
    # The v0.23.0 admin-surface shards (the header's deltas 2-4).
    synth-bare-country-v23: 1.0
    synth-trailing-region-es-v23: 6.0
    synth-trailing-region-gb-v23: 6.0
  augment_exclude_sources:
    - synth-suffix-boundary
  train_rows_per_epoch: 1000000
  val_rows: 4096
  coarse_filter: true
  augment_directional_prob: 0.3
  augment_region_prob: 0.3
  augment_glue_prob: 0.25
  augment_ordinal_prob: 0.3
  augment_punct_drop_prob: 0.3
  anchor_lookup_path: /data/anchor/pilot-anchor-lookup-v2-2026-08-05.json
  gazetteer_lexicon_path: /data/gazetteer/anchor-lexicon-v1.json
  country_lexicon_path: /data/gazetteer/country-surface-lexicon-v1.json
  gazetteer_choreography: true
  affix_relabel_lexicon_path: /data/gazetteer/affix-relabel-lexicon-v2.json
  anchor_paint_mode: shaped
  anchor_value_mode: posterior_latlon
  street_type_lexicon_path: /data/gazetteer/street-type-lexicon-v3.json
  locality_surface_lexicon_path: /data/gazetteer/locality-surface-lexicon-v7.json

model:
  hidden_size: 384
  use_span_boundary_head: true
  use_deploc_head: false
  span_boundary_loss_weight: 0.5
  num_hidden_layers: 6
  num_attention_heads: 6
  intermediate_size: 1536
  max_position_embeddings: 128
  type_vocab_size: 1
  hidden_dropout_prob: 0.1
  attention_probs_dropout_prob: 0.1
  use_crf: true
  crf_loss_weight: 0.0
  crf_normalization: per_sequence
  label_smoothing: 0.1
  use_locale_conditioning: true
  locale_loss_weight: 0.3
  use_postcode_anchor: true
  use_gazetteer_anchor: true
  gazetteer_feature_dim: 5
  use_country_anchor: true
  country_feature_dim: 2
  use_street_type_anchor: true
  street_type_feature_dim: 1
  use_locality_surface_anchor: true
  locality_surface_feature_dim: 2
  country_ambiguous_scale: 0.5
  class_weights:
    O: 0.5
    B-country: 3.5
    I-country: 3.5
    B-region: 1.5
    I-region: 1.5
    B-locality: 2.0
    I-locality: 2.0
    B-dependent_locality: 1.0
    I-dependent_locality: 1.0
    B-postcode: 1.5
    I-postcode: 1.5
    B-subregion: 0.3
    I-subregion: 0.3
    B-cedex: 1.0
    I-cedex: 1.0
    B-venue: 1.5
    I-venue: 1.5
    B-street: 2.0
    I-street: 2.0
    B-house_number: 1.5
    I-house_number: 1.5
    B-street_prefix: 1.5
    I-street_prefix: 1.5
    B-street_suffix: 1.5
    I-street_suffix: 1.5
    B-unit: 1.5
    I-unit: 1.5
    B-po_box: 1.5
    I-po_box: 1.5
    B-intersection_a: 1.0
    I-intersection_a: 1.0
    B-intersection_b: 1.0
    I-intersection_b: 1.0
  use_phrase_priors: true
  phrase_feature_dim: 10

train:
  output_dir: /data/output-v460-admin-surfaces-s42/checkpoints
  seed: 42
  batch_size: 128
  eval_batch_size: 128
  grad_accum_steps: 1
  learning_rate: 5.0e-4
  weight_decay: 0.01
  warmup_steps: 1000
  grad_clip_norm: 1.0
  max_steps: 60000
  eval_every_steps: 2000
  save_every_steps: 5000
  log_every_steps: 100
  precision: bf16
  num_workers: 0
  csv_log_path: "{output_dir}/../train_log.csv"
  lr_schedule: cosine
  gazetteer_curriculum: true
  evidence_curriculum: true
  evidence_noise_prob: 0.15
  fisher_capture: true
  fisher_capture_last_n_steps: 2000
  trackio_project: mailwoman
  trackio_run_name: v460-admin-surfaces-s42

eval:
  golden_dir: /data/eval/golden/v0.1.3
  val_jsonl: ""
