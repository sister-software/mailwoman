[project]
name = "mailwoman-corpus-python"
version = "0.1.0"
description = "Python helpers for the Mailwoman corpus pipeline (SentencePiece tokenizer training + Phase 2 training)."
readme = "README.md"
license = { text = "AGPL-3.0-only OR LicenseRef-Commercial" }
requires-python = ">=3.11"
authors = [{ name = "Sister Software", email = "contact@sister.software" }]
dependencies = [
	# Pin loose; install via uv from this directory.
	# PyArrow was dropped in Phase 1.5 (#18 §4) when corpus build moved to JS-native Parquet
	# via @dsnp/parquetjs, then re-added in Phase 2 (issue #10) for the training data loader.
	"sentencepiece==0.2.2", # PINNED, not floored — see corpus-python/launch/train_remote.py for the 0.2.1/0.2.2 tie-break divergence
	"pyarrow>=25.0.0",
	"pyyaml>=6",
	"numpy>=1.26,<3",
	# Platform-native data/config/cache/temp directories, the counterpart of the `env-paths` the
	# TypeScript side resolves `DefaultMailwomanPaths` from. Both sides must answer the same
	# directory for the same platform, or a tool written in one language cannot find what the other
	# wrote. See `mailwoman_train/env.py`.
	"platformdirs>=4.3",
]

# Heavy ML deps live under [train] so plain tokenizer-training and corpus utilities
# can install without dragging PyTorch / Transformers / ONNX onto every machine.
[project.optional-dependencies]
dev = [
	# Local toolchain + tests. ruff is EXACT-pinned because package.json and .husky/pre-commit
	# call the same version through uvx — a dev-local ruff that disagrees with CI lints or formats
	# differently than the check does. This pin is the one those call sites must match, and
	# `scripts/verify_toolchain.py` fails when they do not, because a bump that moved this line
	# alone left them a minor version behind. mypy/bandit resolve through uv.lock, so they carry
	# floors only.
	"pytest>=9.1.1",
	"ruff==0.16.5",
	"mypy>=1.15",
	"bandit>=1.8",
	# PyYAML is untyped upstream; the stub package keeps `mypy --strict` honest about our code.
	"types-PyYAML>=6.0.12",
]
train = [
	# Pinned to the exact export/quant toolchain that produced the v4.1.0 ONNX artifact
	# (2026-06-09). Unpinned `>=` drifted (transformers→5.x, onnx→1.21) and broke int8
	# quant; these match corpus-python/launch/train_remote.py's image so a local export/quant
	# produces the same browser-shipped graph. See that file's pin comment for the
	# mobile-Safari (onnxruntime-web native WebGPU EP) invariant before bumping.
	"torch==2.12.0",
	"transformers==5.9.0",
	"datasets>=5.0.1",
	"onnx==1.22.0",
	# The dynamo exporter itself, so it decides the graph. This read 0.7.1 against the Modal image's
	# 0.7.0 and nothing noticed, because the consistency guard checked four of the five graph pins.
	# Both now read 0.7.2. The byte-identity receipt the onnx 1.21.0 -> 1.22.0 bump carries is OWED
	# here and not yet taken: it needs a re-export and re-quant on Modal, compared md5-for-md5
	# against the shipped fp32 and int8 artifacts. Take it before the next bundle ships.
	"onnxscript==0.7.2",
	"onnxruntime==1.26.0",
	"tqdm>=4.70.0",
	# Optional experiment tracking. Logging is best-effort and guarded at runtime
	# (see mailwoman_train/trackio_logging.py) so its absence never breaks a train run.
	"trackio",
]

[build-system]
requires = ["setuptools>=84.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

# Files the package SHIPS beside its modules. `py.typed` makes the annotations visible to a consumer
# that imports this package; `postcode-shapes.json` is the record `features/postcode_shapes.py`
# reads, and a wheel without it raises at import rather than at first use.
[tool.setuptools.package-data]
mailwoman_train = ["py.typed", "features/postcode-shapes.json", "configs/*.yaml"]

# Ruff — the Python analog of the repo's oxlint + oxfmt setup (lint + format in one fast tool).
[tool.ruff]
# Mirror the JS house style: 120-column width (double quotes are Ruff's default).
line-length = 120
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
# Ruff's defaults (pyflakes `F` + pycodestyle `E`) plus import sorting (`I`), pyupgrade
# (`UP`), and bugbear (`B`). Line length is enforced by the formatter, so the linter's
# `E501` is disabled to avoid double-reporting long lines it can't wrap (URLs, etc.).
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.format]
# Format code blocks inside docstrings too (this package is docstring-heavy).
docstring-code-format = true

# mypy — strict typing over src/, at zero errors. `launch/` is outside `files` because it imports
# the Modal SDK, which is not a dependency here: it is installed wherever `modal run` runs, so
# checking it locally would report every SDK name as missing. `scripts/` holds one standard-library
# file the pre-commit hook runs under a bare python3. Tests are out of scope for now.
[tool.mypy]
python_version = "3.12"
files = ["src", "launch"]
strict = true
show_error_codes = true
pretty = true
warn_unused_configs = true

# pyarrow and sentencepiece ship no py.typed marker; numpy and pyyaml (via types-PyYAML) are
# typed. The bare module name AND its submodules are both needed — "pyarrow.*" alone does not
# match "import pyarrow". If real stubs ever appear for either, drop this override, don't keep it.
[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*", "onnxruntime", "onnxruntime.*"]
ignore_missing_imports = true

# sentencepiece_model_pb2 ships a stub too sparse for protobuf usage; skip it so its
# classes are untyped rather than partially-typed (tokenizer_splice builds ModelProtos).
[[tool.mypy.overrides]]
module = ["sentencepiece.sentencepiece_model_pb2"]
follow_imports = "skip"

# The Modal SDK is installed wherever `modal run` runs, never here — see the `launch/` note below.
# With it absent, `modal` resolves to nothing and `app` is Any, which makes every `@app.function`
# an untyped decorator and every function it wraps untyped in turn. That cascade was 34 of the 85
# errors the launcher first reported; the other 51 were real missing annotations and are fixed.
# Relaxing the decorator rule for this package keeps the remaining 51 checked rather than trading
# the whole package out of mypy to silence a cascade that says nothing about the code.
[[tool.mypy.overrides]]
module = ["modal"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["launch.*"]
disallow_untyped_decorators = false

# bandit — security/static analysis over src. Tests are excluded by bandit's own defaults.
[tool.bandit]
exclude_dirs = ["launch", "scripts"]
# B311: pseudo-random generators are used for corpus sampling/splits, seeded for
# reproducibility (audits/, build_*_slice, data/loader.py, tokenizer/train.py). They are
# data-generation randomness, never security/crypto — the CSPRNG rule does not apply.
skips = ["B311"]
