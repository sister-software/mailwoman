approvedGitRepositories:
  - "**"

compressionLevel: mixed

enableGlobalCache: true

enableHardenedMode: false

enableScripts: true

httpRetry: 8

httpTimeout: 60000

# The Vale binary is fetched from the GitHub release API by the package's own
# postinstall, without an Authorization header. Anonymous api.github.com calls
# are rate-limited per IP, and an exhausted quota answers 403, which fails the
# whole install. Prose linting is not on any build or deploy path, so a missing
# binary must surface at `yarn lint:prose` instead. Yarn matches this pattern
# with micromatch under `contains`, so a wildcard cannot cross the slashes in
# the trailing log path — keep the pattern to the locator.
logFilters:
  - pattern: "@vvago/vale@npm:*"
    level: warning

nodeLinker: node-modules

npmMinimalAgeGate: 0

supportedArchitectures:
  cpu:
    - current
    - x86
    - x64
    - arm64
  os:
    - current
    - darwin
    - linux

yarnPath: .yarn/releases/yarn-4.18.0.cjs
