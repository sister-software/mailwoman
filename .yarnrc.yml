approvedGitRepositories:
  - "**"

compressionLevel: mixed

enableGlobalCache: true

enableHardenedMode: false

enableScripts: true

httpRetry: 8

httpTimeout: 60000

logFilters:
  - level: warning
    pattern: "@vvago/vale@npm:*"

nodeLinker: node-modules

npmMinimalAgeGate: 1d

# Our own packages install as soon as they publish. Everything else waits a day.
npmPreapprovedPackages:
  - "@sister.software/*"

supportedArchitectures:
  cpu:
    - current
    - x86
    - x64
    - arm64
  libc:
    - current
    - glibc
    - musl
  os:
    - current
    - darwin
    - linux

yarnPath: .yarn/releases/yarn-4.18.1.cjs
