approvedGitRepositories:
  - "**"

compressionLevel: mixed

enableGlobalCache: true

enableHardenedMode: false

enableScripts: true

httpRetry: 8

httpTimeout: 60000

nodeLinker: node-modules

npmMinimalAgeGate: 0

supportedArchitectures:
  cpu:
    - current
    - x86
    - x64
    - arm64
  os:
    - current
    - darwin
    - linux

yarnPath: .yarn/releases/yarn-4.18.0.cjs
