approvedGitRepositories:
  - "**"

compressionLevel: mixed

enableGlobalCache: true

enableHardenedMode: false

enableScripts: true

httpRetry: 8

httpTimeout: 60000

# The Vale binary is fetched from the GitHub release API by the package's own
# postinstall, without an Authorization header. Anonymous api.github.com calls
# are rate-limited per IP, and an exhausted quota answers 403, which fails the
# whole install. Prose linting is not on any build or deploy path, so a missing
# binary must surface at `yarn lint:prose` instead. Yarn matches this pattern
# with micromatch under `contains`, so a wildcard cannot cross the slashes in
# the trailing log path — keep the pattern to the locator.
logFilters:
  - pattern: "@vvago/vale@npm:*"
    level: warning

nodeLinker: node-modules

npmMinimalAgeGate: 0

# One install, every machine that shares this tree. `cpu` and `os` were here from the start; `libc` was
# not, and its absence is why a macOS install produced a tree that cannot build on Linux.
#
# Yarn defaults an unset key to `current`. On darwin there is no glibc, so `current` libc matches
# nothing, and every package whose condition reads `libc=glibc` is filtered out of the install —
# @rspack/binding-linux-*-gnu, @oxlint/binding-linux-*-gnu, @rolldown/binding-linux-*-gnu. They resolve
# in yarn.lock (resolution is platform-independent) and then never materialise, so the failure looks
# like a corrupt install rather than a filter doing its job.
#
# `@esbuild/linux-arm64` is the control: it declares os and cpu but NO libc, so it was never filtered
# and it is sitting in node_modules on a Mac right now, next to the darwin builds.
#
# The cost is install size. The benefit is that a Linux container, a CI runner and a Linux workstation
# can all use a tree installed on a Mac, and vice versa.
supportedArchitectures:
  cpu:
    - current
    - x86
    - x64
    - arm64
  libc:
    - current
    - glibc
    - musl
  os:
    - current
    - darwin
    - linux

yarnPath: .yarn/releases/yarn-4.18.0.cjs
