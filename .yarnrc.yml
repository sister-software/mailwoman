approvedGitRepositories:
  - "**"

compressionLevel: mixed

enableGlobalCache: false

# The lab's outbound path to the npm/Akamai CDN edges flaps intermittently (2026-07-28: four CI
# rounds lost to connect timeouts). Default retry posture (3 tries, 30s) loses the coin-flip;
# 8 tries over 60s sockets rides it out. Applies to CI and local installs alike.
httpRetry: 8
httpTimeout: 60000

enableScripts: true

nodeLinker: node-modules

npmMinimalAgeGate: 0

packageExtensions:
  tr46@*:
    dependencies:
      punycode: ^2.3.1

supportedArchitectures:
  cpu:
    - current
    - x86
    - x64
    - arm64
  os:
    - current
    - darwin
    - linux

yarnPath: .yarn/releases/yarn-4.17.0.cjs
