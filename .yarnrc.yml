approvedGitRepositories:
  - "**"

compressionLevel: mixed

# Shared user-level cache (operator-approved 2026-07-29): runner installs become near-offline after
# first fetch — the durable half of the 2026-07-28 CDN-flap hardening (httpRetry below is the other).
enableGlobalCache: true

# The lab's outbound path to the npm/Akamai CDN edges flaps intermittently (2026-07-28: four CI
# rounds lost to connect timeouts). Default retry posture (3 tries, 30s) loses the coin-flip;
# 8 tries over 60s sockets rides it out. Applies to CI and local installs alike.
httpRetry: 8
httpTimeout: 60000

enableScripts: true

# Lockfile hardening is pinned OFF here and turned ON in exactly ONE CI job (test.yml's `static`
# leg, via YARN_ENABLE_HARDENED_MODE) — the split Yarn's own docs recommend. Hardened mode re-queries
# the registry to re-verify every lockfile entry, so leaving it to default would put a full registry
# round-trip in front of every install on every job. On the lab's self-hosted runners that traffic
# crosses a degraded uplink and defeats enableGlobalCache above; the resolutions still get verified,
# once, on a hosted runner with a healthy path. Measured 2026-08-06: the default already resolves to
# `false` here (private repo), so this pins current behaviour rather than changing it — but it stops
# the flip to a public repo from silently re-enabling it on all thirty-odd install sites.
enableHardenedMode: false


nodeLinker: node-modules

npmMinimalAgeGate: 0

supportedArchitectures:
  cpu:
    - current
    - x86
    - x64
    - arm64
  os:
    - current
    - darwin
    - linux

yarnPath: .yarn/releases/yarn-4.17.0.cjs
