# The toolchain every crate in the workspace builds with: the WebAssembly binary, the `mtf-node` addon, the trainer,
# and the Modal training image (`packages/mailwoman/tools/training/launch/image.ts` reads the channel from this file).
[toolchain]
channel = "1.99.1"
targets = ["wasm32-unknown-unknown"]
profile = "minimal"
components = ["rustfmt", "clippy"]
