# The scoped local Pelias rig — compose project.
#
# Derived from pelias/docker's per-country template (projects/germany), pinned commit
# 3dfa07d580416edd7a27c2d4ff5976c8c1cc6ebc, with five deliberate departures. Each is here because
# the preregistration (docs/superpowers/plans/2026-08-06-local-pelias-benchmark-rig.md) or this
# host forced it:
#
#   1. IMAGES ARE PINNED BY DIGEST, never by ":master". The upstream template floats every
#      importer on :master, which makes a rebuild un-reproducible by construction. The digests
#      below are the ones recorded in ./image-digests.txt; regenerate with ../pull-images.sh
#      (which lives with the data, at $MAILWOMAN_DATA_ROOT/pelias-rig/).
#   2. NO `pip` SERVICE and no geonames/csv importer. Forward geocoding only (§1).
#   3. ES heap is pinned to 4 GB (§1 memory discipline, 29 GB host). MEASURED: the image's own
#      default is `ES_JAVA_OPTS=-Xms512m -Xmx512m`, so the override raises it — §2c's "fail fast
#      if the default exceeds 8 GB" precondition is satisfied, not tripped. The long-running Node
#      services are capped at 1 GB; the importer one-shots are NOT capped, because interpolation's
#      TIGER conflation runs node with --max-old-space-size=8192 internally and capping it would
#      surface as a data bug rather than an OOM.
#   4. THIS HOST HAS NO DOCKER. It runs podman 4.9.3 rootless + podman-compose. Hence
#      `userns_mode: keep-id` on every service that writes to the bind mount: without it the
#      container user lands on a subuid and cannot write the mounted host directory — measured,
#      the first polyline cut failed with "/out/nz.0sv: Permission denied" until keep-id was added.
#      The upstream `user: "${DOCKER_USER}"` key is dropped for the same reason.
#   5. THREE READ-ONLY SOURCE MOUNTS point outside the rig's own data directory, at the
#      $MAILWOMAN_DATA_ROOT copies we already hold: the extracted OpenAddresses tree and the TIGER
#      2024 county zips. Copying either into the rig would duplicate tens of gigabytes to no end.
#      `/data/tiger/downloads` is exactly where pelias/interpolation's conflate_tiger.sh globs.
#
# Data lives OUTSIDE the repo at $DATA_DIR (see .env). Only this project directory and the panel
# are version-controlled.
networks:
  default:
    driver: bridge

services:
  elasticsearch:
    image: docker.io/pelias/elasticsearch@sha256:42acb7033e92ae492a889d2d47a9e3dac7443e03c3287cc91465c7847a149a58
    container_name: pelias_elasticsearch
    restart: always
    userns_mode: keep-id
    environment:
      - "ES_JAVA_OPTS=-Xms4g -Xmx4g"
    ports: ["127.0.0.1:9200:9200", "127.0.0.1:9300:9300"]
    volumes:
      - "./elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml:ro"
      - "${DATA_DIR}/elasticsearch:/usr/share/elasticsearch/data"
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    cap_add: ["IPC_LOCK"]
    security_opt:
      - seccomp=unconfined

  schema:
    image: docker.io/pelias/schema@sha256:58af6640dc97b84b0b8cd5a2ac7628171265f55bd5ace25b2faf705c2f655734
    container_name: pelias_schema
    userns_mode: keep-id
    volumes:
      - "./pelias.json:/code/pelias.json"

  libpostal:
    image: docker.io/pelias/libpostal-service@sha256:0ea25a07c63ab11723aa0060a5deffc4ec2f5b975c568e803547af74d40bc34b
    container_name: pelias_libpostal
    restart: always
    mem_limit: 2g
    ports: ["127.0.0.1:4400:4400"]

  placeholder:
    image: docker.io/pelias/placeholder@sha256:a7c0cde8c11e39b621b383a270c4f6de737b1ec1cb57b25cc8b9c8dfa67deffc
    container_name: pelias_placeholder
    restart: always
    userns_mode: keep-id
    mem_limit: 1g
    environment: ["PORT=4100"]
    ports: ["127.0.0.1:4100:4100"]
    volumes:
      - "./pelias.json:/code/pelias.json"
      - "${DATA_DIR}:/data"

  interpolation:
    image: docker.io/pelias/interpolation@sha256:12ed7d63e84d0ab32e49e7850ad1f5ebe9a16a089471b078b3c90596389f4795
    container_name: pelias_interpolation
    restart: always
    userns_mode: keep-id
    environment: ["PORT=4300"]
    ports: ["127.0.0.1:4300:4300"]
    volumes:
      - "./pelias.json:/code/pelias.json"
      - "${DATA_DIR}:/data"
      - "${OA_EXTRACTED}:/data/openaddresses:ro"
      - "${TIGER_2024}:/data/tiger/downloads:ro"

  api:
    image: docker.io/pelias/api@sha256:cec9569759a8d9a6bf09a66f7765427d091cd8020acb85b076e4d4102b3a9f75
    container_name: pelias_api
    restart: always
    userns_mode: keep-id
    mem_limit: 1g
    environment: ["PORT=4000"]
    ports: ["127.0.0.1:4000:4000"]
    volumes:
      - "./pelias.json:/code/pelias.json"

  # --- one-shot importers: `podman-compose run --rm <name>`, strictly sequential, never
  # concurrent with each other and never while api/interpolation are up (§1).
  whosonfirst:
    image: docker.io/pelias/whosonfirst@sha256:38531577171e4cf4c53ca4ced1af76c31ebdbbb7fecbfaa5f93082fb692f6da3
    container_name: pelias_whosonfirst
    userns_mode: keep-id
    volumes:
      - "./pelias.json:/code/pelias.json"
      - "${DATA_DIR}:/data"

  openaddresses:
    image: docker.io/pelias/openaddresses@sha256:0507d87761983320849e666372aab2ad6f9fa746c18e3964a555bdaf8619719f
    container_name: pelias_openaddresses
    userns_mode: keep-id
    volumes:
      - "./pelias.json:/code/pelias.json"
      - "${DATA_DIR}:/data"
      - "${OA_EXTRACTED}:/data/openaddresses:ro"

  openstreetmap:
    image: docker.io/pelias/openstreetmap@sha256:2fa7ad8662bfff26c6673afcb64e62d25d69e6dd8f835c5583970065bac04843
    container_name: pelias_openstreetmap
    userns_mode: keep-id
    volumes:
      - "./pelias.json:/code/pelias.json"
      - "${DATA_DIR}:/data"

  polylines:
    image: docker.io/pelias/polylines@sha256:30131d32847b62ceb416c948d75d4da29983e0dd687b7faf06af7512ae5b4cc5
    container_name: pelias_polylines
    userns_mode: keep-id
    volumes:
      - "./pelias.json:/code/pelias.json"
      - "${DATA_DIR}:/data"
