StylesPath = .
MinAlertLevel = warning
Vocab = ../../vocabularies

# Vale's MDX parser needs an external `mdx2vast` binary.
# That binary is not in this toolchain.
# So we map .mdx to the built-in markdown parser.
# Frontmatter, code fences, and prose still lint the same.
# Only JSX/import lines need TokenIgnores below.
[formats]
mdx = md

[*.{md,mdx}]
# Every rule in `styles/` and `words/` runs on every page.
BasedOnStyles = styles, words
styles.MedicalMetaphor = YES
styles.IngOpeners = YES
styles.CommentSemicolons = YES
styles.CommentClausePile = YES
styles.CommaAndClausePile = YES
styles.Negation = YES
styles.Nothing = YES
styles.Grammar.SentenceFragments = YES
styles.Grammar.EllipticalCoordination = YES
styles.Grammar.SloganAssertions = YES
styles.Grammar.RelativeClauseChains = YES
# MDX: skip imports and JSX blocks, which are code rather than prose.
# `source-of-truth:` is a frontmatter key, and the bearing pattern keeps the compass sense of the word.
TokenIgnores = (import .+ from .+), (<[A-Z][^>]*>), (^source-of-truth:.*), (?i)(?:qibla|southeast|north|true north|compass|map(?:'s)?|initial) bearing
# Do not ignore fenced code blocks here.
# Vale already skips fenced code in Markdown by default.
# Adding a fence regex can stop linting after the first fence.
# So we only ignore <details> blocks, and text between a `verbatim-quote` and a `/verbatim-quote`
# comment, which marks another party's text reproduced as published. MDX writes the comments as
# `{/* verbatim-quote */}`, and Markdown as `<!-- verbatim-quote -->`.
BlockIgnores = (?s)(<details>.*?</details>), (?s)((?:\{/\* verbatim-quote \*/\}|<!-- verbatim-quote -->).*?(?:\{/\* /verbatim-quote \*/\}|<!-- /verbatim-quote -->))

## Rule fixtures contain the words their rules test.
[**/config/vale/fixtures/**]
BasedOnStyles =
styles.IngOpeners = YES

## License instruments are legal text, so their wording is not ours to change.
## `CODE_OF_CONDUCT.md` is the Contributor Covenant verbatim, and a dated commercial agreement
## is never edited after publication.
[**/LICENSE.md,**/COMMERCIAL-LICENSE.md,**/THIRD_PARTY_NOTICES.md,**/CODE_OF_CONDUCT.md,**/packages/corpus/data/licenses/**,**/docs/src/pages/license/terms/commercial-*.mdx]
BasedOnStyles =

## These files quote other parties throughout: the batch notes quote the operator's probe
## descriptions, and the layer surveys and the UK source audit quote their sources' documentation.
## Contractions would change those quotations, so the rule is off here.
[{docs/superpowers/specs/2026-08-27-flood-layer-survey.md,docs/superpowers/specs/2026-08-27-zoning-layer-survey.md,docs/superpowers/specs/2026-08-27-erosion-layer-survey.md,docs/records/research/2026-10-05-uk-infrastructure-source-audit.md,packages/mailwoman/tools/eval-harness/gauntlet/cases/batch-notes.md}]
styles.Contractions = NO
