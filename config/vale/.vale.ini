StylesPath = .
MinAlertLevel = warning
Vocab = ../../vocabularies

# Vale's MDX parser needs an external `mdx2vast` binary.
# That binary is not in this toolchain.
# So we map .mdx to the built-in markdown parser.
# Frontmatter, code fences, and prose still lint the same.
# Only JSX/import lines need TokenIgnores below.
[formats]
mdx = md

[*.{md,mdx}]
BasedOnStyles = styles
styles.MedicalMetaphor = YES
styles.CommentSemicolons = NO
styles.AgreementOpeners = NO
styles.AssertiveFiller = NO
styles.ChatStockForms = NO
styles.DistanceAsSuccess = NO
styles.DecorativeStatusGlyphs = NO
styles.EconomyMetaphor = NO
styles.EmptyTransitions = NO
styles.JudgmentJargon = NO
styles.MintedMetaphor = NO
styles.OpaqueID = NO
styles.OverlaySense = NO
styles.PresentationPreamble = NO
styles.ProjectShorthand = NO
styles.UnsupportedAttribution = NO
styles.VaguePraise = NO
styles.WindDown = NO
# MDX: skip imports/JSX blocks. The third TokenIgnores pattern is a defensive
# backstop for `source-of-truth:` frontmatter keys — Vale already strips
# frontmatter before linting, so this only matters if that parsing ever fails.
TokenIgnores = (import .+ from .+), (<[A-Z][^>]*>), (^source-of-truth:.*), (?i)(?:qibla|southeast|north|true north|compass|map(?:'s)?|initial) bearing
# Do not ignore fenced code blocks here.
# Vale already skips fenced code in Markdown by default.
# Adding a fence regex can stop linting after the first fence.
# So we only ignore <details> blocks.
BlockIgnores = (?s)(<details>.*?</details>)
