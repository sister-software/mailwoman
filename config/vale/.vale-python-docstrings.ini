# Focus the Python documentation pass on comma-and clause piles.
#
# lint-prose.ts projects AST docstrings to comment-only Python files. Source comments and every
# other prose surface continue through their existing Vale configs.

StylesPath = .
MinAlertLevel = warning
Vocab = ../../vocabularies

[formats]
py = md

[*.py]
BasedOnStyles =
styles.CommaAndClausePile = YES
