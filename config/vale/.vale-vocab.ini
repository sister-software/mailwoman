# Vale config for the full Mailwoman prose style. The command runs it over every
# tracked Markdown/MDX file under docs/, the root markdown interfaces (AGENTS.md,
# README.md, RELEASING.md, CONTRIBUTING.md, REPRODUCIBILITY.md), the development
# output style, and every package README.
#
# Every rule under styles/ is on here, the reply-register rules included.
# Weasel stays level: warning and does not fail the run — the hedge
# quantities it names need a measured number, which is per-site work rather
# than a rewrite.
#
# The lint command passes published pages, dated records, plans, research,
# specs, static reports, and docs-side skills through this full style. They are
# no longer exempt: a phrase left in a historical file remains searchable
# guidance for future work. `changelog.md` remains outside this command because
# release notes preserve shipped wording. Vale-fixture files remain outside the
# broad sweep because the fixture runner tests their expected failures.
#
# StylesPath and Vocab match .vale.ini so every Vale config here resolves the
# same style directory and accept-list.

StylesPath = .
MinAlertLevel = warning
Vocab = ../../vocabularies

[formats]
mdx = md

[*.{md,mdx}]
BasedOnStyles = styles
styles.MedicalMetaphor = YES
styles.IngOpeners = YES
styles.CommentSemicolons = NO
styles.CommentClausePile = NO
styles.CommaAndClausePile = YES
styles.Negation = YES
styles.Nothing = YES
# The rules written for agent replies run here too: a docs page or README with
# an agreement opener, a minted metaphor, a wind-down line or project shorthand
# reads as machine-written, and the operator wants that register out of the
# published prose as much as out of a reply.
styles.Grammar.SentenceFragments = YES
styles.Grammar.EllipticalCoordination = YES
styles.Grammar.SloganAssertions = YES
styles.Grammar.RelativeClauseChains = YES
# The quoted sentence is a verbatim line in `docs/records/retrospectives/2026-08-06-distance-to-done.md`.
TokenIgnores = (import .+ from .+), (<[A-Z][^>]*>), (^source-of-truth:.*), (when the project actually pays for one), (?i)(?:qibla|southeast|north|true north|compass|map(?:'s)?|initial) bearing
BlockIgnores = (?s)(<details>.*?</details>)

## Non-published fixtures and external/legal text are opt-out surfaces.
[**/config/vale/fixtures/**]
BasedOnStyles =
[**/CHANGELOG.md,**/LICENSE.md,**/COMMERCIAL-LICENSE.md,**/CODE_OF_CONDUCT.md,**/SECURITY.md,**/THIRD_PARTY_NOTICES.md]
BasedOnStyles =

## Golden answers, eval receipts, and preregistrations preserve their recorded wording.
[data/eval/**]
styles.CommaAndClausePile = NO
[docs/records/evals/**]
styles.CommaAndClausePile = NO
[docs/superpowers/plans/2026-08-02-r9-de-preregistration.md]
styles.CommaAndClausePile = NO
## Vendored upstream data carries upstream's own prose. `packages/dictionaries/data/` holds the libpostal,
## Who's On First and chromium-i18n corpora, and their READMEs are those projects' text, not this
## one's — rewriting them to house style would misattribute an edit to the upstream author.
[**/dictionaries/data/**]
styles.IngOpeners = NO
styles.AmbiguousShorthand = NO
styles.Anthropomorphism = NO
styles.BannedWords = NO
styles.EmphasisCapitals = NO
styles.ShellNoun = NO
styles.Spelling = NO
# StockPhrases stays on here. It was switched off while one vendored file carried a phrase from it;
# that file is this project's to maintain like any other, so the phrase was rewritten instead.
styles.Terms = NO
styles.Weasel = NO

## License texts preserve their publishers' wording.
[**/packages/corpus/data/licenses/**]
styles.IngOpeners = NO
