# Vale config for the full Mailwoman prose style. The command runs it over every
# tracked Markdown/MDX file under docs/, the root markdown contracts (AGENTS.md,
# README.md, RELEASING.md, CONTRIBUTING.md, REPRODUCIBILITY.md), the development
# output style, and every package README.
#
# This config once turned every rule OFF except the AmbiguousShorthand rule,
# because switching the whole style on over these surfaces failed on 175 alerts
# from Spelling, BannedWords, Weasel and StockPhrases, and that was deferred as
# "a separate sweep". THE SWEEP HAPPENED (#2077): the count had grown to 267 by
# the time it ran, and every error-severity rule now passes, so the full style
# is on. Weasel stays level: warning and does not fail the run — the hedge
# quantities it names need a measured number, which is per-site work rather
# than a rewrite.
#
# The lint command passes published pages, dated records, plans, research,
# specs, static reports, and docs-side skills through this full style. They are
# no longer exempt: a phrase left in a historical file remains searchable
# guidance for future work. `CHANGELOG.md` remains outside this command because
# release notes preserve shipped wording. Vale-fixture files remain outside the
# broad sweep because the fixture runner tests their expected failures.
#
# StylesPath and Vocab match .vale.ini so all three configs resolve the same
# style directory and accept-list.

StylesPath = .
MinAlertLevel = warning
Vocab = ../../vocabularies

[formats]
mdx = md

[*.{md,mdx}]
BasedOnStyles = styles
styles.MedicalMetaphor = YES
styles.CommentSemicolons = NO
styles.Negation = YES
styles.AgreementOpeners = NO
styles.AssertiveFiller = NO
styles.ChatStockForms = NO
styles.DistanceAsSuccess = NO
styles.DecorativeStatusGlyphs = NO
styles.EconomyMetaphor = NO
styles.EmptyTransitions = NO
styles.JudgmentJargon = NO
styles.MintedMetaphor = NO
styles.OpaqueID = NO
styles.OverlaySense = NO
styles.PresentationPreamble = NO
styles.ProjectShorthand = NO
styles.UnsupportedAttribution = NO
styles.VaguePraise = NO
styles.WindDown = NO
TokenIgnores = (import .+ from .+), (<[A-Z][^>]*>), (^source-of-truth:.*), (?i)(?:qibla|southeast|north|true north|compass|map(?:'s)?|initial) bearing
BlockIgnores = (?s)(<details>.*?</details>)

## Non-published fixtures and external/legal text are opt-out surfaces.
[**/config/vale/fixtures/**]
BasedOnStyles =
[**/CHANGELOG.md,**/LICENSE.md,**/COMMERCIAL-LICENSE.md,**/CODE_OF_CONDUCT.md,**/SECURITY.md,**/THIRD_PARTY_NOTICES.md]
BasedOnStyles =

## Vendored upstream data carries upstream's own prose. `packages/core/data/` holds the libpostal,
## Who's On First and chromium-i18n corpora, and their READMEs are those projects' text, not this
## one's — rewriting them to house style would misattribute an edit to the upstream author.
[**/core/data/**]
styles.AmbiguousShorthand = NO
styles.Anthropomorphism = NO
styles.BannedWords = NO
styles.EmphasisCapitals = NO
styles.ShellNoun = NO
styles.Spelling = NO
# StockPhrases stays ON here. It was switched off while one vendored file carried a phrase from it;
# that file is this project's to maintain like any other, so the phrase was rewritten instead.
styles.Terms = NO
styles.Weasel = NO
