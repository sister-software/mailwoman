# Vale config for assistant replies.
# The Stop hook (lib/dev-mcp/hooks/vale/response/check.ts, with its Codex
# twin in lib/dev-mcp/hooks/vale/response/check/codex.ts) checks the final
# reply with this config. Docs pages use .vale.ini.
#
# Every rule under styles/ loads here, including the chat-only rules that
# .vale-vocab.ini switches off for published prose. It sits next to
# .vale.ini so both use the same StylesPath and Vocab.
#
# Replies are plain Markdown.
# The token pattern below ignores direction uses of `bearing`.
# Fenced and inline code are already ignored by the Markdown parser
# (see .vale.ini BlockIgnores comments for details).

StylesPath = .
MinAlertLevel = warning
Vocab = ../../vocabularies

[*.md]
BasedOnStyles = styles
styles.IngOpeners = YES
styles.MedicalMetaphor = YES
styles.Grammar.SentenceFragments = YES
styles.Grammar.EllipticalCoordination = YES
styles.Grammar.SloganAssertions = YES
styles.Grammar.RelativeClauseChains = YES
styles.CommentSemicolons = NO
styles.CommentClausePile = NO
styles.CommaAndClausePile = NO
styles.Negation = YES
styles.Nothing = YES
TokenIgnores = (?i)(?:qibla|southeast|north|true north|compass|map(?:'s)?|initial) bearing
