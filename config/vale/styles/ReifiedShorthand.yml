## Reject prose that packages an observation or hypothesis into an abstract
## object and then reports the object's "state" instead of stating what happened.
##
## Two related failures appear repeatedly in model-written engineering prose:
##
## 1. IMPLICIT PROPOSITION ACCOMMODATION / ENCAPSULATION
##
##    A proposition is compressed into a definite noun such as "the guard",
##    "the win", "the contract", or "the cost". The noun may summarize earlier
##    text, or it may be introduced as though the reader already knows what
##    proposition it denotes.
##
## 2. EPISTEMIC INFLATION
##
##    The compressed noun is then given a truth, persistence, or structural
##    predicate such as HOLDS, STANDS, SURVIVES, or CARRIES. This makes a local
##    observation sound like a general property or established result without
##    adding evidence.
##
## Replace the compressed object with the proposition itself. State behavior,
## scope, metric, and value where applicable:
##
##   REJECTED: "the probe confirmed the guard"
##      -> "the probe showed that excluding 4-5 digit tokens keeps parity
##          postcode at 0.986"
##
##   REJECTED: "guard HOLDS + date-name UP"
##      -> "parity postcode stays at 0.986 and FR date-name rises above 0.367"
##
##   REJECTED: "MessageBus DELIVERS confirming the contract holds"
##      -> "MessageBus delivered the message, and the test suite now passes"
##
##   REJECTED: "recover the win" / "keep the unit win"
##      -> "recover the 2-digit half of the FR date-name rise" /
##         "keep `unit` at or above 88%"
##
##   REJECTED: "the cost was carried entirely by the 4-5 digit pieces"
##      -> "the 4-5 digit pieces account for the whole postcode drop (-9.7pp)"
##
##   REJECTED: "3-digit is the reduce"
##      -> "the 100-999 range is the one to keep"
##
##   REJECTED: "take THIS to 8k"
##      -> "train this config to 8,000 steps"
##
## Do not reject ordinary precise technical uses merely because they contain
## these verbs. "The invariant holds for every returned candidate" is useful
## when the invariant is locally named or written out. A source-code guard is
## also an ordinary noun when it names an actual check. The defect is that the
## reader must expand an abstract noun into an unstated proposition to learn
## what was observed.
##
## `win` as a verb ("the higher score wins") is also ordinary English. The
## definite `win` patterns below may still catch subjects such as "the
## hand-authored entries win"; rewrite those rare cases as "take precedence".
extends: existence
message: "'%s' hides the observed proposition behind an abstract noun or stronger state claim — state the behavior/result directly, with scope and metric/value where applicable."
level: error
ignorecase: true
tokens:
  # Confirmation or proof applied to an accommodated/encapsulated object.
  - '\b(?:confirm(?:s|ed|ing)?|validat(?:e|es|ed|ing)|prov(?:e|es|ed|ing)|establish(?:es|ed|ing)?) (?:the |this |that |a |its |their )?(?:[\w-]+ ){0,2}(?:guard|gate|contract|win|gain|lift|result|finding|signal|case)\b'
  # Truth/stability predicates over an abstract result noun.
  - '\b(?:the |this |that |its |their )?(?:[\w-]+ ){0,2}(?:guard|gate|contract|win|gain|lift|result|finding|signal|case|story) (?:holds?|held|stands?|stood|survives?|survived|sticks?|stuck|carries|carried|lands?|landed|remains? intact|remained intact)\b'
  # Definite result nouns that usually hide the actual metric/result.
  - '\b(?:the|its|their|half the|half of the) (?:[\w-]+ ){0,2}(?:win|gain|lift)\b'
  - '\b(?:the|a|this|that) reduce\b'
  - '\bwin absent\b'
  # "Cost"/regression language that replaces a measured delta with a metaphor.
  - '\b(?:cost|loss|regression) (?:was|is|were|are) carried\b'
  - '\bcarried entirely by\b'
  - '\bcarr(?:y|ies|ied) the (?:[\w-]+ )?(?:cost|win|loss|regression)\b'
  # Training shorthand that omits the actual operation.
  - '\btake (?:this|it|that|the [\w-]+) to \d+k\b'
  # Protection language hides the concrete behavior or invariant being maintained.
  - '\bprotect(?:s|ed)?\b'
