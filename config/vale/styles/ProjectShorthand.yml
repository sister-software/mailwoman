## Mailwoman chat style: banned project shorthand.
##
## Vale existence rule. Each token is a name an agent minted for something that
## already has a plain name, and the reader has to decode it. `the null` was
## invented for a control fine-tune run — say "the control run (v5.0.1)".
## `three-leg` stands for a comparison protocol — say which systems or runs
## the legs are. The word for a tunable change moved to AmbiguousShorthand.yml
## so both surfaces refuse it.
##
## This file holds the chat-only shorthand: words that appear in replies and
## never in published prose. The five words banned on both surfaces live in
## AmbiguousShorthand.yml, which .vale-chat.ini loads with the rest of the
## style directory. The medical vocabulary that once sat here (`dose`, `the
## cure`) is refused on every surface by MedicalMetaphor.yml.
##
## `slice` is the training-side word, and it reads as one thing to someone who
## works in addresses rather than in mixtures:
##
##   slice -> the named artifact: the parquet by its filename, the corpus
##            source by its `source` string, the recipe by its name, or plainly
##            "the training rows for Czechia".
##
## It belongs in AmbiguousShorthand.yml beside the other five, and the move
## means rewriting every published page and skill that carries the word. Chat
## first; the published-prose migration is its own change.
##
## A backticked artifact name (`synth-suffix-boundary`,
## `packages/corpus/lib/shard-recipes/`) survives, because inline code is
## exempt — mention the artifact by its real name instead of the shorthand.
##
## No CLI command carries the word: the recipe runner is `corpus recipe`, its aligner
## `corpus align-recipe` and the overlay router `corpus split-overlay`.
extends: existence
message: "'%s' is banned project shorthand — name the concrete artifact or change in plain words (the config key, the corpus recipe file, the run version, the systems compared)."
level: error
ignorecase: true
tokens:
  - the null
  - three-leg
  - slice(?:s|d)?
