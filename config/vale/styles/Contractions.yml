## Mailwoman house style: prefer contractions.
##
## Docs pages and source comments write "doesn't" and "isn't" in place of the two-word forms.
## The two-word forms of "don't" and "aren't" have no entry, so they pass. A plural subject that
## needs "aren't" usually reads better rewritten in the singular, where "isn't" fits.
## The rule loads through `BasedOnStyles = styles` in .vale.ini (Markdown and MDX) and .vale-code.ini
## (comments in TypeScript, TSX and Python, and the full text of YAML files, this one included).
## .vale-chat.ini switches it off because assistant replies are outside its scope.
##
## Matching is case-sensitive. Each key accepts a lowercase or capitalized first letter followed by
## lowercase words. Text set entirely in capitals, such as a "DO NOT EDIT THIS FILE MANUALLY" banner,
## passes.
##
## A key that lists two phrases maps both to one contraction, because the contraction stands for
## either: "he'd" can mean an auxiliary "had" or a "would". `can not` is listed as two words only, so
## the single word `cannot` passes.
##
## "has", "have" and "had" contract only as auxiliaries. Each of those keys requires a past participle
## next, optionally after an adverb such as "already". A main-verb use, such as a table that "has two
## rows", passes. The participle list leaves out forms spelled like the base verb, such as "read" and
## "set". The "that" key skips the "i.e." sense, where a comma, colon or semicolon follows its verb.
## The phrase "let us" has no entry, because asking someone to let us know stays as written.
##
## Vale's Markdown parser skips fenced blocks and inline code spans. A quoted identifier or a sample
## string in a fence keeps its spelling. The comment scanner for source files has no such exemption,
## so a phrase inside a backticked span in a `//` comment is reported like any other prose.
extends: substitution
message: "Use the contraction '%s' instead of '%s'."
level: error
ignorecase: false
swap:
  "[Cc]an not": can't
  "[Cc]ould not": couldn't
  "[Dd]id not": didn't
  "[Dd]oes not": doesn't
  "[Hh]ad not": hadn't
  "[Hh]as not": hasn't
  "[Hh]ave not": haven't
  '[Hh]e had(?= (?:(?:not|already|never|just|also|now|always|only|all|both|recently|since|long) )*(?:been|got|gotten|gone|done|made|had|seen|known|shown|begun|written|taken|given|found|kept|left|lost|met|said|sent|spent|built|meant|held|told|won|grown|drawn|broken|chosen|fallen|forgotten|hidden|risen|spoken|stolen|thrown|\w+(?<!e)ed)\b)|[Hh]e would': he'd
