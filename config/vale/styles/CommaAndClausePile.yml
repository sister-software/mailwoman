## Flag comma-and joins that continue into another step or a stated result.
##
## A single independent clause after `, and` can make a clear compound sentence. Keep that form
## when it carries one connected thought. Review the join when the sentence adds a result or another
## independent step. The patterns are candidates; they do not replace sentence-level review.
##
##   REVIEW:
##     "The loader validates each row, and it records the result, so the report can compare runs."
##   PREFERRED:
##     "The loader validates each row. It records the result. The report can compare runs."
##     "The loader validates each row. It then records the result."
##   KEEP:
##     "The loader reads letters, digits, and punctuation."
##     "The loader validates each row, and it records the result."
##     "The distance, the policy, and the defence belong to each feature, so the answer is a polygon."
extends: existence
message: "A comma-and clause continues into another step or result — split the sequence and state the relation directly."
level: warning
ignorecase: false
