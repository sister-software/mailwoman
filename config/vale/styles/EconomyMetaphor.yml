## Mailwoman chat style: avoid money metaphors for non-money costs.
##
## This Vale existence rule catches phrases like "the fine-tune tax", "nearly free", and "costs nothing".
##
## Nothing is free: every decision uses time, rows, dollars, or opportunity.
## Say what the cost is, and name the unit. A real dollar amount ("$29 of the $40 Modal budget") is fine.
##
## `price` as a verb has the same problem. Phrases like "price that ratio" and
## "price the change first" tell readers to weigh something without saying by what measure.
## Name the measure instead: "run the census over all 241" or "measure the label ratio in `suffix-boundary-v2.jsonl`".
##
## Nouns are not banned per se. `cost` with a unit is the fix this rule asks for.
## `Price` with a capital P is also allowed when it names the Stripe AP object.
## Blocking those uses would block correct writing and force a long exemption list.
extends: existence
message: "'%s' is a monetary metaphor — state the actual cost and its unit (rows regressed, minutes, dollars of which budget)."
level: error
ignorecase: true
tokens:
  # `tax` as a metaphor for a cost.
  # A literal tax stays legal: the shop's VAT and sales tax, a tax assessor, the National Tax Agency.
  # So the rule lists the metaphor's forms rather than the bare word.
  - (?:fine-tune|fine tune|tune|hidden|latency|complexity|maintenance|abstraction|cognitive|performance|compatibility|readability) tax
  - (?:that|this) tax\b
  - pay(?:s|ing)? (?:a|the) tax
  - paid (?:a|the) tax
  - tax(?:es|ed|ing) (?:the|every|each|all|it|them|us|you)\b
  - nearly free
  # The trailing class keeps `free-form` legal.
  - for free(?:$|[^-\w])
  - costs? (?:approximately |almost )?nothing
  - free lunch
  - free win
  - cheap win
  # `price` as a verb: weighing something without naming the unit or the measurement.
  # Case-sensitive, so the Stripe `Price` object stays legal.
  - (?-i:[Pp]ric(?:es|ed|ing)|price) (?:the|that|this|a|an|it|them|its|their|each|every|what)\b
  - (?-i:[Pp]ric(?:es|ed|ing)|price) (?:in|out|up)\b
  - worth the (?:cost|price|spend)
  - pays? for (?:itself|themselves)
  - paid for itself
  - at (?:zero|no) cost
  # `buy` as the metaphor for an effect. Buying a license is a purchase and stays legal.
  - (?:buys?|bought) (?:us|you|them|time|headroom|room)\b
