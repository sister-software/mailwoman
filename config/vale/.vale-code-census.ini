# Census version of `.vale-code.ini`. It uses the same rule and the same literal-sense exceptions.
#
# The `vocab-census` check in `packages/repo-health` needs one file that always fails, so a real zero can be told apart
# from a run that found no files. The main config skips the Vale fixtures; this one does not, so
# `dirty.ts` stays as the control. The census then leaves the instrument files out of the code count (`unmeasured`).
#
# Vale config for the AmbiguousShorthand ban over source comments in TypeScript, TSX, and Python.
#
# `AGENTS.md` bans four words in replies and in every committed prose surface. Before this config,
# the code surface contained those words and did not enforce the rule: 2,014 hits across 619 of
# 2,638 tracked files, measured 2026-09-02.
#
# Vale reads comment text for these languages and ignores code. So `promotionEval` is not a hit,
# but the sentence around it is. If a config has no `[*.ts]` section, it silently checks nothing,
# which is why this gap was easy to miss: a run on a `.ts` file reports zero alerts and exits 0
# whether the rule is off or the file is clean.
#
# Only AmbiguousShorthand is on here. Weasel, StockPhrases, and BannedWords stay off because they
# are meant for published pages. A comment about a measured constraint is different. StylesPath and
# Vocab match the other configs so they use the same style directory and word list.

StylesPath = .
MinAlertLevel = error
Vocab = ../../vocabularies

[*.{ts,tsx,py}]
BasedOnStyles = styles
styles.MedicalMetaphor = YES
styles.CommentSemicolons = YES
styles.Negation = YES
styles.AgreementOpeners = NO
styles.AssertiveFiller = NO
styles.ChatStockForms = NO
styles.DistanceAsSuccess = NO
styles.DecorativeStatusGlyphs = NO
styles.EconomyMetaphor = NO
styles.EmptyTransitions = NO
styles.JudgmentJargon = NO
styles.MintedMetaphor = NO
styles.OpaqueID = NO
styles.OverlaySense = NO
styles.PresentationPreamble = NO
styles.ProjectShorthand = NO
styles.UnsupportedAttribution = NO
styles.VaguePraise = NO
styles.WindDown = NO
# The markdown variant's backtick exemption does not reach a code comment; the Code
# variant protects interface-tied names by name instead. See its docstring.
styles.AmbiguousShorthand = NO
styles.Anthropomorphism = NO
styles.StockPhrases = NO
styles.BannedWords = NO
styles.Spelling = NO
styles.Terms = NO
styles.Weasel = NO

## Files where the word is DATA, not shorthand, and the rule cannot tell the difference.
##
## This repository ingests OpenStreetMap: `aeroway=check` is a tag, `Check A12` is a `ref` value,
## `Terminal 5` and `Concourse B` are the sub-venue shapes the parser exists to read, and the GB
## The street suffix in Briggate, Kirkgate and Eastgate is a confound class a rule protects against.
## A geocoder that reads OSM keeps meeting the literal noun, and no exceptions list reaches a bare
## one. Every file below was read; each carries the physical sense throughout.
##
## ADDING A PATH HERE IS A CLAIM that the word is data in it. A file where the word is prose belongs
## in the sweep, not in this list.
[{packages/corpus/lib/recipes/sub/venue*.ts,packages/corpus/lib/tools/sub/venue*.ts,packages/corpus/lib/tools/sub/venue/*.ts,packages/corpus/lib/tools/overture-subvenue.ts,packages/corpus/lib/tools/fetch/*.ts,packages/corpus/test/unit/recipes/sub-venue*.ts,packages/corpus/test/unit/tools/sub-venue*.ts,packages/osm/lib/sdk/extract/subvenue/*.ts,packages/neural/lib/venue-structure.ts,packages/neural/lib/span/proposal-prior.ts,packages/core/lib/pipeline/span-proposer.ts,packages/core/test/unit/pipeline/span-proposer.test.ts,packages/core/lib/decoder/containment.ts,packages/mailwoman/lib/geocode/result.ts,packages/mailwoman/lib/eval-harness/conformance/punctuation.ts,packages/mailwoman/test/integration/venue-structure-confounds.test.ts}]
styles.AmbiguousShorthandCode = NO

[{config/vale/fixtures/*.ts,config/vale/styles/*.yml}]
styles.MedicalMetaphor = NO
styles.CommentSemicolons = NO
styles.Negation = NO
