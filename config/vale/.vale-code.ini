# Vale config for comments in TypeScript, TSX, Python, and YAML files.
#
# Purpose: enforce shorthand bans in prose, not in code names.
#
# In ts/tsx/py files, Vale checks comments only.
# In YAML files, Vale checks the full file.
#
# Most prose rules are off on purpose.
# This config keeps shorthand bans and all-caps emphasis checks.
# StylesPath and Vocab are the same as other Vale configs.

StylesPath = .
MinAlertLevel = error
Vocab = ../../vocabularies

[*.{ts,tsx,py,yaml,yml}]
BasedOnStyles = styles
styles.MedicalMetaphor = YES
styles.CommentSemicolons = YES
# The dash rule is written and off. Turning it on now fails the run on roughly 7,400
# existing comment sentences, which is the sweep the semicolon ban deferred into them.
# Flip to YES with the commit that rewrites them.
styles.CommentDashJoint = NO
styles.Negation = YES
styles.AgreementOpeners = NO
styles.AssertiveFiller = NO
styles.ChatStockForms = NO
styles.DistanceAsSuccess = NO
styles.DecorativeStatusGlyphs = NO
styles.EconomyMetaphor = NO
styles.EmptyTransitions = NO
styles.JudgmentJargon = NO
styles.MintedMetaphor = NO
styles.OpaqueID = NO
styles.OverlaySense = NO
styles.PresentationPreamble = NO
styles.ProjectShorthand = NO
styles.UnsupportedAttribution = NO
styles.VaguePraise = NO
styles.WindDown = NO
styles.Grammar.SentenceFragments = YES
styles.Grammar.EllipticalCoordination = YES
styles.Grammar.SloganAssertions = YES
styles.Grammar.RelativeClauseChains = YES
# Use the code-aware shorthand rule for comments.
# It protects interface-tied names directly.
styles.AmbiguousShorthand = NO
styles.Anthropomorphism = NO
styles.StockPhrases = NO
styles.BannedWords = NO
styles.Spelling = NO
styles.Terms = NO
styles.Weasel = NO

## Exceptions: files where the matched word is data, not shorthand.
##
## These files contain OpenStreetMap values (tags, refs, venue labels, street names).
## In this context, the word is literal data.
##
## Add a path only when the word is data throughout the file.
[{packages/corpus/lib/recipes/sub/venue*.ts,packages/corpus/lib/tools/sub/venue*.ts,packages/corpus/lib/tools/sub/venue/*.ts,packages/corpus/lib/tools/overture-subvenue.ts,packages/corpus/lib/tools/fetch/*.ts,packages/corpus/test/unit/recipes/sub-venue*.ts,packages/corpus/test/unit/tools/sub-venue*.ts,packages/osm/lib/sdk/extract/subvenue/*.ts,packages/neural/lib/venue-structure.ts,packages/neural/lib/span/proposal-prior.ts,packages/core/lib/pipeline/span-proposer.ts,packages/core/test/unit/pipeline/span-proposer.test.ts,packages/core/lib/decoder/containment.ts,packages/mailwoman/lib/geocode/result.ts,packages/mailwoman/lib/eval-harness/conformance/punctuation.ts,packages/mailwoman/test/integration/venue-structure-confounds.test.ts}]
styles.AmbiguousShorthandCode = NO

## Historical training identifiers are data, not prose. Their run names and source paths
## must remain byte-for-byte stable so receipts and reruns continue to resolve them.
[{corpus-python/src/mailwoman_train/audits/mixed_script.py,corpus-python/src/mailwoman_train/configs/v5.0.2-suffix-cure-1k.yaml}]
styles.MedicalMetaphor = NO

## Rule fixtures and census files must include the words they test.
##
## These paths are repo-relative.
## They match in `yarn lint:prose:code` from repo root.
[{config/vale/fixtures/*.ts,packages/repo-health/lib/checks/vocab-census.ts,packages/repo-health/test/unit/vocab-census.test.ts,packages/repo-health/lib/checks/debt.ts,config/vale/check-rules.ts}]
styles.AmbiguousShorthandCode = NO
styles.EmphasisCapitals = NO
styles.ShellNoun = NO

## These files deliberately contain the words and punctuation their rules test.
[{config/vale/fixtures/*.ts,config/vale/styles/*.yml}]
styles.MedicalMetaphor = NO
styles.CommentSemicolons = NO
styles.Negation = NO

## A workflow's `run:` block is shell, and Vale reads it as prose because YAML gives it no way to tell
## a script from a comment. CommentSemicolons then flags `if …; then` and `for … ; do`, and answering
## those findings rewrites the script: six statements became sentences that way and every CI run
## failed at `syntax error near unexpected token 'fi'`. The rule's own header scopes it to TypeScript,
## TSX and Python, so this restores that scope. The comments in these files are still read by every
## other rule in the section above.
[.github/workflows/*.yml]
styles.CommentSemicolons = NO
