# Vale config for comments in TypeScript, TSX, Python, and YAML files.
#
# The prose rules check comments in ts/tsx/py files.
# Selected vocabulary rules get a separate comments-and-docstrings pass.
# In YAML files, Vale checks the full file.
#
# Every rule in `styles/` and `words/` runs on every comment.
# StylesPath and Vocab are the same as other Vale configs.

StylesPath = .
MinAlertLevel = warning
Vocab = ../../vocabularies

[formats]
ts = md
tsx = md
py = md

[*.{ts,tsx,py,yaml,yml}]
BasedOnStyles = styles, words
styles.MedicalMetaphor = YES
styles.CommentSemicolons = YES
# `config/oxlint/comment-reflow/joint-sweep.ts` carries the same token as the dash rule and
# answers what it reports; run `yarn comments:joints <file>` then `yarn fix:oxc`.
styles.CommentDashJoint = YES
styles.CommentClausePile = YES
styles.CommaAndClausePile = YES
styles.IngOpeners = YES
styles.Negation = YES
styles.Nothing = YES
styles.Grammar.SentenceFragments = YES
styles.Grammar.EllipticalCoordination = YES
styles.Grammar.SloganAssertions = YES
styles.Grammar.RelativeClauseChains = YES
# AmbiguousShorthandCode is the comment form of AmbiguousShorthand: it carries the same list and
# exempts the identifiers an interface names, so running both reports each comment finding twice.
styles.AmbiguousShorthand = NO

## Rule fixtures, the fixture runner and the style files contain the words their rules test.
[{config/vale/fixtures/*.ts,config/vale/styles/*.yml,config/vale/check-rules.ts}]
BasedOnStyles =

## A workflow's `run:` block is shell, and Vale reads it as prose because YAML gives it no way to tell
## a script from a comment. Answering a semicolon finding there rewrites `if …; then` into a sentence
## and breaks the script, so CommentSemicolons stays scoped to TypeScript, TSX and Python.
[.github/workflows/*.yml]
styles.CommentSemicolons = NO
