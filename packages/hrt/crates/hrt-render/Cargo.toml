[package]
name = "hrt-render"
description = "The Hilbert Rust Tiler's renderer: Planetiler's simplification, stripe clipping into tiles, polygon snapping and MVT command encoding."
version.workspace = true
edition.workspace = true
# The renderer ports Planetiler's FeatureRenderer, TiledGeometry and VectorTile (Apache-2.0); TiledGeometry is itself
# adapted from geojson-vt (ISC).
license = "(AGPL-3.0-only OR LicenseRef-Commercial) AND Apache-2.0 AND ISC"
repository.workspace = true

[dependencies]
robust = "1"
# GEOS ports JTS, so its validity test and precision reducer follow the JTS code Planetiler calls. The static build
# compiles GEOS from source and needs cmake and a C++ compiler, with no system GEOS.
geos = { version = "11.3.1", features = ["static", "v3_12_0"] }

[dev-dependencies]
geo = "0.29"
hrt-osm = { path = "../hrt-osm" }
