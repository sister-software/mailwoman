[package]
name = "hrt-facade"
description = "Building facade style decisions vendored from Arnis: category, era, region, wall and roof materials, window rhythm and ground floor, resolved deterministically per building for Earth's compact building tiles."
version.workspace = true
edition.workspace = true
# The decision code is a port of Arnis (github.com/louis-e/arnis, commit d8e8b662, Apache-2.0). The tables under
# packages/structures/data/facade were transcribed from the same source.
license = "(AGPL-3.0-only OR LicenseRef-Commercial) AND Apache-2.0"
repository.workspace = true

[dependencies]
# Pinned to the versions Arnis's Cargo.lock resolves at d8e8b662 (rand 0.9.4, rand_chacha 0.9.0): the sampling
# algorithms of `random_range` and `random_bool` decide every draw, so a patch release could move a building's wall.
rand = { version = "=0.9.4", default-features = false }
rand_chacha = "=0.9.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
