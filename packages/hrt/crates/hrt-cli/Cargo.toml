[package]
name = "hrt-cli"
description = "The Hilbert Rust Tiler's command-line program: the build pipeline and hrt clock, the archive comparison tool."
version.workspace = true
edition.workspace = true
license = "(AGPL-3.0-only OR LicenseRef-Commercial) AND Apache-2.0"
repository.workspace = true

[[bin]]
name = "hrt"
path = "src/main.rs"

[dependencies]
flate2 = "1"
geo-types = "0.7"
geos = { version = "11.3.1", features = ["static", "v3_12_0"] }
hrt-e = { path = "../hrt-e" }
hrt-osm = { path = "../hrt-osm" }
hrt-pmtiles = { path = "../hrt-pmtiles" }
hrt-profile = { path = "../hrt-profile" }
hrt-render = { path = "../hrt-render" }
hrt-sort = { path = "../hrt-sort" }
hrt-sources = { path = "../hrt-sources" }
rayon = "1"
tempfile = "3"
