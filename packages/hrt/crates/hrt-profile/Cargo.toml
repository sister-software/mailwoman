[package]
name = "hrt-profile"
description = "The Hilbert Rust Tiler's basemap profile: the fork's Matcher rules, a FeatureCollector-style builder, OSM names, and the ported layers."
version.workspace = true
edition.workspace = true
# The layers port the Protomaps basemap profile (BSD-3-Clause) as forked in mailwoman/basemaps, and the rule and
# feature machinery ports Planetiler 0.10.2 (Apache-2.0).
license = "(AGPL-3.0-only OR LicenseRef-Commercial) AND Apache-2.0 AND BSD-3-Clause"
repository.workspace = true

[dependencies]
earcutr = "0.4"
flate2 = "1"
geo-types = "0.7"
geos = { version = "11.3.1", features = ["static", "v3_12_0"] }
harfrust = "0.15"
hrt-e = { path = "../hrt-e" }
hrt-osm = { path = "../hrt-osm" }
hrt-pmtiles = { path = "../hrt-pmtiles" }
hrt-render = { path = "../hrt-render" }
hrt-sort = { path = "../hrt-sort" }
regex = "1"
rustc-hash = "2"
serde_json = "1"
unicode-script = "0.5"
zip = { version = "9", default-features = false, features = ["deflate"] }

[dev-dependencies]
geo = "0.29"
