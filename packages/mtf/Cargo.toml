[workspace]
resolver = "2"
members = [
	"crates/mtf-core",
	"crates/mtf-wasm",
	"crates/mtf-channels",
	"crates/mtf-sampler",
	"crates/mtf-py",
	"crates/mtf-node",
	"crates/mtf-tools",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
# The crate is AGPL; the Apache-2.0 and BSD-2-Clause terms cover the ported SentencePiece and
# darts-clone code listed in THIRD_PARTY_NOTICES.md.
license = "(AGPL-3.0-only OR LicenseRef-Commercial) AND Apache-2.0 AND BSD-2-Clause"
repository = "https://github.com/sister-software/mailwoman"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"

# The profile the `mailwoman_mtf` Python extension is built with. A panic must unwind so PyO3 raises it as a Python
# exception: under the release profile's `panic = "abort"` a Rust panic would end the training process.
[profile.py]
inherits = "release"
opt-level = 3
panic = "unwind"

# The profile the `mtf-node` addon is built with. napi-rs turns a Rust panic into a JavaScript exception only when the
# panic unwinds, so a panic fails the call rather than ending the Node process.
[profile.node]
inherits = "release"
opt-level = 3
panic = "unwind"

# The profile `packages/mtf/tools/tokenizer` builds `mtf-tokenizer` with. It encodes every training row when it counts
# piece use, so it is optimized for speed rather than size.
[profile.tools]
inherits = "release"
opt-level = 3
