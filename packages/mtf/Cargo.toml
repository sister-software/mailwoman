[workspace]
resolver = "2"
members = ["crates/mtf-core"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only OR LicenseRef-Commercial"
repository = "https://github.com/sister-software/mailwoman"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
