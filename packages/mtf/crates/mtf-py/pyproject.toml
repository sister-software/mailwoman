[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "mailwoman-mtf"
version = "0.1.0"
description = "The mtf tokenizer and Mailwoman's training-row encoder, as a Python extension."
license = { text = "AGPL-3.0-only OR LicenseRef-Commercial" }
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3"]

[tool.maturin]
module-name = "mailwoman_mtf"
# The `py` profile in the workspace `Cargo.toml`: `opt-level = 3` and `panic = "unwind"`, so a Rust panic raises
# in Python rather than ending the process.
profile = "py"
locked = true

# uv rebuilds the extension when any crate source, manifest or the lockfile changes.
[tool.uv]
cache-keys = [
	{ file = "pyproject.toml" },
	{ file = "Cargo.toml" },
	{ file = "src/**/*.rs" },
	{ file = "mailwoman_mtf.pyi" },
	{ file = "../mtf-core/Cargo.toml" },
	{ file = "../mtf-core/src/**/*.rs" },
	{ file = "../mtf-channels/Cargo.toml" },
	{ file = "../mtf-channels/src/**/*.rs" },
	{ file = "../mtf-sampler/Cargo.toml" },
	{ file = "../mtf-sampler/src/**/*.rs" },
	{ file = "../../Cargo.toml" },
	{ file = "../../Cargo.lock" },
]
