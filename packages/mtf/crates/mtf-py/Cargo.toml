[package]
name = "mtf-py"
description = "The `mailwoman_mtf` Python extension: the mtf tokenizer and the training-row encoder."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "mailwoman_mtf"
crate-type = ["cdylib"]

# The extension is built from source for each interpreter it runs under (the lab venv, CI and the Modal image), so it
# targets that interpreter's full API rather than the stable ABI.
[dependencies]
mtf-core = { path = "../mtf-core" }
mtf-channels = { path = "../mtf-channels", features = ["finders"] }
pyo3 = { version = "0.30", features = ["extension-module"] }
numpy = "0.30"
