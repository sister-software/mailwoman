[package]
name = "mtf-sampler"
description = "Mailwoman's training-row sampler: the corpus reader, the source mixture, augmentation and relabeling, the character path, and the row and batch streams built on a CPython-compatible generator."
version.workspace = true
edition.workspace = true
license = "(AGPL-3.0-only OR LicenseRef-Commercial) AND Apache-2.0 AND BSD-2-Clause"
repository.workspace = true

[dependencies]
mtf-core = { path = "../mtf-core" }
mtf-channels = { path = "../mtf-channels" }
# CPython seeds a generator from a string through the string's SHA-512 digest, and the loader verifies each corpus
# file against its manifest's SHA-256.
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
# `float_roundtrip` parses every decimal to the double Python's `json` produces, so a configured weight is the same
# double in both languages.
serde_json = { version = "1", features = ["float_roundtrip"] }
parquet = { version = "60", default-features = false, features = [
	"arrow",
	"snap",
	"zstd",
	"lz4",
	"flate2-zlib-rs",
	"brotli",
	"simdutf8",
] }
arrow-array = "60"
arrow-buffer = "60"
arrow-schema = "60"
arrow-select = "60"
# The held-out id sets hold millions of strings and every train row of a filtered file is tested against them while
# the sources are indexed, so the sets hash with FxHash rather than SipHash.
rustc-hash = "2"

[dev-dependencies]
tempfile = "3"
