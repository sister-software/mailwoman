[package]
name = "mtf-node"
description = "The `mtf-node` Node addon: the training-row sampler, the row encoder and the char encoder for the TypeScript audits and tools."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "mtf_node"
crate-type = ["cdylib"]

# The addon is built from source on first use under the workspace's `node` profile, as `mtf-py` is built for each
# interpreter. It is never part of the browser `mtf.wasm`, which depends on `mtf-core` alone.
[dependencies]
mtf-core = { path = "../mtf-core" }
mtf-channels = { path = "../mtf-channels", features = ["finders"] }
mtf-sampler = { path = "../mtf-sampler" }
napi = { version = "3.15", default-features = false, features = ["napi6"] }
napi-derive = "3.6"

[features]
# Exports `panicForTest`, which panics, so `tools/sampler/native.panic.integration.test.ts` can observe what a Rust panic
# does to the Node process. The addon `buildMTFNode` builds leaves it out.
panic-probe = []

[build-dependencies]
napi-build = "2.6"
