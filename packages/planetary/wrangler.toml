# Planetary: static assets only. No `main`, so a navigation or an asset request never invokes a Worker; the SPA
# fallback serves index.html for every path and the app reads location.pathname. Two Workers Builds projects deploy
# this file, one per body, each with its own PLANETARY_BODY build variable and custom domain; the dashboard project
# name overrides `name` (README, "Deployment").

name = "mailwoman-planetary"
compatibility_date = "2026-09-07"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
