[package]
name = "recognize-core"
description = "The declarative grammar AST, its builders, validation and the deterministic JSON intermediate representation @mailwoman/recognize compiles from."
version.workspace = true
edition.workspace = true
license = "AGPL-3.0-only OR LicenseRef-Commercial"
repository.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
# `preserve_order` keeps the IR's keys in the order the types declare them when the text is laid out.
serde_json = { version = "1", features = ["preserve_order"] }
