[package]
name = "recognize-wasm"
description = "The C-ABI WebAssembly adapter over recognize-core that @mailwoman/recognize's TypeScript loader calls."
version.workspace = true
edition.workspace = true
license = "AGPL-3.0-only OR LicenseRef-Commercial"
repository.workspace = true

[lib]
# `cdylib` is the WebAssembly module. `rlib` lets `cargo test` link the exports natively.
crate-type = ["cdylib", "rlib"]

[dependencies]
recognize-core = { path = "../recognize-core" }
serde_json = "1"
