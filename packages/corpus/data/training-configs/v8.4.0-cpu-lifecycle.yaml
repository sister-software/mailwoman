    B-country: 3.5
    I-country: 3.5
    B-region: 1.5
    I-region: 1.5
    B-locality: 2.0
    I-locality: 2.0
    B-dependent_locality: 1.0
    I-dependent_locality: 1.0
    B-postcode: 1.5
    I-postcode: 1.5
    B-subregion: 0.3
    I-subregion: 0.3
    B-cedex: 1.0
    I-cedex: 1.0
    B-venue: 1.5
    I-venue: 1.5
    B-street: 2.0
    I-street: 2.0
    B-house_number: 1.5
    I-house_number: 1.5
    B-street_prefix: 1.5
    I-street_prefix: 1.5
    B-street_suffix: 1.5
    I-street_suffix: 1.5
    B-unit: 1.5
    I-unit: 1.5
    B-po_box: 1.5
    I-po_box: 1.5
    B-intersection_a: 1.0
    I-intersection_a: 1.0
    B-intersection_b: 1.0
    I-intersection_b: 1.0
  use_phrase_priors: true
  phrase_feature_dim: 10
train:
  output_dir: /data/output-v840-cpu-lifecycle/checkpoints
  seed: 42
  batch_size: 8
  eval_batch_size: 32
  grad_accum_steps: 1
  learning_rate: 0.0005
  weight_decay: 0.01
  warmup_steps: 20
  grad_clip_norm: 1.0
  max_steps: 200
  eval_every_steps: 100
  save_every_steps: 100
  log_every_steps: 10
  precision: fp32
  num_workers: 0
  csv_log_path: '{output_dir}/../train_log.csv'
  lr_schedule: cosine
  gazetteer_curriculum: true
  evidence_curriculum: true
  evidence_noise_prob: 0.15
  fisher_capture: true
  fisher_capture_last_n_steps: 50
eval:
  golden_dir: ''
  val_jsonl: ''
