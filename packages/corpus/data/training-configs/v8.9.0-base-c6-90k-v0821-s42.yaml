    - name: us-city-state-exposure
      min_fraction_of_expected: 0.9
      source: rendered-us-city-state
      country: US
      component_sequence:
        - locality
        - region
    # v8.8.0's header, point 4: the relabels. The NAD county relabel takes no receipt (that point states why).
    - name: us-nppes-exposure
      min_fraction_of_expected: 0.8
      source: usgov-nppes
      country: US
    - name: us-nppes-po-box
      min_draws: 1
      source: usgov-nppes
      country: US
      component_sequence:
        - po_box
    - name: us-ny-notaries-po-box
      min_fraction_of_expected: 0.5
      source: state-ny-notaries
      country: US
      component_sequence:
        - po_box
    - name: us-kryptonite-retag
      min_fraction_of_expected: 0.9
      source: deepseek-kryptonite
      country: US
    - name: wof-admin-exposure
      min_fraction_of_expected: 0.9
      source: wof-admin
    # v8.8.0's header, point 4: the re-rendered recipe outputs.
    - name: us-pmb-street-split
      min_fraction_of_expected: 0.8
      source: invented-po-box-cedex
      country: US
      component_sequence:
        - street
        - street_suffix
        - po_box
    - name: fr-residence-lotissement-venue
      min_fraction_of_expected: 0.8
      source: invented-postal-unit-guideline
      country: FR
      component_sequence:
        - venue
        - house_number
        - street
    - name: house-venue-exposure
      min_fraction_of_expected: 0.9
      source: invented-house-venue
    # #2750. The move copies a train row whose postcode sits on its layout's native side of the locality-and-region
    # block, so these four receipts floor that native population in the D-rule locales. They match the drawn row
    # before augmentation, so they read the same in all three arms. Each floor is a presence floor, set well under the
    # source's share of a 1,000,000-row epoch rather than fitted to an audit. A shortfall stops the run for a
    # diagnosis, and the floor stays where it is.
    - name: us-native-locality-region-postcode
      min_draws: 6000
      country: US
      component_sequence:
        - locality
        - region
        - postcode
    - name: fr-native-postcode-locality
      min_draws: 6000
      source: ban
      country: FR
      component_sequence:
        - postcode
        - locality
    - name: de-native-postcode-locality
      min_draws: 600
      source: rendered-de
      country: DE
      component_sequence:
        - postcode
        - locality
    - name: gb-native-locality-postcode
      min_draws: 300
      source: rendered-gb-os-open
      country: GB
      component_sequence:
        - locality
        - postcode
    # #2750 keeps the producers that write another form rather than mixing order: G-NAF's postcode before the street,
    # fr-order variants A, B and D, and nl-postcode orders 1 and 2. The move skips gnaf and the CZ pcfirst sources.
    # These floor their presence so a rebuild that dropped one is caught before a GPU is allocated.
    - name: au-gnaf-rows
      min_draws: 600
      source: gnaf
      country: AU
    - name: fr-order-kept-variants
      min_draws: 600
      source: rendered-fr-order
      country: FR
    - name: nl-postcode-rows
      min_draws: 600
      source: rendered-nl-postcode
      country: NL
  required_validation_coverage:
    - country: GB
      min_rows: 1000
      min_street_rows: 1000
    - country: FR
      min_rows: 1000
      min_street_rows: 1000
    - country: DE
      min_rows: 1000
      min_street_rows: 1000
    - country: US
      min_rows: 1000
      min_street_rows: 1000
    - country: RU
      min_rows: 20
      min_street_rows: 10
    - country: CN
      min_rows: 20
      min_street_rows: 10
    - country: IN
      min_rows: 20
      min_street_rows: 10
    - country: ID
      min_rows: 20
      min_street_rows: 10
    - country: NG
      min_rows: 20
      min_street_rows: 10
    - country: PK
      min_rows: 20
      min_street_rows: 10
    - country: BD
      min_rows: 20
      min_street_rows: 10
    - country: VN
      min_rows: 20
      min_street_rows: 10
    # Presence floors for the address-system sources' countries.
    - country: RO
      min_rows: 20
      min_street_rows: 10
    - country: LV
      min_rows: 20
      min_street_rows: 10
    - country: GP
      min_rows: 20
      min_street_rows: 10
    - country: MQ
      min_rows: 20
      min_street_rows: 10
    - country: GF
      min_rows: 20
      min_street_rows: 10
    - country: RE
      min_rows: 20
      min_street_rows: 10
    - country: YT
      min_rows: 20
      min_street_rows: 10
    - country: NC
      min_rows: 20
      min_street_rows: 10
    - country: PF
      min_rows: 20
      min_street_rows: 10
    # PM has no entry. The hashed place holdout (6ff893e25) leaves it no held-out place, so its val split held 1 row on
    # v0.8.1, and a country with no held-out split gets no floor, as BL and MF got none in v7.2.0.
  # v8.8.0's floors, half of each label's rows in the 21,361-row val draw of v0.8.20-retention-overlay, rounded down.
  # They're re-derived from the v0.8.21 val draw before launch (this config's header, "Before launch").
  required_validation_label_support:
    - {label: postcode, split: val, min_rows: 7656}
    - {label: locality, split: val, min_rows: 9402}
    - {label: street, split: val, min_rows: 8354}
    - {label: house_number, split: val, min_rows: 7644}
    - {label: region, split: val, min_rows: 2465}
    - {label: street_suffix, split: val, min_rows: 884}
    - {label: street_prefix, split: val, min_rows: 1358}
    - {label: venue, split: val, min_rows: 1975}
    - {label: unit, split: val, min_rows: 193}
    - {label: country, split: val, min_rows: 1218}
  augment_exclude_sources:
    - spliced-suffix-boundary
    # This source teaches a postcode with no other token, such as `119 00`, so augmentation would add tokens the row
    # mustn't contain.
    - codex-bare-postcode
    # On WOF rows the region and directional rewrites expand a word inside a place name (`AL MANĀMAH` to
    # `Alabama MANĀMAH`) under the original label, and the build already renders a `drop-commas` variant.
    - wof-admin
    - wof-postalcode
    # The same rewrites would expand a word inside a landmark's name under the `venue` label.
    - wikidata-vital-places
  train_rows_per_epoch: 1000000
  # The validation draw is sized to hold the venue and country rows the label floors above require.
  val_rows: 36864
  coarse_filter: true
  augment_directional_prob: 0.3
  augment_region_prob: 0.3
  augment_glue_prob: 0.25
  augment_ordinal_prob: 0.3
  augment_punct_drop_prob: 0.3
  augment_postcode_move_prob: 0.0
  anchor_lookup_path: /data/anchor/pilot-anchor-lookup-v2-2026-08-05.json
  gazetteer_lexicon_path: /data/gazetteer/anchor-lexicon-v1.json
  country_lexicon_path: /data/gazetteer/country-surface-lexicon-v1.json
  gazetteer_choreography: true
  affix_relabel_lexicon_path: /data/gazetteer/affix-relabel-lexicon-v2.json
  anchor_paint_mode: postal
  anchor_value_mode: posterior_latlon
  street_type_lexicon_path: /data/gazetteer/street-type-lexicon-v3.json
  locality_surface_lexicon_path: /data/gazetteer/locality-surface-lexicon-v7.json

