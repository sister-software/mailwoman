# v8.9.0-base-c6-90k-v0821-s42 is v8.8.0-base-c6-90k-v0820-county-s42.yaml on corpus v0.8.21. Every key and value is
# that config's except these:
#
# 1. `data.corpus_dir` is corpus v0.8.21,
#    /data/corpus/versioned/v0.8.21-retention-overlay/corpus-v0.8.21-retention-overlay. Its manifest doesn't exist
#    yet: the re-split is running. Corpus v0.8.21 is v0.8.20 with one file replaced and new held-out groups:
#    - `invented-house-venue-intl` is re-rendered by the recipe fix of 9b93bccef2 (lane AT). v0.8.20's render wrote
#      every IN row as `Locality PIN, State`. The fixed recipe writes IN in both forms the codex `WRITTEN_LAYOUTS`
#      table records. Of the 6,000 IN rows of the 18,000-row file
#      (/mnt/mw/corpus/recipe-outputs-v0.8.21/invented-house-venue-intl-v0.8.21.labeled.jsonl, counted 2026-11-19),
#      2,975 end `locality, region, postcode` and 3,025 end `locality, postcode, region`. The other 12,000 rows are
#      6,000 PT and 6,000 MX;
#    - 44,060 frozen development groups of `heldout-dev-v0.8.21` move from train to test, so this run trains on none
#      of them.
# 2. `train.output_dir` and `train.trackio_run_name` name the run.
#
# Every receipt is v8.8.0's. `house-venue-exposure` names only its source, so its expected draws are the epoch times
# the source's share of the configured weights (`invented-house-venue: 2.0`), and the new file's row count doesn't
# move its floor. A comment in the body that cites "v8.8.0's header, point N" cites that config's header. Its points
# 2 to 4 give the county weights, the subregion class weight and the receipts.
#
# Before launch, on the admitted v0.8.21 manifest (HOLDOUT_AND_EVALUATION sections 4.4 item 5 and 8):
# - record the manifest's sha256 and split counts in point 1;
# - re-derive `required_validation_label_support` from the v0.8.21 val draw (half each label's rows, rounded down),
#   and re-check `required_validation_coverage` and `val_rows` against the re-split. Until then the floors are
#   v8.8.0's, from the v0.8.20 val draw;
# - run the epoch-mixture audit on a copy of this config re-rooted at /mnt/mw, and check every receipt against it.
#
# Run shape: from scratch, with no `train.init_from`, as v8.8.0. Why: the run repeats v8.8.0's recipe on a corpus
# that corrects one recipe output, so the change under test is that file. Control: the v8.8.0 seed 42 run, the same
# recipe and seed on v0.8.20. The new held-out groups are the second difference between the two corpora: they take
# 44,060 groups out of training, so a loss outside IN is read against them before the house-venue file.
#
# Seed 42, as v8.8.0, chosen on development only (v8.8.0's header).
#
# Prediction, written 2026-11-19 before the v0.8.21 manifest exists, against the v8.8.0 seed 42 run on the
# development role. The coordinator gave the IN counts. This config's author didn't re-measure them:
# - IN rows in the `Locality, State PIN` form: v8.7.0 seed 42 parses 216 of 218 exactly, v8.8.0 seed 42 parses 10.
#   v8.9.0 recovers to at least 200 of 218. The `Locality PIN, State` rows v8.8.0 learned stay at or above
#   v8.8.0's count less 5.
# - US rows with a `subregion` span and `country-US` hold at v8.8.0's values, within 2 rows and 0.005. No v0.8.21
#   change touches a US source.
# - AU stays inside the v8.7.0 seed range: AU address rows with a `region` span between 1,229 and 1,391 of 1,717,
#   and `country-AU` at or above 0.927.
# A result outside these ranges is attributed by country and row before anything else.
#
# Launch with `--fresh --device A100-40GB`: 90,000 steps, about $3.40 of Modal, as each v8.7.0 run billed.
#
# The receipt preflight, CPU only, on a copy of this config re-rooted at /mnt/mw (the launcher runs it before it
# starts a sandbox):
#   node packages/mailwoman/tools/training/audits/epoch/mixture.run.ts \
#     --config <re-rooted copy of packages/corpus/data/training-configs/v8.9.0-base-c6-90k-v0821-s42.yaml> \
#     --json /mnt/mw/audits/epoch-mixture-v8.9.0-base-c6-90k-v0821-s42.json
#
# What a `pass` needs, and the steps after training, are v8.8.0's header's, with this run's corpus v0.8.21 in place
# of v0.8.20.

