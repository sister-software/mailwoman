# v8.3.0-probe-c6-isolated-punctuation-2k is the #2853 vocabulary probe. It trains from scratch for 2,000 steps and
# differs from v8.3.0-probe-c4-split-digits-2k.yaml only in `data.tokenizer_dir`, `train.output_dir` and
# `train.trackio_run_name`, so the C4 arm's existing checkpoint is its comparison arm.
#
# This arm's vocabulary is C6: C4's recipe (unigram, 48,000 pieces, `split_digits` on) with every punctuation and
# symbol character of the training text as a single-character user-defined symbol, so no piece spans a change between
# digits, letters and punctuation. Its training text adds 60,000 query lines built from the codex relation words.
# The reachability census (heldout/dataset/reachability.run.ts) over heldout-dev-v0.8.0 leaves 0 of 317,878 gold edges
# at a character-class change inside a C6 piece.
#
# The differences from v8.2.0-base-60k.yaml are:
#
# 1. `data.corpus_dir` is the v0.8.4-overlay corpus overlay over v0.8.2. It replaces wof-admin,
#    wof-postalcode and usgov-nppes with their rebuilt files (732 files, 701,766,159 rows).
# 2. `data.tokenizer_dir` is this arm's vocabulary, tokenizer.model md5 5a1759ca2a384ab7fe1ac2166399106c.
# 3. `train.max_steps` is 2,000 with a 200-step warmup, an evaluation every 500 steps and a save at the end.
# 4. `train.output_dir` and `train.trackio_run_name` name the run.
#
# The arm is graded against C4 under release/specs/probe-isolated-punctuation.v1.json on the held-out test split.
#
# Launch with `--fresh`: 2,000 steps on an A100-40GB.
