    # PM has no entry. The hashed place holdout (6ff893e25) leaves it no held-out place, so its val split held 1 row on
    # v0.8.1, and a country with no held-out split gets no floor, as BL and MF got none in v7.2.0.
  # Half of each label's rows in the 21,596-row val draw of v0.8.22-retention-overlay, rounded down, measured
  # 2026-11-22 by audits/label/support.run.ts on v8.10.0's config re-rooted at /mnt/mw. Measured counts: locality
  # 18,957, street 16,518, postcode 15,134, house_number 15,102, region 5,152, venue 4,075, street_prefix 2,583, country
  # 2,520, street_suffix 1,769, unit 363. dependent_locality 1,345, subregion 383 and po_box 47 take no floor, as
  # the v0.8.2 floors set none for them. The NZ file adds no `val` row, so the draw is unchanged.
  required_validation_label_support:
    - {label: postcode, split: val, min_rows: 7567}
    - {label: locality, split: val, min_rows: 9478}
    - {label: street, split: val, min_rows: 8259}
    - {label: house_number, split: val, min_rows: 7551}
    - {label: region, split: val, min_rows: 2576}
    - {label: street_suffix, split: val, min_rows: 884}
    - {label: street_prefix, split: val, min_rows: 1291}
    - {label: venue, split: val, min_rows: 2037}
    - {label: unit, split: val, min_rows: 181}
    - {label: country, split: val, min_rows: 1260}
  augment_exclude_sources:
    - spliced-suffix-boundary
    # This source teaches a postcode with no other token, such as `119 00`, so augmentation would add tokens the row
    # mustn't contain.
    - codex-bare-postcode
    # On WOF rows the region and directional rewrites expand a word inside a place name (`AL MANĀMAH` to
    # `Alabama MANĀMAH`) under the original label, and the build already renders a `drop-commas` variant.
    - wof-admin
    - wof-postalcode
    # The recipe writes WOF names in the same short shapes, so the same rewrites would expand them.
    - rendered-prominent-places
    # v8.10.0's header, point 5.
    - rendered-former-divisions
    # The same rewrites would expand a word inside a landmark's name under the `venue` label.
    - wikidata-vital-places
  train_rows_per_epoch: 1000000
