# v8.21.0-outcomes-v0822-s42 is v8.20.0-wofrank-v0822-s42.yaml with the outcome hint and the outcome head of
# docs/engineering/reference/outcome-kinds.mdx (#3542, #3543), drafted on 2026-11-27. Every key is v8.20.0's but these:
#
# 1. `data.outcome_masks_path` is the corpus's outcome mask file.
#    `packages/mailwoman/tools/training/outcomes/masks.run.ts` wrote it from this corpus. Each row's reading is the identity
#    top level its source renders, from `packages/trainer/data/outcome_readings.json`. Over the corpus's 890,129,650
#    rows, measured on 2026-11-27: address 805,202,213 rows with a target, venue 78,599,295, place 3,241,036, natural
#    1,402,113, postal 797,896 and transit 0. 887,097 rows are masked: 384,806 single-postcode rows the recognizer
#    answers (1,470 address, 383,336 postal), 436,449 rows whose reading is unknown (222,471 `wikidata-vital-places`
#    rows and 213,978 `geonames-features` rows of GeoNames class L), and 65,842 cue-less single-span names whose surface
#    rows of two readings share (32,866 place, 16,522 address, 16,454 natural). Those last rows need the
#    sitelink-weighted soft target, and the corpus holds no sitelink count, so they give the head zero signal.
# 2. `model.use_outcome_hint` adds the `outcome_hint` input over the table's 27 hint classes and a "no hint" row.
#    `outcome_hint_prob` is 0.5: half the rows with a reading see it as their hint and the other half see no hint, so
#    the head learns the reading with the hint and the prior without one, as `locale_hint_drop_prob` 0.5 has split the
#    locale hint since v7.2.0. A shown hint is always the row's own reading, so the hint never contradicts the row.
# 3. `model.use_outcome_head` adds the query-level head over the six identity top levels. `outcome_loss_weight` is 0.3,
#    the weight of the two other pooled heads, the locale head and the address-system head. Both have trained at 0.3
#    beside the token loss since v7.2.0.
# 4. `train.output_dir` and `train.trackio_run_name` name the run. `max_steps` is v8.20.0's 31,965: the corpus and the
#    draws are v8.20.0's, and `eval_every_steps` stays equal to it.
#
# v8.20.0's notes describe every other key.

