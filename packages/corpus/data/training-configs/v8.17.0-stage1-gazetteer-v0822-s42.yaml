# v8.17.0-stage1-gazetteer-v0822-s42 is one of the two stages of v8.17.0 (#3531), derived on 2026-11-27 from
# v8.16.0-base-c6-wofreps-positions-v0822-s42.yaml by scratchpad/2026/11/27/derive-v8170-stages.ts.
#
# Stage 1 trains every `wof-admin` train row of corpus v0.8.22 once, reading the corpus's existing train files in
# their stored order (`data.read_order: stored`), with no source draw, shuffle or seed. `wof-postalcode` is out of
# v8.17.0 by the operator's decision of 2026-11-27, so it weighs 0.0 here and in stage 2. Every other source weighs
# 0.0 and `train_rows_per_epoch` is null. `country_weights` adds XK, XS, UN, XZ and XN at 1.0: WOF writes these
# codes outside ISO 3166-1 on 18,211 `wof-admin` train rows, and the sampler skips a row whose country
# `country_weights` leaves out. With them every one of the 2,780,333 `wof-admin` train rows (`sourceRowCounts`)
# is admitted, so `max_steps` is ceil(2,780,333 / 512) = 5,431.
# `source_reps`, `source_emit_factors`, `required_corpus_receipts` and `prominent_place_coverage` are left out,
# because they describe the stage-2 mixture. `required_validation_coverage` is left out because its audit reads
# the admitted countries through `weightedCountries`, which refuses the five codes above. Stage 2 keeps it, and
# stage 2's model is the one graded. `fisher_capture` is false for the same reason.
# `train.cuda_graph` is false: its first capture failed on the A100 (2026-11-27, run 8758701bc86349c1) because
# `cross_entropy_loss` with label smoothing calls `masked_select`, whose `nonzero` syncs with the host (#3531).
#
# Both stages train at batch 512 (#3531). `learning_rate` is v8.16.0's 5.0e-4 times the square root of the batch
# ratio, 1.0e-3, and the step-counted keys keep v8.16.0's row counts: `warmup_steps` 1000 → 250, `eval_every_steps`
# 2000 → 500, `save_every_steps` 5000 → 1250, `log_every_steps` 100 → 25 and `fisher_capture_last_n_steps`
# 2000 → 500. `eval_batch_size` stays 128.
#
# The notes that follow are v8.16.0's.
#
# v8.16.0-base-c6-wofreps-positions-v0822-s42 is v8.15.0-base-c6-wofreps-cursor-emit-v0822-s42.yaml with its run
# renamed, drafted on 2026-11-27 (#3516). Every key below the notes is v8.15.0's but `train.output_dir` and
# `train.trackio_run_name`. The trainer image it launches on builds two changes:
#
# 1. The sampler starts each epoch's spread row group where the run's earlier epochs stopped reading it
#    (b62c9b9abd). v8.15.0 placed epoch e at (e - 1) times the group's expected draws, and an epoch's emitted-row
#    limit stops it short of them. `wof-admin` drew 2,815,421 times against 2,780,333 train rows, and 419,900 rows
#    were never drawn, while 407,229 rows repeated four or more epochs after their first draw.
# 2. AdamW and the gradient clip run libtorch's multi-tensor kernels on CUDA (c322f4a89c). On the CPU the two
#    kernels agree within 1e-6 after 20 steps. On CUDA the update rounds differently from the per-tensor kernel.
#
# v8.15.0 parsed 118,499 of the 131,823 development rows exactly, against the shipped 11.4.0's 118,368.
#
# The notes that follow are v8.15.0's.
#
# v8.15.0-base-c6-wofreps-cursor-emit-v0822-s42 is v8.14.0-base-c6-wofreps-cursor-v0822-s42.yaml with
# `data.source_emit_factors` and `train.max_steps` 126000, drafted on 2026-11-26 (#3516).
#
# A `source_reps` target counts emitted rows, and the emit step's augmented copies make some sources emit more rows
# per draw than others: in v8.14.0 `wof-admin` realized 2,277,277 rows against its derived 2,780,333 (0.82), and
# `usgov-usgs-structures` 333,089 against 231,284 (1.44). The sampler divides each target by its source's factor
# (`draws_per_row` in mtf-sampler/src/source_reps.rs). The factors are v8.14.0's epoch-mixture audit's
# `distortion_vs_draw_share`, written by `node packages/mailwoman/tools/training/draw/emit-factors.run.ts --config
# v8.14.0-base-c6-wofreps-cursor-v0822-s42.yaml --audit epoch-mixture-v8.14.0-base-c6-wofreps-cursor-v0822-s42.json`.
# A source the audit's epoch emitted fewer than 2,000 rows of reads 1 (115 sources). `max_steps` keeps every
# weighted source's draws at or above v8.10.0's. The draw report (in emitted rows) lists 22 `source_reps` sources
# below v8.10.0's run, each with a factor above 1 that over-delivered under the old arithmetic and now emits its
# declared target, such as `usgov-usgs-structures` (331,013 → 231,284 emitted rows).
#
# The notes that follow are v8.14.0's.
#
# v8.14.0-base-c6-wofreps-cursor-v0822-s42 is v8.13.0-base-c6-wofreps-v0822-s42.yaml with its run renamed, drafted on
# 2026-11-26 (#3516). The trainer image it launches on builds the sampler's epoch cursor (a7fb952de4): the epochs of a
# run read each spread source's row groups in turn, where each epoch formerly read a fresh random part of them. In
# v8.13.0, 1,211,010 of wof-admin's 2,780,333 train rows were never drawn under `source_reps: 1.0`. Every key below the
# notes is v8.13.0's but `train.output_dir` and `train.trackio_run_name`.
#
# The notes that follow are v8.13.0's.
#
# v8.13.0-base-c6-wofreps-v0822-s42 is v8.10.0-base-c6-90k-v0822-s42.yaml, the shipped 11.3.0 model's config, with
# v8.12.0's training draw reallocation as its one change, drafted on 2026-11-26 (#3516). Corpus v0.8.22 is unchanged.
#
# On the development collections (131,823 rows) the shipped model parsed 117,533 rows exactly, v8.11.0 (corpus v0.8.23,
# v8.10.0's draw) 115,031 and v8.12.0 (corpus v0.8.23, the reallocated draw) 115,686. The large country losses (CH, KZ,
# ID, IR, MX) sit in both v0.8.23 models, and the draw change gained 655 rows on one corpus. This run measures the draw
# change on the shipped model's own corpus.
#
# A. `wof-admin` and `wof-postalcode` leave `source_weights` (15.0 and 7.5) for `source_reps` 1.0: one expected
#    draw per training row.
# B. `rendered-prominent-places` leaves `source_weights` (3.5) for `source_reps` 20, so prominent places keep
#    their share of the short admin draws against the larger WOF draw.
# C. `train.max_steps` is 122000, so every source drawn in v8.10.0's run draws no fewer rows than it drew there.
# D. Every `required_corpus_receipts` entry on a `source_reps` source states `min_fraction_of_expected: 0.9`, because a
#    reps source's draws per epoch move with `max_steps` while its run total stays fixed.
# E. `train.output_dir` and `train.trackio_run_name` name the run.
#
# The notes that follow are v8.10.0's.
#
# v8.10.0-base-c6-90k-v0822-s42 is v8.9.0-base-c6-90k-v0821-s42.yaml on corpus v0.8.22, drafted on 2026-11-20 before
# that corpus exists. Every key and value is that config's except these:
#
# 1. `data.corpus_dir` is corpus v0.8.22,
#    /data/corpus/versioned/v0.8.22-retention-overlay/corpus-v0.8.22-retention-overlay, built on 2026-11-22 from the
#    corpus fixes landed for this cycle:
#    - `wof-admin` writes a dependent locality only beside its parent locality (#3156's label policy). On v0.8.21,
#      111,355 `wof-admin` train rows in 159 countries wrote one without a locality, 104,920 of them in short admin
#      shapes of one to three spans (`dependent_locality|region|country` 27,370, `dependent_locality|region` 25,377,
#      bare `dependent_locality` 18,098, `dependent_locality|country` 15,484). The fixed adapter writes none of them.
#    - `rendered-prominent-places` (recipe `prominent-places`) writes each country's prominent places in their short
#      query shapes at the row counts the prominent-places census sets against the v0.8.22 base build
#      (`tools/dev-tools/corpus/prominent/places.run.ts places`, `scan --manifest <v0.8.22 base MANIFEST.json>`,
#      `tuples --config <this file>`). The counts are set in this config's expected epoch draws (point 2). A
#      sub-locality pair is written `locality | region` when the child is the postal place at its own location and the
#      parent's name is also a first-level WOF region's (`Brooklyn, New York`, the board's key), and
#      `dependent_locality | locality` otherwise (`Camden, London`). The rule moves 276 of the table's 127,698
#      ranked pairs.
#    - `rendered-former-divisions` (recipe `former-divisions`, #3200) writes a former administrative division beside a
#      current WOF locality its containment evidence links it to, before the locality (Google's order,
#      `Redland, Avon, Bristol`) or after it, tagged `subregion` at county level and `region` at the first level. Its
#      tuples come from `packages/gazetteer/tools/former-divisions.run.ts --tuples`, capped at 1,500 rows a country
#      and 300 a division. The table was rebuilt on 2026-11-21 after the forks restored the 628 ceased divisions the
#      superseded rule keeps (#3205). GeoNames lists 49,122 historical divisions in 112 countries, and WOF 27,141
#      ceased admin records. Containment evidence makes 685 links (GeoNames hierarchy 9, retired admin codes 53, WOF
#      supersession 623), and 663 divisions in 37 countries are linked, every one with a tag: locality 523,
#      region 105, subregion 34, country 1. The recipe writes the 139 tagged `region` or `subregion`, and 127 of them
#      cover a current settlement. The tuples hold 16,024 rows in 31 countries: AT, DE, FR, GB, MA and NO 1,500
#      each, IE 908, IT 900, CH 836, CI 600, PH 560, SI 328, BH 324, AM, AO, IQ, NA, PK and ZA 300 each, KE 260,
#      IR 220, SD 100, GL 80, TD 64, LY 12, BS and UA 8, LA, MO, MR and PL 4. GB's 1,500 rows cover 15 divisions,
#      Avon 100 of them. The census in #3200 gives the per-country counts.
# 2. `source_weights` gives `rendered-prominent-places` 3.5: 1.16% of the epoch, 11,649 of the 1,000,000 draws.
#    The receipt's demand rule is measured in this config's expected epoch draws, and the census's `tuples` step sets
#    the recipe's rows so those draws, spread over its rows alike, close each cell. The rows therefore follow from
#    this weight: a lower weight takes more rows, and a weight whose draws fall at or below the cells' deficits takes
#    no row count. Simulated from v0.8.21 (`/mnt/mw/audits/recipe-key-conflict/`), the deficits come to 5,714 draws,
#    and the recipe writes 32,616 rows (18,298 presence rows and 14,318 demand rows, US 4,475 or 13.7%), each drawn 0.36
#    times an epoch. A `wof-admin` row is drawn 0.018 times, so a prominent place's row takes about 20 times a
#    `wof-admin` row's draws. At 15.0 the recipe wrote 19,115 rows drawn 2.48 times each, about 130 times.
# 3. `data.prominent_place_coverage` names the census's places table for candidate-global-2026-11-19, so the launch
#    preflight runs the `prominent_place_coverage` receipt (#3156 rule (a)) and binds its `PLACES.json` into the
#    receipt key. The receipt measures the demand share in this config's expected epoch draws: each row at its
#    source's requested share over the source's admitted rows, times its country's admission chance. A place in a
#    country `country_weights` leaves out isn't required. `country_weights` admits at 1.0, as it does every other
#    country, the 35 countries v8.9.0 left out that hold selected places on the 2026-11-19 table (518 places, YE 124
#    and BO 101 the largest): AQ, BO, CC, CM, CX, EH, FJ, GA, GQ, GS, GY, KI, KP, LY, MR, NF, NR, NU, PN, PS, PW, SJ,
#    SL, SS, SY, TD, TF, TG, TL, TV, WS and YE. It doesn't list XK, XS or XX, the three of the 35 WOF records under
#    a code outside ISO 3166-1: `weightedCountries` (`countriesDeclaredBy`) refuses such a key, so the validation
#    quota and the launch refuse a config that lists one. The v0.8.22 recipe holds 66 rows of theirs (XK 24, XX 42),
#    which the run draws none of. `prominent-places-exposure` floors the recipe's draws at 0.9 of expected.
# 4. `train.output_dir` and `train.trackio_run_name` name the run.
# 5. `source_reps` gives `rendered-former-divisions` 1.0, one pass over its rows across the run. By the exposure
#    arithmetic of `exposure/shapes.ts` (`drawsPerAdmittedRow`, `countryAdmission`), with the 16,024 tuple rows in the
#    `source_reps` derivation over v0.8.21's other rows, a row is drawn 0.087 times an epoch: 1,391 of the 1,000,000
#    draws an epoch, and 16,024 over the run's 90,000 steps of 128 (11.52 epochs). Two passes over the earlier
#    1,888 rows drew 328 an epoch and 3,776 over the run. The rows hold 127 division names, about 126 rows each
#    (median 100, from 4 to 300). On the table before the restore, two passes over 1,888 rows and 27 names drew about
#    140 rows a name over the run. One pass now reaches that exposure, so a second would repeat each row without
#    widening what the model sees.
#    `augment_exclude_sources` lists the source for the reason `rendered-prominent-places` is listed, and
#    `former-divisions-exposure` floors its draws at 0.9 of expected.
# 6. `source_weights` gives `nz-charities-register` 0.0, so the run draws none of its rows, and the source leaves
#    `source_reps` (0.2 in v8.9.0) and `required_corpus_receipts` (`nz-charities-register-exposure`). The model-release
#    check of #3278 refuses its register row `nz-charity-nonprofit-1` (CC BY 3.0 NZ): clause 2.1 bars imposing terms
#    on an Adaptation, and whether trained weights are one is unsettled. The corpus keeps the source's rows. The sampler
#    refuses a train source that `source_weights` leaves out, so the source is listed at 0.0 rather than dropped.
#
# Every other receipt and floor is v8.9.0's and is re-derived on v0.8.22 before launch (HOLDOUT_AND_EVALUATION
# section 4.4 item 5). Before launch, on the admitted v0.8.22 manifest:
# - done 2026-11-23: the manifest is the third re-split of v0.8.22-prominent-overlay (MANIFEST.json sha256 aed71697…,
#   v0.8.22-overlay with the re-sized recipe) under evaluation-groups.v0.8.23.json (sha256 cfaffa67…, 201,538 groups)
#   and a validation quota of 15,300 groups (sha256 6e9ddd98…). It is MANIFEST.json sha256
#   c01019fe088458f8e4950fc8245583083f7e230c3446b1bc4952947186f334fd: 1,104 files, train 889,226,116, val 23,330,
#   test 381,056;
# - done 2026-11-23: `audits/label/support.run.ts` meets `required_validation_label_support` on that val draw, and
#   `audits/validation/coverage.run.ts` finds all 21 `required_validation_coverage` floors met;
# - done 2026-11-23: the epoch-mixture audit (1,000,000 draws) meets all 71 receipts. `former-divisions-exposure`
#   draws 1,441 against 1,240 (expected 1,378), and `prominent-places-exposure` 11,825 against 10,505 (expected 11,673);
# - done 2026-11-23: `places.run.ts tuples --config <this file>` against the scan of v0.8.22-overlay without the
#   recipe, sized through the receipt's held-out reader: 32,378 rows for 16,421 places, every one in train after the
#   re-split;
# - done 2026-11-23: `audits/prominent/coverage.run.ts` passes on this config re-rooted at /mnt/mw. Presence covers
#   20,910 of 20,910 required forms, 808 of 811 demand cells meet their targets and none fails (FJ and GD locality
#   region and ID sub-locality parent are unwritable), and 0 short admin train rows write a dependent locality without
#   a locality;
# - done: the places table `data.prominent_place_coverage` names is frozen on the host at
#   /mnt/mw/audits/prominent-places/candidate-global-2026-11-19/ (`places.parquet` sha256 acfcd09a44b22622…, record
#   version 3 with the `postal_pair` column). The version-2 table is kept beside it as `.v2-2026-11-20`. Only the
#   host reads it: the preflight re-roots /data at MAILWOMAN_DATA_ROOT before the receipt and the receipt key read it,
#   and of the volume's files the sandbox checks only the corpus MANIFEST. The volume copy keeps the mirror whole and starts no read. It is
#   written from the host with the operator's launch go, as
#   `modal volume put mailwoman-training /mnt/mw/audits/prominent-places/candidate-global-2026-11-19 audits/prominent-places/candidate-global-2026-11-19`.
#   A mounted container doesn't see a `modal volume put` file, and none reads this one.
#
# Run shape: from scratch, as v8.9.0. Control: the v8.9.0 seed 42 run, the same recipe and seed on v0.8.21.
# Seed 42, as v8.9.0. The launch waits for the operator's go.

