# v8.8.0-base-c6-90k-v0820-county-s42 is v8.7.0-base-c6-90k-usgs-structures-s42.yaml (run 74eaf854986e4211) on corpus
# v0.8.20. Every key and value is that config's except these:
#
# 1. `data.corpus_dir` is corpus v0.8.20,
#    /data/corpus/versioned/v0.8.20-retention-overlay/corpus-v0.8.20-retention-overlay. Its MANIFEST.json has sha256 ce86a79b67c8c8583eadca0459e373c260fcdc8ac6c883673fa083caf18cfc89 (read on the host
#    copy under /mnt/mw, 2026-11-18). It is the overlay of packages/corpus/data/builds/v0.8.20-rebuild/inputs.json
#    (lane AK) on v0.8.19-overlay, re-split under the evaluation-group policy with
#    packages/corpus/data/holdout/evaluation-groups.v0.8.20.json: 889,624,742 rows in 1,102 files, 889,338,725 train,
#    23,234 val and 262,783 test. The frozen source record is
#    packages/corpus/data/training-manifests/v0.8.20-retention-overlay.json.
# 2. `source_reps` gains the three sources of the `us-county` recipe, at lane AK's proposed weights
#    (`$training-config-note` of the inputs file): `rendered-us-county` 5.0 (6,198 rows, `Polk County, OR`),
#    `rendered-us-city-county` 0.55 (157,069 rows, `Goode Crossing, Powhatan County, VA`) and `rendered-us-city-state`
#    1.0 (157,069 rows, `Little Creek, MS`). A reps target is draws per row over the run's 11,520,000 samples
#    (90,000 steps × 128), so the three draw about 30,990, 86,388 and 157,069 rows over the run, and about 2,690,
#    7,499 and 13,634 of each 1,000,000-row epoch: 23,824 together, 2.4% of the epoch. Every other source's share
#    falls by that 2.4%.
# 3. `model.class_weights` raises `B-subregion` and `I-subregion` from 0.3 to 1.0, lane AK's proposal. At 0.3 the
#    loss on a county token was 0.15 of a street token's (2.0), and every arm graded under v10 (10.8.0, v8.7.0 seeds
#    42 and 43) parses 0 of the 22 development rows with a US `subregion` span exactly.
# 4. `required_corpus_receipts` gains one receipt for each new source and each relabel (the block headed "This
#    config's header, point 4"). Each receipt scoped to one source states its floor as a fraction of the sampler's
#    expected draws (`min_fraction_of_expected`), which the epoch-mixture audit computes from these weights and the
#    corpus it reads, so the floors re-derive on v0.8.20 by construction. The expected draws below are estimates
#    from the v8.7.0 seed 42 audit (/mnt/mw/audits/epoch-mixture-v8.7.0-base-c6-90k-usgs-structures-s42.json) and the
#    relabel counts in the inputs file, and the audit replaces them:
#    - the three county sources, at 0.9 of about 2,690, 7,499 and 13,634;
#    - the NAD county relabel takes no receipt (decided 2026-11-18). Its evidence is a population count instead:
#      - Population: 1,570,484 `usgov-nad` rows of v0.8.20 run `subregion, region`, 0.2587% of 606,956,657, counted
#        with DuckDB over the spans of every NAD file. The epoch-mixture audit's own population count gives the
#        same fraction. The rows sit in 1,197 of NAD's 12,140 row groups and in 102 of its 608 files. 83 groups hold
#        half of them.
#      - One epoch: an epoch takes about 246 rows from each of about 13 random NAD row groups (3,318 NAD draws in
#        the audited epoch). Over the measured per-group counts, a simulation of that pass draws none of these rows
#        in 58% of seeds, with a mean of 8.1. The audit of seed 43 drew 0 against an expectation of 8.8.
#      - The run: over its 11.5 epochs (11,520,000 samples) the simulation expects 89 rows, median 76, 10th
#        percentile 2.
#      - Why no receipt: the three county recipes of point 2 teach the county shape, about 274,000 rows over the
#        run, and each passes its receipt. NAD labeled a county place value `locality`, against the recipes. The
#        relabel removes that contradiction. Its exposure count therefore isn't the hypothesis under test.
#      - The audit has no run-level receipt scope. The preflight audits one epoch, and a floor of 1, the smallest
#        the loader admits, refuses the 58% of seeds whose epoch visits no group holding these rows;
#    - the PO-box relabels: `usgov-nppes` `po_box` rows (9,666 of 9,197,061 base rows, about 7 of 7,105 draws) at
#      a presence floor of 1, and `state-ny-notaries` (395 of 32,097, about 85 of 6,946) at 0.5. `state-tx-notaries`
#      relabels 27 of 511,304 rows, about 0.3 expected draws an epoch, so it takes no receipt, and
#      `state-ia-contractors` keeps weight 0.0, so it's never drawn;
#    - the re-rendered recipe outputs: `invented-po-box-cedex` US rows with `street, street_suffix, po_box` (the PMB
#      split, 3,076 of 50,000 rows, about 318 of 5,175 draws) and `invented-postal-unit-guideline` FR rows with
#      `venue, house_number, street` (426 of 10,000, about 370 of 8,680), each at 0.8. That floor sits more than
#      three standard deviations under the expectation. `invented-house-venue` takes 0.9;
#    - `deepseek-kryptonite` US rows (all 4,822 rows retagged US) at 0.9, `wof-admin` at 0.9, and `usgov-nppes` as a
#      whole (the November 2026 dissemination) at 0.8.
# 5. `train.output_dir` and `train.trackio_run_name` name the run.
#
# What v0.8.20 changes besides points 2 and 4 (lane AK, inputs file):
# - `wof-admin` and `wof-postalcode` drop an ancestor in another country and skip `wof:country` XX records.
# - The NAD place column that writes the record's own county is `subregion`.
# - NPPES, NY, TX and IA label a whole-line PO box `po_box`.
# - `invented-po-box-cedex` splits a PMB row's street.
# - The FR leg of `invented-postal-unit-guideline` labels `RESIDENCE …` and `LOTISSEMENT …` `venue`.
# - `invented-house-venue` is re-rendered over 179,725 + 18,000 tuples with distinct record ids.
# - `deepseek-kryptonite` tags all 4,822 rows US.
# - NPPES reads the November 2026 dissemination.
#
# Measured overlap of the re-rendered outputs with the frozen collections (folded text and source id, 2026-11-18):
# `invented-po-box-cedex` shares the folded text of 42 of the 5,000 rows of heldout-dev-v0.8.19-probes-r2 (19 by
# source id) and of 37 of heldout-confirm-v0.8.19-probes-r2 (23 by source id); `rendered-us-city-state` shares the
# folded text of 20 rows of heldout-dev-v0.8.18 (by text only, short `Locality, ST` rows). The other outputs share
# none. A row whose group is in evaluation-groups.v0.8.20.json goes to test. The rest train, and the overlap audit
# classes those collection rows `known_overlap`. No check admits that class.
#
# Before launch, on the admitted v0.8.20 manifest (HOLDOUT_AND_EVALUATION sections 4.4 item 5 and 8):
# - done 2026-11-18: `data.corpus_dir` names the admitted manifest's directory (point 1);
# - done 2026-11-18: `required_validation_label_support` is re-derived from the v0.8.20 val draw, and
#   `audits/validation/coverage.run.ts` finds every `required_validation_coverage` floor met on the re-split's 23,234
#   val rows. The tightest are NG at 27 rows against 20 and PF at 100. `val_rows` (36,864) stays above the 21,361-row
#   draw, so the draw holds every admitted val row, as it did on v0.8.19;
# - done 2026-11-18: the epoch-mixture audit (seed 43, 1,000,000 draws) on v0.8.20 meets every inherited absolute
#   `min_draws` floor. The tightest is `ban-bl-exposure`, 450 drawn against 408 (expected 481.3). Every new receipt
#   but the NAD county receipt is met. That receipt drew 0 of 8.8 expected, and point 4 records the evidence
#   that replaced it. The audit of this config without it exits 0, in 13 min 40 s of host CPU. Its report is
#   /mnt/mw/audits/epoch-mixture-v8.8.0-base-c6-90k-v0820-county-s42.json.
#
# Run shape: from scratch, with no `train.init_from`. Why: a fine-tune can't introduce a source the base never saw,
# and the three county sources are new. Control: the v8.7.0 seed 42 run (74eaf854986e4211, corpus
# v0.8.19-retention-overlay), the same recipe and seed on the previous corpus. A from-scratch run has no placebo
# fine-tune. Its noise floor is the v8.7.0 seed pair (42 and 43), whose development spread is read beside each
# prediction below. This run changes the corpus and one class weight together, so its differences from v8.7.0 are
# attributable to the pair, never to one of the two. It is the first run on v0.8.20 (HOLDOUT P5): later v0.8.20
# candidates are graded against it, and the change is judged under section 7.2 only after three runs per arm.
#
# Seed 42 was chosen on development only, as section 6.5 requires: on heldout-dev-v0.8.18 under release
# requirements v10, seed 42 reads `country-AU` 0.989 against seed 43's 0.927 and `postal_unit` loss +0.100 against
# +0.046. No confirmation result entered the choice.
#
# Prediction, written 2026-11-18 before the corpus manifest exists, against the v8.7.0 seed 42 run on the v10
# development role (heldout-dev-v0.8.18@771811f7a5a8e4da and heldout-dev-v0.8.19-probes-r2@dd560a53b897dbca). The
# counts are rows of /mnt/mw/models/arms/v10/heldout-dev-v10-v870.json, given as 10.8.0 / v8.7.0 s42 / v8.7.0 s43:
# - US rows with a `subregion` span: 0 / 0 / 0 of 22 exact (21 `usgov-nad` rows such as
#   `usgov-nad:usgov-nad-d6fb27f9-2b58-4159-a0f9-8ad261b9dc95-da28595b3e75`, and
#   `invented-po-box-cedex:invented-po-box-cedex-c50bb464906b`). 17 of the 22 (16 NAD rows and the PO-box row) miss
#   one span and add one on every arm, the county span read under another tag. v8.8.0 gets at least 12 of those 17
#   exact. The 4 NAD rows that also lose a unit or a venue stay wrong.
# - `country-US` (s42 0.845): rises by 0.005 to 0.015, from those rows, and doesn't fall below 0.835.
# - US address rows without a `subregion` span: 1,278 / 1,316 / 1,321 of 1,478. v8.8.0 keeps at least 1,300. A
#   larger fall is read first on rows where v8.8.0 emits a `subregion` the key doesn't hold, the risk of point 3.
# - `po_box_cedex` (s42 minimum 0.881, loss +0.035): minimum at least 0.870, loss check passes. The
#   `invented-po-box-cedex` rows read 2,481 / 2,543 / 2,541 of 2,588, and v8.8.0 keeps at least 2,530. The PMB
#   street split doesn't move exact parse. Exact parse joins the street family under the `whole` convention.
# - `postal_unit` loss (s42 +0.100, s43 +0.046): stays positive and inside the seed range. No v0.8.20 change
#   touches its rows: the check leaves out rows with a `venue` span, and the `RESIDENCE` and `LOTISSEMENT` relabel
#   writes only such rows.
#   The rows read 737 / 839 / 784 of 1,017.
# - The two errors lane AD reported stay, because no v0.8.20 change targets them. AU address rows with a `region`
#   span read 1,019 / 1,391 / 1,229 of 1,717, AU address rows with a `unit` span 68 / 169 / 114 of 208, and FR
#   address rows with a `unit` span 15 / 17 / 15 of 156. v8.8.0 lands inside the seed range on the two AU cells
#   and at or under 25 of 156 on FR. `country-AU` stays at or above 0.927.
# - FR address rows with a `venue` span: 135 / 133 / 134 of 135. v8.8.0 keeps at least 132.
# - Objective (s42 +0.045 [0.024, 0.066]) and geocode loss (s42 +0.037): both pass on development, the objective at
#   or above +0.030.
# A result outside these ranges is attributed by country and row before anything else.
#
# Launch with `--fresh --device A100-40GB`: 90,000 steps. Each v8.7.0 run billed about $3.38, and this run should
# bill about the same, about 8% of the $40 Modal budget, of which about $7 is spent.
#
# The receipt preflight, CPU only, on a copy of this config re-rooted at /mnt/mw (the launcher runs it before it
# starts a sandbox):
#   node packages/mailwoman/tools/training/audits/epoch/mixture.run.ts \
#     --config packages/corpus/data/training-configs/v8.8.0-base-c6-90k-v0820-county-s42.yaml \
#     --json /mnt/mw/audits/epoch-mixture-v8.8.0-base-c6-90k-v0820-county-s42.json
#
# What a `pass` needs. `release/evaluate.ts` adds `the candidate artifact identity is unregistered` to every verdict
# while `identities.candidate.sha256` is null, as it is in v10, and reads insufficient evidence when a report's
# collections match no role's `evaluations.<role>.ids` exactly. With the v8.7.0 seed 42 graph's sha256 (3017222708…)
# written into a scratch copy of v10, its development report reads `pass` on all 16 checks (2026-11-18), so the
# evaluator can pass a candidate. For this run:
# - the confirmation successor is drawn, frozen and listed in evaluation-groups.v0.8.20.json before the v0.8.20
#   re-split, so this run never trains on it. A comparative check (objective, geocode, `po_box_cedex` and
#   `postal_unit` loss) admits `verified_unseen` rows only, unseen by 10.8.0 too, so the draw comes from rows
#   10.8.0's corpus v0.8.18-retention-overlay held out (2,777,356 val and 2,781,377 test rows), from sources added
#   after it, or from new NPPES records. A draw from rows 10.8.0 trained on reads insufficient on the objective;
# - evaluation-groups.v0.8.20.json keeps every group of evaluation-groups.v0.8.19.json, so the development role stays
#   unseen by this run;
# - a new specification version registers the exported int8 `model.onnx` sha256 as `identities.candidate.sha256`
#   and the successor as `evaluations.confirmation.ids`. V10 was read, so the record of v10 (section 1) makes that
#   a new version rather than an amendment.
#
# After training, in order:
# 1. Export the step-90,000 checkpoint with `trainer export-onnx`, quantize it with `trainer quantize`, and stage
#    the int8 graph with `dev-tools/stage-candidate-cache.run.ts --model <int8> --out <root> --copy`. Check that
#    its md5 differs from 10.8.0's e711a725a1b1fd5d959d6f27f17b911a and record its sha256.
# 2. Self-control: 10.8.0 staged through the same path differs on 0 board rows.
# 3. `heldout/dataset/overlap.run.ts --match-text` for each collection of both roles, over v0.8.20 and every corpus
#    10.8.0 trained on, to write this candidate's provenance files.
# 4. The four v10 reports: `heldout/per/country.run.ts --dataset <role's collections> --geocode` for development, then
#    `release/evaluate.run.ts` on it. Then the same pair for confirmation, read once, after the development choice
#    and under the specification that registers the candidate. The verdict is stated as given.
# 5. The regression board, read by address against 10.8.0 and against v8.7.0 seed 42, and the promotion battery
#    (`--spec v9.0.0-base`) against every declared floor.

