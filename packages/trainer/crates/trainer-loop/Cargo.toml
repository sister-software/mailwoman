[package]
name = "trainer-loop"
description = "The Mailwoman training loops in Rust: corpus-python's train/loop.py and train/pretrain.py with their callbacks, the optim/ parameter groups, schedules and Fisher capture, and checkpoints in safetensors, reading batches from mtf-sampler."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
tch.workspace = true
trainer-model = { path = "../trainer-model" }
mtf-core = { path = "../../../mtf/crates/mtf-core" }
mtf-channels = { path = "../../../mtf/crates/mtf-channels", features = ["finders"] }
mtf-sampler = { path = "../../../mtf/crates/mtf-sampler" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
sha2 = "0.10"
# `fisher-diag-v1.npz` is a deflated zip of `.npy` arrays, as `numpy.savez_compressed` writes it.
zip = { version = "9", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
