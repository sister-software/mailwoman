[package]
name = "trainer-loop"
description = "The Mailwoman training loops in Rust: the Python trainer's train/loop.py and train/pretrain.py with their callbacks, the optim/ parameter groups, schedules and Fisher capture, and checkpoints in safetensors, reading batches from mtf-sampler."
version.workspace = true
edition.workspace = true
license = "(AGPL-3.0-only OR LicenseRef-Commercial) AND Apache-2.0"
repository.workspace = true

[dependencies]
tch.workspace = true
trainer-model = { path = "../trainer-model" }
trainer-export = { path = "../trainer-export" }
mtf-core.workspace = true
mtf-channels = { workspace = true, features = ["finders"] }
mtf-sampler.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
sha2 = "0.10"
# `fisher-diag-v1.npz` is a deflated zip of `.npy` arrays, as `numpy.savez_compressed` writes it.
zip = { version = "9", default-features = false, features = ["deflate"] }
# The realized-draws stream is zstd-compressed JSON lines, which `spliterator` reads.
zstd = { version = "0.14", default-features = false }

[dev-dependencies]
tempfile = "3"
# `tests/alignment.rs` writes fixture corpora with `mtf-sampler`'s own test helper, which writes parquet through arrow.
arrow-array = "60"
parquet = { version = "60", default-features = false, features = ["arrow"] }
