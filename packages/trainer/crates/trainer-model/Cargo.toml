[package]
name = "trainer-model"
description = "The Mailwoman coarse encoder in Rust over libtorch: the modules, losses and checkpoint format of the Python trainer's nn/, with the same parameter names and the same operations."
version.workspace = true
edition.workspace = true
license = "(AGPL-3.0-only OR LicenseRef-Commercial) AND Apache-2.0"
repository.workspace = true

[dependencies]
tch.workspace = true
# A direct dependency so its `links = "tch"` metadata reaches build.rs as `DEP_TCH_LIBTORCH_LIB`.
torch-sys = "0.26.0"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
safetensors = "0.8"
# The channel names and their order.
mtf-channels.workspace = true
# Reads a `pytorch_model.bin` for the one-time conversion to safetensors.
trainer-export = { path = "../trainer-export" }

[build-dependencies]
# Compiles `csrc/autocast.cpp` against the libtorch headers `torch-sys` found, for the CPU and CUDA autocast state
# that `tch` does not expose.
cc = "1"

[dev-dependencies]
tempfile = "3"
