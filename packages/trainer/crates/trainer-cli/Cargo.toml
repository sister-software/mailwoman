[package]
name = "trainer-cli"
description = "The `trainer` command: Rust training runs from a resolved config, the checkpoint converter, and the staged comparison against the Python trainer's reference records."
version.workspace = true
edition.workspace = true
license = "(AGPL-3.0-only OR LicenseRef-Commercial) AND Apache-2.0"
repository.workspace = true

[[bin]]
name = "trainer"
path = "src/main.rs"

[features]
# The commercial trainer: `train` refuses unless a training grant admits the run. The trainer image for a commercial
# launch is built with it; a build without it is the open-source trainer.
commercial = []

[dependencies]
tch.workspace = true
trainer-model = { path = "../trainer-model" }
trainer-loop = { path = "../trainer-loop" }
product-license.workspace = true
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }

[dev-dependencies]
tempfile = "3"
