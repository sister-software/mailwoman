[package]
name = "trainer-cli"
description = "The `trainer` command: Rust training runs from a resolved config, the checkpoint converter, and the staged comparison against the Python trainer's reference records."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "trainer"
path = "src/main.rs"

[dependencies]
tch.workspace = true
trainer-model = { path = "../trainer-model" }
trainer-loop = { path = "../trainer-loop" }
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
