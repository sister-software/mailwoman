# yaml-language-server: $schema=https://raw.githubusercontent.com/codemod/codemod/refs/heads/main/schemas/workflow.json

version: "1"

nodes:
  - id: sync-fs-to-async
    name: Rewrite synchronous node:fs calls that stand inside async functions
    type: automatic
    steps:
      # TS and TSX are separate parsers, not one parser with a flag: TSX reads `<T>(x) => x` as a JSX element, and TS
      # reads a JSX element as a comparison. Running one over both extensions mis-parses whichever half it is not.
      - name: "TypeScript sources"
        js-ast-grep:
          js_file: scripts/codemod.ts
          language: "typescript"
          include:
            - "**/*.ts"
            - "**/*.mts"
            - "**/*.cts"
          exclude: &exclusions
            - "**/node_modules/**"
            - "**/out/**"
            - "**/dist/**"
            - "**/build/**"
            # The platform package IS the `node:fs` mirror. Its synchronous re-exports are the thing being redirected
            # away from, not a call site to redirect.
                      # This package's own fixtures assert the before-and-after, so rewriting them would make the tests pass by
            # deleting what they measure.
            - "codemods/**"

      - name: "TSX sources"
        js-ast-grep:
          js_file: scripts/codemod.ts
          language: "tsx"
          include:
            - "**/*.tsx"
          exclude: *exclusions
