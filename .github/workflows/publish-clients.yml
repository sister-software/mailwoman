# Generates the API clients once and publishes the same artifacts to PyPI and crates.io.
# The dispatch inputs can skip either registry, which makes a single-registry retry cheap.
#
# PyPI uses Trusted Publishing. Its publisher config is bound to this file name and the `pypi`
# environment, so renaming either one breaks publishing until PyPI is updated.
# crates.io reads the `CARGO_REGISTRY_TOKEN` secret from the `cargo` environment.
#
# The clients take their version from `mailwoman/package.json`. Dispatch this workflow after the
# npm release that the clients should match. Both registries reject a reused version, so a
# client-only fix waits for the next release. The shared `publish` concurrency group keeps this
# workflow from generating while an npm release is bumping the version.
name: Publish API clients

on:
  workflow_dispatch:
    inputs:
      publish_python:
        description: "Publish the Python client to PyPI (Trusted Publishing via the pypi environment)"
        required: false
        default: true
        type: boolean
      publish_cargo:
        description: "Publish the Rust client to crates.io (CARGO_REGISTRY_TOKEN from the cargo environment)"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  generate:
    timeout-minutes: 20
    runs-on:
      - self-hosted
      - Linux
      - X64
    steps:
      # Releases happen only on main, so the client version comes from main's package.json.
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - name: Generate + verify API clients
        uses: ./.github/actions/generate-clients

      - name: Upload Python client artifact
        uses: actions/upload-artifact@v7
        with:
          name: mailwoman-client-python
          path: clients-build/python/dist/*
          if-no-files-found: error

      - name: Upload Rust client artifact
        uses: actions/upload-artifact@v7
        with:
          name: mailwoman-client-rust
          path: clients-build/mailwoman-client-rust.tar.gz
          if-no-files-found: error

  pypi:
    if: ${{ inputs.publish_python }}
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # PyPI checks for this environment in the OIDC claims. The environment holds no secrets.
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          # Keep this pin equal to the uv version on the lab host.
          version: "0.11.16"

      - name: Download Python client artifact
        uses: actions/download-artifact@v8
        with:
          name: mailwoman-client-python
          path: dist

      # `--trusted-publishing always` fails the step if the OIDC exchange does not happen.
      - name: Publish to PyPI (Trusted Publishing)
        run: uv publish --trusted-publishing always dist/*

  cargo:
    if: ${{ inputs.publish_cargo }}
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: cargo
    steps:
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Download Rust client artifact
        uses: actions/download-artifact@v8
        with:
          name: mailwoman-client-rust

      - name: Extract crate
        run: tar xzf mailwoman-client-rust.tar.gz

      # The token check gives a clearer error than cargo's 401. `cargo publish` runs a verify
      # build of the extracted crate, which is why the job installs a Rust toolchain.
      - name: Publish to crates.io
        working-directory: rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: | # shell
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN is not resolvable — is it still set in the 'cargo' GitHub environment?"
            exit 1
          fi
          cargo publish
