# Builds and pushes the ghcr.io/sister-software/mailwoman container image.
#
# The Dockerfile installs the published @mailwoman/* packages from npm instead of building the
# monorepo, at the version the image is tagged with, through the MAILWOMAN_VERSION build argument.
# The image bakes in the model weights. The gazetteer is mounted as a volume at /data.
#
# publish.yml dispatches this workflow with the release version once npm serves the release, and a
# manual run takes the same explicit `tag` input. A GitHub release created with a personal token also
# triggers it and tags the image with the release version. The `latest` tag is skipped for prereleases.
#
# The image is linux/amd64 only because onnxruntime-node ships glibc x64 prebuilds.
# The job authenticates with the runtime GITHUB_TOKEN. That token needs packages:write.

name: Docker publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image version tag (e.g. 7.2.1). Also pushed as :latest."
        required: true
        type: string
  release:
    types: [published]

permissions:
  contents: read
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  IMAGE_NAME: ghcr.io/${{ github.repository }}

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-push:
    # A GitHub-hosted runner, because the build, login and push actions call `docker`, and the self-hosted
    # runners have Podman only.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The dispatch input wins. Otherwise the release tag is used without its leading "v".
      - name: Resolve version
        id: version
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ -n "$DISPATCH_TAG" ]; then
            value="$DISPATCH_TAG"
          else
            value="${RELEASE_TAG#v}"
          fi
          if [ -z "$value" ]; then
            echo "::error::couldn't resolve a version tag"
            exit 1
          fi
          echo "value=$value" >> "$GITHUB_OUTPUT"
          echo "Resolved image version: $value"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker metadata (labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.value }}
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_dispatch' || !github.event.release.prerelease }}
          labels: |
            org.opencontainers.image.title=mailwoman
            org.opencontainers.image.source=https://github.com/sister-software/mailwoman
            org.opencontainers.image.url=https://mailwoman.post
            org.opencontainers.image.documentation=https://mailwoman.post/docs
            org.opencontainers.image.licenses=AGPL-3.0-only OR LicenseRef-Commercial
            org.opencontainers.image.vendor=Sister Software
            org.opencontainers.image.version=${{ steps.version.outputs.value }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          # Docker media types, because Podman ignores the HEALTHCHECK an OCI-typed config records.
          outputs: type=registry,oci-mediatypes=false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The image installs the npm packages of the version it is tagged with.
          build-args: |
            MAILWOMAN_VERSION=${{ steps.version.outputs.value }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
