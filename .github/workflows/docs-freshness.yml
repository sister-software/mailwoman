# Lists docs pages whose `review-by:` frontmatter date has passed and files them in one open
# issue titled "Docs freshness sweep". A later run updates that issue instead of opening another.
# Pages without `review-by:` are skipped. The schedule runs on the 14th of January, April, July
# and October. The lister needs only Node built-ins, so the job skips the install.
name: Docs freshness sweep

on:
  schedule:
    - cron: "0 6 14 1,4,7,10 *"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

# Runs queue one at a time because two concurrent runs could each miss the other's issue and
# file a duplicate.
concurrency:
  group: docs-freshness
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  sweep:
    runs-on:
      - self-hosted
      - Linux
      - X64
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: List pages past review-by
        run: node docs/scripts/list-stale-docs.ts > sweep-body.md

      - name: Open or update the sweep issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -s sweep-body.md ]; then
            echo "No pages past review-by — nothing to file."
            exit 0
          fi
          existing=$(gh issue list --state open --search '"Docs freshness sweep" in:title' --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "Updating existing issue #$existing"
            gh issue edit "$existing" --body-file sweep-body.md
          else
            gh issue create --title "Docs freshness sweep" --body-file sweep-body.md
          fi
