# Builds the Docusaurus site at mailwoman.ai and deploys it to GitHub Pages from main.
#
# The Earth, Moon and Mars map apps deploy separately through deploy.yml. This site bundles the
# runtime embed, the explorers and license pages, and the OpenAPI and CLI references that the
# `prebuild` script generates. Model and gazetteer binaries load at runtime from the HF bucket.
name: Docs

on:
  # The path list holds the packages that docs sources import directly, plus the libpostal,
  # nominatim and photon packages whose CLIs generate the OpenAPI documents. Transitive
  # dependencies are left out because the docs closure covers nearly the whole monorepo.
  # Use workflow_dispatch to rebuild after a change outside these paths.
  #
  # The pull_request trigger has no `paths:` filter so that the required `build` check reports
  # on every PR. A skipped workflow would leave the check pending forever. The heavy steps check
  # the change-detection step below instead.
  workflow_dispatch: {}
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs-build.yml"
      - "packages/cartographer/**"
      - "packages/core/**"
      - "packages/license-worker/**"
      - "packages/mailwoman/**"
      - "packages/neural/**"
      - "packages/react/**"
      - "packages/resolver-wof-wasm/**"
      - "packages/spatial/**"
      # These packages feed the OpenAPI prebuild.
      - "packages/libpostal/**"
      - "packages/nominatim/**"
      - "packages/photon/**"
      - "*.md"

permissions:
  contents: read
  pull-requests: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # The onnxruntime-node postinstall fetches GPU binaries from a CDN that the lab runners cannot
  # always reach. CI uses the CPU libraries bundled in the npm tarball, so the download is skipped.
  ONNXRUNTIME_NODE_INSTALL: skip

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  # A newer build supersedes any older deploy, so cancelling a stale run is safe.
  cancel-in-progress: true

jobs:
  build:
    runs-on:
      - self-hosted
      - Linux
      - X64
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # On a pull request, the later steps run only when a path the site reads changed.
      # Push and dispatch runs skip this step and run everything.
      - name: Detect changes the site reads
        id: changes
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # paths-filter reads the changed files from the GitHub API. A local `git diff` would
          # fail because the shallow checkout has neither origin/main nor a merge base.
          filters: |
            docs:
              - "docs/**"
              - ".github/workflows/docs-build.yml"
              # The same list as the push paths above, measured the same way.
              - "packages/cartographer/**"
              - "packages/core/**"
              - "packages/license-worker/**"
              - "packages/mailwoman/**"
              - "packages/neural/**"
              - "packages/react/**"
              - "packages/resolver-wof-wasm/**"
              - "packages/spatial/**"
              - "packages/libpostal/**"
              - "packages/nominatim/**"
              - "packages/photon/**"
              - "*.md"

      - name: Setup Node
        if: github.event_name != 'pull_request' || steps.changes.outputs.docs == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          # The setup-node cache stays off because restores can hang on the lab runners.
          # The global Yarn cache in .yarnrc.yml already serves installs offline.

      # This check needs only Node built-ins, so it runs before the install. It checks
      # frontmatter, duplicate titles and orphan pages. `--strict` requires `role:` on every
      # published page. The docs workspace cannot declare type:module without breaking the
      # Docusaurus SSR bundle, so Node warns about sidebars.ts and the flag silences that warning.
      - name: Docs structure checks
        if: github.event_name != 'pull_request' || steps.changes.outputs.docs == 'true'
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON docs/scripts/check/docs-structure.ts --strict

      - name: Enable Corepack (yarn 4)
        if: github.event_name != 'pull_request' || steps.changes.outputs.docs == 'true'
        run: corepack enable

      - name: Install dependencies
        if: github.event_name != 'pull_request' || steps.changes.outputs.docs == 'true'
        run: yarn install --immutable

      # This step fails when a Vale rule stops firing on its fixtures or an ignore pattern changes.
      - name: Vale rule fixtures
        if: github.event_name != 'pull_request' || steps.changes.outputs.docs == 'true'
        run: node config/vale/check-rules.ts

      # Prose lint covers every tracked Markdown and MDX file under docs/, including unchanged files.
      - name: Prose lint
        if: github.event_name != 'pull_request' || steps.changes.outputs.docs == 'true'
        run: yarn workspace @mailwoman/docs lint:prose

      - name: Compile workspaces
        if: github.event_name != 'pull_request' || steps.changes.outputs.docs == 'true'
        run: yarn compile

      - name: Build docs
        if: github.event_name != 'pull_request' || steps.changes.outputs.docs == 'true'
        run: yarn workspace @mailwoman/docs build

      - name: Upload Pages artifact
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/build
          # The upload skips dot-directories by default. The license key register lives in
          # `.well-known/`, and `mailwoman license verify --online` fails without it.
          include-hidden-files: true

  deploy:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: build
    runs-on:
      - self-hosted
      - Linux
      - X64
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
