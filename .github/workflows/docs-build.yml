# Build + deploy the Docusaurus docs site.
#
# On pull_request: the build job runs on EVERY PR (so it can be a required status check), but the
# structure gate + build steps execute only when a demo-affecting path changed — otherwise the job
# reports green in seconds. Catches broken links, MDX parse errors, and — before any install —
# frontmatter/duplicate-title/orphan regressions via docs/scripts/check-docs-structure.ts.
# On push to main: same steps (path-filtered at the trigger), then deploy to GitHub Pages.
#
# Binary assets (model.onnx, tokenizer.model, fst-en-US.bin, wof-hot.db) are
# fetched at runtime from the HF Bucket (sister-software/mailwoman), NOT bundled
# into the static site. The demo-assets plugin still runs loadContent() to
# validate the model card, but binary staging is skipped in CI because the
# neural-weights-en-us package has no model files without link-dev-weights.ts.
name: Docs

on:
  # The demo BUNDLES these workspaces (neural-web pulls in the resolver), so a change to the
  # resolver must rebuild + redeploy the demo — otherwise a merged resolver fix sits on main while
  # the live demo serves the old bundle (which is exactly how the "New York → West New York" fix
  # almost shipped invisibly). workflow_dispatch is the manual escape hatch when a dependency
  # outside these paths changes.
  #
  # The pull_request trigger deliberately carries NO `paths:` filter, so the `build` job runs and
  # reports a check on EVERY PR — a prerequisite for making it a required status check in the
  # branch ruleset. A workflow-level `paths:` filter would leave PRs that touch none of these paths
  # with no check reported at all, which a required-check rule reads as "waiting forever" and the
  # PR can never merge. Instead the heavy steps are gated per-job below on a change-detection step;
  # an unaffected PR reports green in seconds. The `push` trigger keeps its `paths:` filter — deploy
  # should only fire when the built output can actually change.
  workflow_dispatch: {}
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "neural-web/**"
      # the docs webpack alias compiles neural/*.ts source inline (traceParse on /trace)
      - "neural/**"
      - "resolver-wof-wasm/**"
      - "resolver-wof-sqlite/**"
      - "resolver/**"
      - "core/**"
      - "spatial/**"
      - "codex/**"
      - "*.md"

permissions:
  contents: read
  pull-requests: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # onnxruntime-node's postinstall downloads OPTIONAL GPU-provider binaries from Microsoft's Akamai
  # CDN — the CPU libs the runners actually use are bundled in the npm tarball. That CDN edge is
  # intermittently unreachable from the lab runners (2026-07-28: three CI rounds died on it —
  # ETIMEDOUT IPv4 + ENETUNREACH IPv6). Skip the download entirely: deterministic installs, no GPU
  # inference on CI to miss it.
  ONNXRUNTIME_NODE_INSTALL: skip

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded runs on every trigger: only the latest head's build matters — a stale
  # Pages deploy would be overwritten by the newer one anyway, and the deploy job is
  # idempotent (deploy-pages redeploys whatever artifact the newer build uploads).
  cancel-in-progress: true

jobs:
  build:
    runs-on:
      - self-hosted
      - Linux
      - X64
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Change detection replaces the trigger-level `paths:` filter (see the `on:` comment). On a
      # pull_request, this computes whether any demo-affecting path changed; the heavy steps below
      # run only when it did. On push/workflow_dispatch the filter is skipped and the steps run
      # unconditionally (the push trigger already path-filtered the event, and dispatch is manual).
      # This keeps the job — and therefore its status check — reported on EVERY PR.
      - name: Detect demo-affecting changes
        id: changes
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          # dorny/paths-filter resolves the PR's base/head SHAs from the event payload via the
          # GitHub API, so it works correctly under actions/checkout's default shallow
          # (fetch-depth: 1) clone. A hand-rolled `git diff --name-only origin/main...` would not:
          # origin/main isn't fetched at all by a bare `actions/checkout@v7`, and even with a fetch
          # added, triple-dot diff needs a merge-base that a depth-1 clone doesn't have.
          filters: |
            docs:
              - "docs/**"
              - "neural-web/**"
              # the docs webpack alias compiles neural/*.ts source inline (traceParse on /trace)
              - "neural/**"
              - "resolver-wof-wasm/**"
              - "resolver-wof-sqlite/**"
              - "resolver/**"
              - "core/**"
              - "spatial/**"
              - "codex/**"
              - "*.md"

      - name: Setup Node
        if: github.event_name != 'pull_request' || steps.changes.outputs.docs == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          # actions-cache restore DISABLED (2026-07-29): the restore against GitHub's cache service
          # hangs through the lab's degraded path (multiple 20m job-budget deaths in Setup Node) and
          # is redundant — .yarnrc.yml's enableGlobalCache serves installs offline on the runners.

      # Fast structural gate (docs-architecture cleanup, Phase 4): frontmatter contract +
      # required fields, exact duplicate titles, orphan pages. Static parse over node built-ins
      # only — no install, no build — so a structural regression fails in seconds instead of
      # after the full Docusaurus build.
      #
      # --strict since the docs-reorg Task 5 skeleton cutover: the flag selects the six-role
      # frontmatter contract (docs/scripts/docs-frontmatter-contract.ts) and enforces `role:` on
      # EVERY published page, rather than the legacy seven-role vocabulary that only required one
      # on a manifest of entry pages. It was held off until the old tree left docs/articles/,
      # because that corpus predated the contract and failed the check wholesale. Voice and
      # section rules that the gate cannot see live in docs/engineering/writing-system.md.
      # (--disable-warning: sidebars.ts is format-ambiguous — the docs workspace can't carry
      # type:module without breaking the Docusaurus SSR bundle; see docs/scripts/package.json.)
      - name: Docs structure checks
        if: github.event_name != 'pull_request' || steps.changes.outputs.docs == 'true'
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON docs/scripts/check-docs-structure.ts --strict

      - name: Enable Corepack (yarn 4)
        if: github.event_name != 'pull_request' || steps.changes.outputs.docs == 'true'
        run: corepack enable

      - name: Install dependencies
        if: github.event_name != 'pull_request' || steps.changes.outputs.docs == 'true'
        run: yarn install --immutable

      # Fixture regression test for docs/styles/Mailwoman/*.yml (the Vale prose-lint rules): a rule
      # that stops firing, or a TokenIgnores/BlockIgnores change that starts leaking banned words
      # out of a code fence/import/JSX/`<details>` block, fails loudly here instead of silently
      # drifting. See docs/scripts/check-vale-rules.sh for what it checks.
      - name: Vale rule fixtures
        if: github.event_name != 'pull_request' || steps.changes.outputs.docs == 'true'
        run: docs/scripts/check-vale-rules.sh

      # Whole-corpus run — the nine-page seed site plus the writing system + templates under
      # docs/engineering (see lint:prose's targets in docs/package.json). Measured at head: 16
      # files, 0 alerts, sub-second, so there's no changed-files scoping to maintain.
      - name: Prose lint
        if: github.event_name != 'pull_request' || steps.changes.outputs.docs == 'true'
        run: yarn workspace @mailwoman/docs lint:prose

      - name: Compile workspaces
        if: github.event_name != 'pull_request' || steps.changes.outputs.docs == 'true'
        run: yarn compile

      - name: Build docs
        if: github.event_name != 'pull_request' || steps.changes.outputs.docs == 'true'
        run: yarn workspace @mailwoman/docs build

      - name: Upload Pages artifact
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/build

  deploy:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: build
    runs-on:
      - self-hosted
      - Linux
      - X64
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
