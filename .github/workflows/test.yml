# Run the test suite on PRs and pushes to main.
#
# What this catches: workspace breakage that local-only flows missed, such
# as the 2.0.0 release where `workspace:*` deps shipped to npm. A green
# test.yml is required before any PR can merge once branch protection is on.
#
# STRUCTURE — a `runner-select` bootstrap picks the fleet or a GitHub-hosted fallback (see its own
# header for why, and for what the fallback cannot cover), then five legs (static, unit-fast,
# unit-slow, react, smoke) fan out across the lab's self-hosted runner fleet (lab-1..lab-4, one job
# slot each), then the `test` aggregator gates on all five. unit-fast and unit-slow run the root Vitest sweep concurrently — fast leg
# is the pure unit/lexicon surface (~313 files, ~15s); slow leg is the DB-gated integration
# suites (CLI harness, WOF resolver, model-load tests, ~87 files, ~5 min).
# The aggregator job is named `test` ON PURPOSE: the "Production Integrity" ruleset's
# required status check matches the context `test`, and publish.yml's prepare phase
# auto-merges the release PR on that same check. Rename it and both break.
#
# PATH-GATING: the smoke leg validates the PACKAGING pipeline (see per-job comment), so a
# docs-only or data-only PR skips smoke entirely — the job reports green in seconds. The unit
# split into fast/slow means the fast leg reports in ~15s on a fleet slot that's released
# after the prefix (~75s); the slow leg (DB-gated suites) runs in parallel on another slot.
# Each leg repeats the checkout→install→compile prefix (~75s) rather than sharing a
# build artifact — the legs run concurrently on the same host, so the prefix costs
# wall-clock once, and artifact round-trips through GitHub's storage would cost more.
#
# workflow_dispatch exists for the PR-based release flow (publish.yml mode=prepare): PRs created
# with GITHUB_TOKEN never trigger `on: pull_request` (GitHub's anti-recursion rule), so the
# prepare job dispatches this workflow against the release branch explicitly — the `test` check
# run lands on the branch head SHA, which is what the "Production Integrity" ruleset's required
# status check matches on, letting the release PR auto-merge.
name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Opt into Node 24 for JavaScript-based actions (checkout, setup-node, etc.)
  # ahead of the forced switch in June 2026 / removal in Sep 2026.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # onnxruntime-node's postinstall downloads OPTIONAL GPU-provider binaries from Microsoft's Akamai
  # CDN — the CPU libs the runners actually use are bundled in the npm tarball. That CDN edge is
  # intermittently unreachable from the lab runners (2026-07-28: three CI rounds died on it —
  # ETIMEDOUT IPv4 + ENETUNREACH IPv6). Skip the download entirely: deterministic installs, no GPU
  # inference on CI to miss it.
  ONNXRUNTIME_NODE_INSTALL: skip

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded runs on PRs AND pushes to main: only the latest head's `test` check is
  # load-bearing (the ruleset + release auto-merge match on the branch HEAD sha), so an older
  # in-flight run is pure fleet burn — each leg occupies one of the 4 lab runner slots, and a
  # stale push's 4 legs queue AHEAD of the current push's. workflow_dispatch is EXEMPT: that's
  # publish.yml mode=prepare dispatching against the release branch — cancelling it when a
  # rerun lands would hang the release PR's auto-merge on a check that never reports.
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  # Pick the fleet, or fall back to GitHub-hosted when it is down.
  #
  # GitHub Actions has no native fallback: a job whose labels match a REGISTERED but OFFLINE runner
  # queues (up to 24h) rather than failing, so shutting the lab fleet down silently blocks every
  # merge — branch protection wants a green `test`, and `test` had nowhere to run. That happened
  # 2026-08-02. This job is the escape from it: it runs on ubuntu-latest (always available, and free
  # on a public repo), decides which labels the other jobs get, and hands them over as an output.
  #
  # WHAT FALLBACK CAN AND CANNOT BUY. Three legs are runner-agnostic and run identically anywhere:
  # static (lint + typecheck), unit-fast (no model, no DB by construction), react (browser mode —
  # GitHub-hosted even allows the `--with-deps` path the lab runners can't sudo). The other two are
  # NOT portable and no amount of caching makes them so: unit-slow's WOF suites and the geocode CLI
  # tests read $MAILWOMAN_DATA_ROOT/wof, which is 118 GB — three orders of magnitude past a
  # GitHub-hosted runner's 14 GB disk and the 10 GB repo cache limit. Those suites are written with
  # `describe.skipIf(!HAS_WOF)`, so on a hosted runner they would SKIP, and the leg would go green
  # having tested a fraction of what its name claims. A gate that silently means less while
  # reporting the same is worse than one that is honestly unavailable, so the degraded path skips
  # them EXPLICITLY and says so, loudly, in the job summary and an annotation.
  #
  # Releases do not get this. publish.yml stays pinned to the fleet on purpose: a release must be
  # cut against the full gate, and it also wants the host anyway.
  #
  # Resolution order — first match wins:
  #   1. `vars.RUNNER_LABELS` (a repo variable, JSON array) — the manual override. Set it to
  #      `["ubuntu-latest"]` to force the hosted path, or unset it to go back to automatic.
  #   2. The runners API, if `secrets.RUNNER_PROBE_TOKEN` is set (a PAT with `administration: read`
  #      — GITHUB_TOKEN cannot list self-hosted runners, there is no such permission scope).
  #   3. The fleet. Every failure mode lands here: no token, a fork PR with no secrets, a 500 from
  #      the API. Fail CLOSED — an unreachable probe must never silently downgrade the gate.
  runner-select:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      labels: ${{ steps.pick.outputs.labels }}
      degraded: ${{ steps.pick.outputs.degraded }}
    steps:
      - name: Pick a runner
        id: pick
        env:
          OVERRIDE: ${{ vars.RUNNER_LABELS }}
          PROBE_TOKEN: ${{ secrets.RUNNER_PROBE_TOKEN }}
          FLEET: '["self-hosted","Linux","X64"]'
        run: |
          emit() {
            echo "labels=$1" >> "$GITHUB_OUTPUT"
            echo "degraded=$2" >> "$GITHUB_OUTPUT"
            echo "runner: $1 (degraded=$2)" >> "$GITHUB_STEP_SUMMARY"
          }

          if [ -n "${OVERRIDE:-}" ]; then
            echo "::notice::vars.RUNNER_LABELS is set — using it verbatim: ${OVERRIDE}"
            if [ "$OVERRIDE" = "$FLEET" ]; then emit "$OVERRIDE" false; else emit "$OVERRIDE" true; fi
            exit 0
          fi

          if [ -z "${PROBE_TOKEN:-}" ]; then
            echo "::notice::no RUNNER_PROBE_TOKEN (unset, or a fork PR) — assuming the fleet is up"
            emit "$FLEET" false
            exit 0
          fi

          # The `.runners | type == "array"` test is load-bearing, not defensive noise. Every API
          # failure — bad credentials, 403, 404 — returns a JSON OBJECT with a `message` and no
          # `runners` key, so a tolerant expression like `.runners // []` counts it as ZERO ONLINE
          # RUNNERS and reports the fleet down. A count of zero cannot tell "nothing is online" from
          # "nobody answered the question"; only the shape of the response can. Anything that is not
          # an array yields a non-numeric sentinel, which the guard below turns into fail-closed.
          online=$(curl -sS --max-time 30 \
            -H "Authorization: Bearer ${PROBE_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runners" \
            | jq -r 'if (.runners | type) == "array"
                     then ([.runners[]
                            | select(.status == "online")
                            | select([.labels[].name] | index("self-hosted"))] | length)
                     else "unanswered: " + ((.message // "unrecognized response") | tostring)
                     end' 2>/dev/null) || online=""

          # Anything that is not a plain integer — an empty body, `null`, an API error object — is a
          # probe that did not answer, not a fleet that is down. Fail closed.
          if ! [[ "$online" =~ ^[0-9]+$ ]]; then
            echo "::warning::could not read the runners API (got '${online}') — assuming the fleet is up (failing closed to the full gate)"
            emit "$FLEET" false
          elif [ "$online" -gt 0 ]; then
            echo "::notice::${online} self-hosted runner(s) online"
            emit "$FLEET" false
          else
            echo "::warning::the self-hosted fleet is OFFLINE — falling back to GitHub-hosted runners. unit-slow's DB-gated suites and the packaging smoke CANNOT run there (the WOF data root is 118 GB) and will be SKIPPED, not silently passed. Do not cut a release off this run."
            emit '["ubuntu-latest"]' true
          fi

  # Lint + typechecks. `typecheck:scripts` and the docs typecheck need the workspace
  # .d.ts under each `out/`, hence Compile before them.
  static:
    needs: runner-select
    runs-on: ${{ fromJSON(needs.runner-select.outputs.labels) }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          # actions-cache restore DISABLED (2026-07-29): the restore against GitHub's cache service
          # hangs through the lab's degraded path (multiple 20m job-budget deaths in Setup Node) and
          # is redundant — .yarnrc.yml's enableGlobalCache serves installs offline on the runners.

      - name: Enable Corepack (yarn 4)
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Compile
        run: yarn compile

      # Type-check the toolshed. `scripts/` is in no build project (compile = `tsc -b` over the
      # workspaces only), so it was the one untyped corner where drift accumulated. This leaf
      # project (scripts/tsconfig.json, noEmit) keeps it honest. Runs after Compile so the
      # workspace .d.ts under each `out/` exist for `@mailwoman/*` resolution.
      - name: Typecheck scripts
        run: yarn typecheck:scripts

      # Test files are excluded from every build project on purpose — the build emits what it includes,
      # and an included test lands in `out/` and then in the tarball. That `exclude` suppressed the emit
      # AND the checking, so until this step tests were compiled by vitest's esbuild transform, which
      # strips types without looking at them. Each workspace's tsconfig.test.json is the non-emitting
      # half. Runs after Compile for the same .d.ts reason as the step above.
      - name: Typecheck tests
        run: yarn typecheck:tests

      # docs/ is a Docusaurus app, so it is not in `tsc -b` — which meant nothing checked it. Three real
      # bugs were sitting there when this step was added: a ReferenceError in a React state updater, a
      # shorthand property key renamed out from under its consumer, and a timer ref typed for the wrong
      # runtime. Same gap as the test files, one workspace over.
      - name: Typecheck docs
        run: yarn typecheck:docs

      # lint:python runs ruff via uvx — the runner image doesn't ship uv (bit 9ce83b40's push:
      # "command not found: uvx", exit 127).
      - name: Setup uv (ruff for lint:python)
        uses: astral-sh/setup-uv@v7
        with:
          # Pinned to the lab host's uv (keep in lockstep — bump deliberately, not via "latest";
          # silences setup-uv's could-not-determine-version fallback warning).
          version: "0.11.16"

      # Full repo-wide lint (oxlint incl. sister-software/no-process-globals, oxfmt --check, python
      # toolchain checks). This is THE complete gate: the pre-commit hook only lints STAGED files,
      # so repo-wide drift and --no-verify commits are caught here.
      - name: Lint
        run: yarn lint

      # The docs app ships real runtime code (the /demo page). Its typecheck sat outside CI and
      # went 7-errors red on main unnoticed — one of those errors was the LIVE demo's undefined
      # baseUrl paths (#917, broken in production since v5.0.0). This step is that bug's class fix.
      - name: Typecheck docs
        run: yarn workspace @mailwoman/docs typecheck

  # The root Vitest sweep, split into two legs that run concurrently.
  # unit-fast: every test file that does NOT load the model, hit a WOF DB, or invoke the CLI
  #   harness — the pure unit/lexicon surface (~313 files). Finishes in ~15s.
  # unit-slow: the DB-gated integration suites (mailwoman CLI harness, resolver-wof-sqlite WOF
  #   tests, neural/test model-load tests, evidence-lexicons build). ~87 files, ~5 min floor.
  #
  # The split exploits the fleet slot freed when smoke is path-gated; without it the unit leg
  # is the PR's long pole at ~7 min. Running both in parallel cuts it to max(slow, ~15s) ≈ 5 min.
  unit-fast:
    needs: runner-select
    runs-on: ${{ fromJSON(needs.runner-select.outputs.labels) }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          # actions-cache restore DISABLED (2026-07-29): the restore against GitHub's cache service
          # hangs through the lab's degraded path (multiple 20m job-budget deaths in Setup Node) and
          # is redundant — .yarnrc.yml's enableGlobalCache serves installs offline on the runners.

      - name: Enable Corepack (yarn 4)
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Compile
        run: yarn compile

      # No weights materialization — this leg excludes every suite that loads the model or
      # hits a WOF DB (neural/test/**, mailwoman/test/**, resolver-wof-sqlite/**,
      # evidence-lexicons, geocode CLI). The 313-file sweep finishes in ~15s; suite-only
      # failures surface before the slow leg finishes.
      - name: Test (fast)
        run: yarn ci:test:fast

  # The DB-gated half of the Vitest sweep — everything excluded from unit-fast. Runs in
  # parallel with unit-fast on a separate runner slot; the aggregator gates on both.
  # NOT PORTABLE — job-skipped when the fleet is down (see the runner-select header). Its suites read
  # the 118 GB WOF data root and are written with `describe.skipIf(!HAS_WOF)`, so on a hosted runner
  # they would skipIf their way to a green tick. A job that reports `skipped` is legible in the UI;
  # a job that reports `success` having tested nothing is not.
  unit-slow:
    needs: runner-select
    if: needs.runner-select.outputs.degraded != 'true'
    runs-on: ${{ fromJSON(needs.runner-select.outputs.labels) }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          # actions-cache restore DISABLED (2026-07-29) — see static leg comment for rationale.

      - name: Enable Corepack (yarn 4)
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Compile
        run: yarn compile

      - name: Restore weights cache (model + soft-feed siblings)
        id: weights-cache
        uses: actions/cache@v6
        with:
          path: |
            neural-weights-*/model.onnx
            neural-weights-*/tokenizer.model
            neural-weights-*/postcode-*.bin
            neural-weights-*/pair-index-*.bin
            neural-weights-*/anchor-lexicon-v1.json
            neural-weights-*/country-surface-lexicon-v1.json
          # The key hashes every input the artifacts are DERIVED from, not just their config. It used to hash
          # release.config.json + data/gazetteer/*.json only, which missed the EXTRACTOR — so the 2026-08-02
          # currency-filter change produced new artifacts while the cache happily served the old ones, and the
          # pair-index↔card parity guard failed with `expected 47878 to be 49033`. A cache key that omits the code
          # generating the cached thing is a stale-artifact machine.
          key: weights-${{ hashFiles('release.config.json', 'data/gazetteer/*.json', 'data/gazetteer/*.jsonl', 'mailwoman/gazetteer-pipeline/borough-pairs.ts', 'mailwoman/gazetteer-pipeline/lieudit-pairs.ts', 'mailwoman/commands/gazetteer/pair-index.tsx') }}

      - name: Materialize weights (cache miss — ~5 min, once per release.config change)
        if: steps.weights-cache.outputs.cache-hit != 'true'
        run: node scripts/copy-weights.ts

      - name: Symlink base-latn model (cache miss — en-us already materialized)
        if: steps.weights-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p neural-weights-base-latn
          for f in model.onnx tokenizer.model model-card.json calibration.json calibration-per-locale.json anchor-lexicon-v1.json country-surface-lexicon-v1.json; do
            [ -f "neural-weights-base-latn/$f" ] || ln -sf "../neural-weights-en-us/$f" "neural-weights-base-latn/$f"
          done

      - name: Test (slow)
        run: yarn ci:test:slow

  # @mailwoman/react's suites are Vitest browser mode (playwright/chromium) and are excluded
  # from the root sweep — importing vitest/browser under the forks pool is a hard error
  # (the failure class that turned Test red from #1215 until this leg existed). This leg is
  # their only CI coverage; if it's removed, the react package ships untested.
  react:
    needs: runner-select
    runs-on: ${{ fromJSON(needs.runner-select.outputs.labels) }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          # actions-cache restore DISABLED (2026-07-29): the restore against GitHub's cache service
          # hangs through the lab's degraded path (multiple 20m job-budget deaths in Setup Node) and
          # is redundant — .yarnrc.yml's enableGlobalCache serves installs offline on the runners.

      - name: Enable Corepack (yarn 4)
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Compile
        run: yarn compile

      # No --with-deps on the fleet: that path sudo-installs apt packages and the lab runners have no
      # passwordless sudo. The chromium system libs are provisioned on the host once
      # (`playwright install-deps chromium`, operator sudo); this step only fetches the browser build
      # into ~/.cache/ms-playwright, shared across all runner instances. A GitHub-hosted fallback
      # runner is a fresh image with sudo and no libs, so there it DOES need --with-deps.
      - name: Install Playwright chromium (react browser tests)
        run: |
          if [ "${{ needs.runner-select.outputs.degraded }}" = "true" ]; then
            yarn workspace @mailwoman/react exec playwright install --with-deps chromium
          else
            yarn workspace @mailwoman/react exec playwright install chromium
          fi

      - name: Test react (browser mode)
        run: yarn workspace @mailwoman/react test:browser

  # Packs every published workspace + installs the tarballs into a throwaway project (no monorepo
  # hoisting) + runs the compiled CLI. Catches the class of bug that shipped in v4.8.0: an
  # undeclared runtime dep, an unshipped file, or a command module with an eager top-level side
  # effect — all invisible in-repo, all fatal to a fresh `npm install`.
  #
  # PATH-GATED on pull_request: the smoke test validates the PACKAGING pipeline, so changes to
  # docs, root *.md, data/, .github/, or any workspace NOT packed by smoke-clean-install.ts
  # (osm, tile-worker, resolver-wof-wasm, neural-web) can't affect it. On a docs-only or
  # data-only PR the heavy steps are skipped → green in seconds. On push to main, workflow_dispatch
  # (release flow), and any PR that TOUCHES a smoke-relevant path, every step runs.
  # NOT PORTABLE — job-skipped when the fleet is down, for the same reason as unit-slow but a
  # sharper one: smoke packs the weights workspaces, `copy-weights.ts` materializes them from the
  # data root, and `yarn pack` quietly packs whatever subset of the `files` globs exists. Without
  # the host it would pack payload-free tarballs and install them happily — the exact failure that
  # published neural-weights-en-in@8.6.0 empty.
  smoke:
    needs: runner-select
    if: needs.runner-select.outputs.degraded != 'true'
    runs-on: ${{ fromJSON(needs.runner-select.outputs.labels) }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      # Change detection replaces a trigger-level `paths:` filter (the docs-build precedent).
      # On pull_request, the heavy steps run only when a path in the filter list changed —
      # otherwise the job reports green in seconds (checkout + this step). The list mirrors the
      # WORKSPACES dict in smoke-clean-install.ts — keep the two in sync.
      - name: Detect smoke-affecting changes
        id: changes
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          filters: |
            smoke:
              # --- Published workspace source (WORKSPACES dict in smoke-clean-install.ts) ---
              - 'core/**'
              - 'spatial/**'
              - 'resolver/**'
              - 'resolver-wof-sqlite/**'
              - 'ban/**'
              - 'codex/**'
              - 'poi-taxonomy/**'
              - 'kind-classifier/**'
              - 'react/**'
              - 'locale-gate/**'
              - 'normalize/**'
              - 'phrase-grouper/**'
              - 'query-shape/**'
              - 'sentencepiece-wasm/**'
              - 'neural/**'
              - 'neural-weights-en-us/**'
              - 'neural-weights-fr-fr/**'
              - 'neural-weights-en-gb/**'
              - 'neural-weights-en-nz/**'
              - 'variant-aliases/**'
              - 'tiger/**'
              - 'formatter/**'
              - 'record/**'
              - 'match/**'
              - 'registry/**'
              - 'address-id/**'
              - 'corpus/**'
              - 'mailwoman/**'
              - 'annotations/**'
              - 'timezone-lookup/**'
              - 'un-locode-lookup/**'
              - 'nuts-lookup/**'
              - 'api-kit/**'
              - 'api/**'
              - 'libpostal/**'
              - 'photon/**'
              - 'nominatim/**'
              - 'fastify/**'
              - 'mcp/**'
              - 'bdc/**'
              - 'filer/**'
              # --- Smoke script + packaging pipeline ---
              - 'scripts/smoke-clean-install.ts'
              - 'scripts/pack-workspace.ts'
              # --- Root config that affects packaging ---
              - 'package.json'
              - 'tsconfig.json'
              - 'tsconfig.base.json'
              - 'release.config.json'
              - 'yarn.lock'
              - '.nvmrc'
              - '.yarnrc.yml'

      - name: Setup Node
        if: github.event_name != 'pull_request' || steps.changes.outputs.smoke == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          # actions-cache restore DISABLED (2026-07-29): the restore against GitHub's cache service
          # hangs through the lab's degraded path (multiple 20m job-budget deaths in Setup Node) and
          # is redundant — .yarnrc.yml's enableGlobalCache serves installs offline on the runners.

      - name: Enable Corepack (yarn 4)
        if: github.event_name != 'pull_request' || steps.changes.outputs.smoke == 'true'
        run: corepack enable

      - name: Install dependencies
        if: github.event_name != 'pull_request' || steps.changes.outputs.smoke == 'true'
        run: yarn install --immutable

      - name: Compile
        if: github.event_name != 'pull_request' || steps.changes.outputs.smoke == 'true'
        run: yarn compile

      # Same cache as the unit leg (same key → shared entry). Smoke packs the weights workspaces
      # into the throwaway install (see WORKSPACES in smoke-clean-install.ts): photon/nominatim/
      # fastify declare @mailwoman/neural-weights-en-us as a real dep, so on a version-bumped
      # release branch npm would otherwise chase the not-yet-published registry version (ETARGET —
      # the chicken-and-egg that blocked the v7.6.0 release PR). `yarn pack` quietly packs whatever
      # subset of the `files` globs exists, so the binaries MUST be present before packing.
      - name: Restore weights cache (model + soft-feed siblings)
        if: github.event_name != 'pull_request' || steps.changes.outputs.smoke == 'true'
        id: weights-cache
        uses: actions/cache@v6
        with:
          path: |
            neural-weights-*/model.onnx
            neural-weights-*/tokenizer.model
            neural-weights-*/postcode-*.bin
            neural-weights-*/pair-index-*.bin
            neural-weights-*/anchor-lexicon-v1.json
            neural-weights-*/country-surface-lexicon-v1.json
          key: weights-${{ hashFiles('release.config.json', 'data/gazetteer/*.json', 'data/gazetteer/*.jsonl', 'mailwoman/gazetteer-pipeline/borough-pairs.ts', 'mailwoman/gazetteer-pipeline/lieudit-pairs.ts', 'mailwoman/commands/gazetteer/pair-index.tsx') }}

      - name: Materialize weights (cache miss — ~5 min, once per release.config change)
        if: (github.event_name != 'pull_request' || steps.changes.outputs.smoke == 'true') && steps.weights-cache.outputs.cache-hit != 'true'
        run: node scripts/copy-weights.ts

      - name: Symlink base-latn model (cache miss — en-us already materialized)
        if: (github.event_name != 'pull_request' || steps.changes.outputs.smoke == 'true') && steps.weights-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p neural-weights-base-latn
          for f in model.onnx tokenizer.model model-card.json calibration.json calibration-per-locale.json anchor-lexicon-v1.json country-surface-lexicon-v1.json; do
            [ -f "neural-weights-base-latn/$f" ] || ln -sf "../neural-weights-en-us/$f" "neural-weights-base-latn/$f"
          done

      - name: Clean-install smoke test
        if: github.event_name != 'pull_request' || steps.changes.outputs.smoke == 'true'
        run: yarn ci:smoke

  # Aggregator — the ONLY check the ruleset + release auto-merge look at (context `test`).
  # `if: always()` so it reports on leg failure instead of being skipped (a skipped required
  # check reads as "waiting forever" and blocks merges silently).
  test:
    needs: [runner-select, static, unit-fast, unit-slow, react, smoke]
    if: always()
    # Always hosted: this job only reads its `needs`, so pinning it to the fleet would make the
    # aggregator itself unrunnable in exactly the situation the fallback exists for.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # A `skipped` leg normally means something went wrong upstream, so it stays a failure — EXCEPT
      # on the degraded path, where unit-slow and smoke skip by design because the host they need is
      # gone. That exemption is the price of being able to merge at all with the fleet down, and it
      # is narrow: failure and cancellation are still fatal, and the run says plainly what it did
      # not cover.
      - name: Fail if any leg failed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || (needs.runner-select.outputs.degraded != 'true' && contains(needs.*.result, 'skipped')) }}
        run: |
          echo "::error::a test leg did not succeed: ${{ toJSON(needs.*.result) }}"
          exit 1

      - name: Green, but on GitHub-hosted runners
        if: ${{ needs.runner-select.outputs.degraded == 'true' }}
        run: |
          echo "::warning title=DEGRADED GATE::static, unit-fast and react passed on GitHub-hosted runners. unit-slow and smoke were SKIPPED — they need the 118 GB WOF data root and the materialized weights, neither of which exists off the lab fleet. This run did NOT exercise the WOF resolver, the CLI harness, model loading, geocode, or the packaging pipeline. Do not cut a release off it."
          {
            echo "## test: GREEN (degraded)"
            echo ""
            echo "| leg | result |"
            echo "| --- | --- |"
            echo "| static | ${{ needs.static.result }} |"
            echo "| unit-fast | ${{ needs.unit-fast.result }} |"
            echo "| unit-slow | ${{ needs.unit-slow.result }} — needs the fleet |"
            echo "| react | ${{ needs.react.result }} |"
            echo "| smoke | ${{ needs.smoke.result }} — needs the fleet |"
            echo ""
            echo "Bring the fleet back and re-run before releasing."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: All legs green
        if: ${{ needs.runner-select.outputs.degraded != 'true' }}
        run: echo "static, unit, react, smoke — all green"
