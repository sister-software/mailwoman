# Deploy the license worker to one Wrangler environment, by hand. Nothing here runs on push: a worker that mints
# commercial licenses moves only when an operator says so, and `ISSUANCE_ENABLED` is a separate switch on top of
# the deploy. The two GitHub environments hold one Cloudflare token each, so a sandbox deploy can never reach the
# production account, and production can require a reviewer.
#
# Migrations are a separate input rather than a step that always runs: `wrangler d1 migrations apply` is a write to
# the customer ledger, and a redeploy that changes no schema has no reason to touch it.
name: license-worker

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Wrangler environment"
        required: true
        type: choice
        options: [sandbox, production]
      migrate:
        description: "Apply D1 migrations before deploying"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: license-worker-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: license-worker-${{ inputs.environment }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Enable Corepack (yarn 4)
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      # The worker imports `@mailwoman/core` through its `default` export condition, which names `out/`.
      - name: Compile
        run: yarn compile

      - name: Test license worker (Workers pool)
        run: yarn test:license-worker

      # The bundle must carry no Node builtin: the worker runs without `nodejs_compat`, and a `node:` import
      # would deploy and then fail on the first request that reached it. It must carry no secret either: a
      # private key or a Stripe key belongs in a Wrangler secret binding, and one that reached the bundle was
      # committed or inlined. Source maps carry the same text, so they must not be uploaded.
      - name: Dry-run bundle and refuse a Node builtin, a secret, or a source-map upload
        run: |
          yarn workspace @mailwoman/license-worker wrangler deploy --env "${{ inputs.environment }}" --dry-run --outdir "$RUNNER_TEMP/license-worker"
          bundle="$RUNNER_TEMP/license-worker/index.js"
          if grep -q '"node:' "$bundle"; then
            echo "the bundle imports a Node builtin:" >&2
            grep -o '"node:[a-z_/]*"' "$bundle" | sort -u >&2
            exit 1
          fi
          if grep -Eq 'BEGIN (EC |RSA )?PRIVATE KEY|sk_(test|live)_[A-Za-z0-9]{8}|rk_(test|live)_[A-Za-z0-9]{8}|whsec_[A-Za-z0-9]{8}' "$bundle"; then
            echo "the bundle carries key material; it belongs in a secret binding" >&2
            exit 1
          fi
          if grep -Eq '^\s*upload_source_maps\s*=\s*true' packages/license-worker/wrangler.toml; then
            echo "wrangler.toml uploads source maps; the worker's source is not for the dashboard" >&2
            exit 1
          fi

      - name: Apply D1 migrations
        if: ${{ inputs.migrate }}
        run: yarn workspace @mailwoman/license-worker wrangler d1 migrations apply LICENSE_LEDGER --env "${{ inputs.environment }}" --remote

      - name: Deploy
        run: yarn workspace @mailwoman/license-worker wrangler deploy --env "${{ inputs.environment }}"
