# Manual-dispatch publish workflow with npm Trusted Publishing — PR-BASED, two-phase.
#
# WHY TWO PHASES (2026-07-23): the "Production Integrity" ruleset on `main` requires every change
# to arrive via a PR with a green `test` check — which rejects the old release-it direct push
# (GH013; see the night-2 postmortem, docs/articles/evals/2026-07-23-night-2-postmortem.md). The
# release therefore splits at the merge boundary:
#
#   PHASE 1 — mode=prepare (dispatch with a version): bump every workspace manifest on a
#   `release/v<version>` branch (scripts/prepare-release-version.ts — no git side effects of its
#   own), open the release PR, dispatch the Test workflow against the branch (required because
#   GITHUB_TOKEN-created PRs never trigger `on: pull_request` workflows — GitHub's anti-recursion
#   rule), and enable auto-merge. The PR merges itself the moment `test` goes green; no human click
#   is required, so a solo night shift can still release end-to-end.
#
#   PHASE 2 — mode=publish (dispatch AFTER the release PR has merged): tag the merged commit,
#   create the GitHub release, fetch the weight binaries from Hugging Face, and publish every
#   workspace via OIDC. Idempotent by construction (--tolerate-republish; tag/release creation
#   skipped when they already exist), so re-dispatching after a partial failure is always safe —
#   this same mode IS the recovery path (the old publish_only input).
#
# Auth: npm Trusted Publishing (OIDC). No NPM_TOKEN secret needed in this workflow — npmjs.com is
# configured to accept publishes from this exact workflow file (path:
# .github/workflows/publish.yml). The `id-token: write` permission on the publish job is what lets
# GitHub Actions mint the OIDC token npm verifies against.
#
# Publishes ALL packages — code AND the neural-weights-* — entirely from CI via OIDC, so no npm
# credentials live anywhere. The weights workspaces ship real model.onnx + tokenizer.model
# binaries; the "Materialize weight artifacts from Hugging Face" step pulls them from the PUBLIC HF
# bucket (the same files the demo loads, no auth) before publish. Prerequisite for a real publish
# run: the model for the card version must already be staged on HF — push it with `mailwoman release
# hf` (HF token, run on the operator's host) first.
#
# THE ARTIFACT RECIPE IS NOT IN THIS FILE (#1894). Materialization lives in
# scripts/fetch-hf-weights.ts and the tarball audit in scripts/verify-tarball.ts; this workflow
# orchestrates them, and `yarn release:preflight --source hf` runs the same two locally with no
# dispatch. Every path that was a hand-maintained list of shell copies here went stale at least once
# — most recently at the workspace regroup, which cost the v9.2.0 cut three of its four dispatches.
#
# A `clients` job runs after `publish` succeeds: it regenerates the Python + Rust API clients as
# workflow artifacts — inspection copies only. This workflow NEVER publishes clients: registry
# publishing lives in publish-python.yml (PyPI Trusted Publishing) and publish-cargo.yml,
# dispatched separately by the operator. See RELEASING.md "Client packages".
name: NPM Publish

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "prepare = bump versions + open the auto-merging release PR. publish = tag + npm-publish the ALREADY-MERGED release commit on main (also the partial-failure recovery path)."
        required: true
        default: prepare
        type: choice
        options:
          - prepare
          - publish
      version:
        description: "prepare only: version bump (patch / minor / major / specific semver like 2.1.0)"
        required: false
        default: patch
        type: string
      dry_run:
        description: "Dry run — show what would happen, don't push/publish anything"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  # Opt into Node 24 for JavaScript-based actions (checkout, setup-node, etc.)
  # ahead of the forced switch in June 2026 / removal in Sep 2026.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # onnxruntime-node's postinstall downloads OPTIONAL GPU-provider binaries from Microsoft's Akamai
  # CDN — the CPU libs the runners actually use are bundled in the npm tarball. That CDN edge is
  # intermittently unreachable from the lab runners (2026-07-28: three CI rounds died on it —
  # ETIMEDOUT IPv4 + ENETUNREACH IPv6). Skip the download entirely: deterministic installs, no GPU
  # inference on CI to miss it.
  ONNXRUNTIME_NODE_INSTALL: skip

# Serialize publish runs. Don't cancel an in-flight run — a prepare may be mid-push and a publish
# may be mid-tarball; killing either leaves a partial state a human then has to unwind.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  # PHASE 1 — version bump on a release branch + auto-merging PR. No npm, no tags, no HF.
  prepare:
    if: ${{ inputs.mode == 'prepare' }}
    runs-on:
      - self-hosted
      - Linux
      - X64
    timeout-minutes: 15
    permissions:
      contents: write # push the release/v<version> branch
      pull-requests: write # open the release PR + enable auto-merge
      actions: write # dispatch the Test workflow against the release branch
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          # actions-cache restore DISABLED (2026-07-29): the restore against GitHub's cache service
          # hangs through the lab's degraded path (multiple 20m job-budget deaths in Setup Node) and
          # is redundant — .yarnrc.yml's enableGlobalCache serves installs offline on the runners.

      - name: Enable Corepack (yarn 4)
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      # Fail fast if the SHIPPED MODEL's metadata hasn't propagated to the human-facing surfaces
      # (ledger / releases.mdx / status.mdx — the 6.4.0 gap). Keys off the MODEL version in
      # packages/neural-weights-en-us/model-card.json, so a code-only release passes cleanly. Runs on dry
      # runs too — the dry run is the operator's last look before the real dispatch.
      - name: Verify release metadata is propagated
        run: node scripts/verify-release-metadata.ts

      - name: Resolve + bump versions
        id: bump
        run: | # shell
          set -euo pipefail
          OUT=$(node scripts/prepare-release-version.ts --version "${{ inputs.version }}")
          echo "${OUT}"
          VERSION=$(echo "${OUT}" | grep -oP '(?<=^RESOLVED_VERSION=).+')
          # Collision guards — the version must be new to both git and npm.
          if git tag -l "v${VERSION}" | grep -q .; then
            echo "::error::tag v${VERSION} already exists — pick a different version"; exit 1
          fi
          if npm view "mailwoman@${VERSION}" version >/dev/null 2>&1; then
            echo "::error::mailwoman@${VERSION} is already on npm — pick a different version"; exit 1
          fi
          yarn oxfmt package.json '**/package.json'
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      # The man page embeds the release version in its .TH line, so EVERY bump stales it — v9.2.0's
      # release PR failed its test run on exactly that and needed a manual regeneration push (#1891).
      # Compile first: the generators spawn the compiled CLI, and a clean checkout has no out/ to
      # trust. Runs on dry runs too, so the dry-run diff below shows the generated surfaces.
      - name: Compile + regenerate version-stamped surfaces
        run: | # shell
          yarn compile
          node scripts/release-generated-surfaces.ts

      - name: "Dry run: show the bump and stop"
        if: ${{ inputs.dry_run }}
        run: | # shell
          echo "Would open release PR for v${{ steps.bump.outputs.version }} with:"
          git diff --stat
          git diff package.json

      - name: Open the auto-merging release PR
        if: ${{ !inputs.dry_run }}
        env:
          # RELEASE_PR_TOKEN (fine-grained PAT: THIS repo only, contents + pull-requests write) makes
          # the release PR belong to a TRUSTED HUMAN actor, so `on: pull_request` workflows run
          # unprompted — the 7.8.0 cut stalled in `action_required` when a bot-PR Test run started
          # requiring manual approval, and the approval policy must stay STRICT for outsiders (the
          # Test legs run on the self-hosted lab fleet; never auto-run stranger code there). Fallback
          # when the secret is absent: GITHUB_TOKEN + the explicit Test dispatch below.
          GH_TOKEN: ${{ secrets.RELEASE_PR_TOKEN || secrets.GITHUB_TOKEN }}
          HAS_RELEASE_PR_TOKEN: ${{ secrets.RELEASE_PR_TOKEN != '' }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: | # shell
          set -euo pipefail
          BRANCH="release/v${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "${BRANCH}"
          # The explicit release allowlist (#1891): version-bearing manifests + the generated
          # surfaces the bump stales. Anything else dirty is a fault to surface, never to ship —
          # a release commit that silently carries an unexpected file is how drift hides.
          git add package.json '*/package.json' release.config.json \
            packages/mailwoman/man/mailwoman.1 docs/articles/developers/reference/cli.mdx
          UNEXPECTED=$(git status --porcelain --untracked-files=no | grep -v '^[AMDR]' || true)
          if [ -n "${UNEXPECTED}" ]; then
            echo "::error::changed files outside the release allowlist — refusing to commit them silently:"
            echo "${UNEXPECTED}"
            exit 1
          fi
          git commit -m "release: v${VERSION}"
          # Push with the same identity that opens the PR (the PAT when present) — a PAT-authored
          # PR whose branch was pushed by the bot still counts the pusher as the triggering actor
          # for `on: pull_request`, so both operations must ride the same token.
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${BRANCH}"
          PR_URL=$(gh pr create --base main --head "${BRANCH}" \
            --title "release: v${VERSION}" \
            --body "Automated release PR (publish.yml mode=prepare). Version bump across the root + all $(node -p "require('./.release-it.json').plugins['@release-it-plugins/workspaces'].workspaces.length") workspaces. Auto-merges when the required \`test\` check passes; then dispatch \`publish.yml\` with mode=publish to tag + npm-publish.")
          echo "release PR: ${PR_URL}"
          if [ "${HAS_RELEASE_PR_TOKEN}" != "true" ]; then
            # GITHUB_TOKEN-created PRs don't trigger `on: pull_request` workflows (anti-recursion),
            # so the required `test` check would never report and auto-merge would hang forever.
            # Dispatch the Test workflow against the branch explicitly — its check run lands on the
            # branch head SHA, which is exactly what the ruleset's required check matches on. (With
            # the PAT, `pull_request` fires naturally and a second dispatched run would just burn a
            # lab runner slot — skip it.)
            gh workflow run test.yml --ref "${BRANCH}"
          fi
          gh pr merge --auto --squash "${PR_URL}"
          {
            echo "## Release PR opened: v${VERSION}"
            echo ""
            echo "- ${PR_URL} (auto-merges when \`test\` is green)"
            echo "- Next: dispatch this workflow with **mode=publish** after the merge."
          } >> "${GITHUB_STEP_SUMMARY}"

  # PHASE 2 — tag + GitHub release + npm publish of the merged release commit on main.
  # Idempotent: safe to re-dispatch after a partial failure (tag/release are create-if-missing,
  # workspace publishes ride --tolerate-republish).
  publish:
    if: ${{ inputs.mode == 'publish' }}
    # GITHUB-HOSTED ON PURPOSE (do not sweep to self-hosted with the other jobs): npm rejects
    # provenance attestation from self-hosted runners outright — E422 "Unsupported GitHub Actions
    # runner environment: \"self-hosted\". Only \"github-hosted\" runners are supported when
    # publishing with provenance" (this failed the whole v7.6.0 publish loop on 2026-07-23, run
    # 30030865677; tag/release had already been created — mode=publish's idempotency covered the
    # recovery). Nothing in this job needs lab data: the weights come from the HF fetch step.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # push the version tag + create the GitHub release
      id-token: write # npm Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          # actions-cache restore DISABLED (2026-07-29): the restore against GitHub's cache service
          # hangs through the lab's degraded path (multiple 20m job-budget deaths in Setup Node) and
          # is redundant — .yarnrc.yml's enableGlobalCache serves installs offline on the runners.
          registry-url: https://registry.npmjs.org

      - name: Enable Corepack (yarn 4)
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      # The release PR must have merged: every workspace manifest on main must agree with the root.
      # A drifted tree means phase 1 hasn't landed (or landed partially) — publishing it would ship
      # mixed versions. The comparison lives in scripts/verify-version-sync.ts rather than in a
      # heredoc: embedded JS in YAML is the one code in this repo no compiler, linter or test reads,
      # which is how this workflow's other hand-maintained paths went stale after the workspace
      # regroup. Same `RESOLVED_VERSION=` output contract as prepare-release-version.ts above.
      - name: Verify version sync on main
        id: version
        run: | # shell
          set -euo pipefail
          OUT=$(node scripts/verify-version-sync.ts)
          echo "${OUT}"
          echo "version=$(echo "${OUT}" | grep -oP '(?<=^RESOLVED_VERSION=).+')" >> "${GITHUB_OUTPUT}"

      # Materialize the weight artifacts from the PUBLIC Hugging Face bucket (the same files the demo
      # loads at runtime — no auth needed, and none is wanted: a credential here would only hide the
      # day the bucket stops being public). The whole release, weights included, publishes from CI via
      # OIDC, so no npm credentials live anywhere.
      #
      # The recipe is scripts/fetch-hf-weights.ts, shared byte for byte with
      # `yarn release:preflight --source hf` (#1894). It derives WHAT to materialize from each weights
      # package's `files` array minus what git already tracks — the same predicate verify-tarball.ts
      # refuses a publish over — so it cannot fall behind a manifest the way this step's hand-written
      # copy list did: the v9.2.0 cut published 49 of 51 workspaces before the audit refused
      # @mailwoman/neural-weights-en-au over four declared lexicons the list never named. It
      # HEAD-probes the whole remote set (the Fisher pair included, which rides the bucket but is
      # never fetched) so an unstaged version fails in one pass with every missing object named, and
      # verifies each download against the md5s the model cards declare.
      #
      # Prerequisite for a real publish run: the model for the card version must already be staged on
      # HF — push it with `mailwoman release hf` (HF token, run on the operator's host) first. Skipped
      # on dry runs, where the preflight leg at the end of this job materializes into a staging tree
      # instead of the checkout.
      - name: Materialize weight artifacts from Hugging Face
        if: ${{ !inputs.dry_run }}
        run: node scripts/fetch-hf-weights.ts

      # The FETCHED pair indexes must agree with the model cards that describe them. The step above proves each file
      # EXISTS and is non-empty; this one proves it is the RIGHT one. Both are needed: a stale artifact left on the
      # bucket by an earlier release is present, non-empty, and wrong — which is exactly what happened to
      # pair-index-gb.bin, whose staged copy sat three increments behind the repo (19,209 pairs vs 20,126) while the
      # en-gb card described neither. The fetch above wrote these binaries into the weights workspaces, so the same
      # parity test CI already runs against locally-built artifacts now grades the STAGED ones for free.
      #
      # Selected through a package script, never by physical filename: the v9.2.0 cut's SECOND dispatch died here
      # because this line still named the pre-regroup path and Vitest matched zero files. The script's filter is the
      # test's NAME, so the suite survives a move; Vitest exits 1 on an empty selection, so a rename fails loudly
      # rather than passing vacuously.
      - name: Verify staged pair indexes match their model cards
        run: yarn ci:test:pair-index-parity

      # The full-scale locality-surface build. On the PR path this is behind a path filter
      # (test.yml's `lexicon-full`), so most PRs merge with it deliberately unrun — the four laws are
      # covered by the fixture layer, but the coverage-scale claims (entries > 10_000, the nonzero
      # skip counters) are not. A release must exercise them rather than inherit a green tick that
      # only ever meant "no lexicon path changed in that PR".
      - name: Full-scale locality-surface build
        run: yarn ci:test:lexicon-full

      - name: Tag + GitHub release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: | # shell
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --tags origin "v${VERSION}" | grep -q .; then
            echo "tag v${VERSION} already on origin (recovery re-run) — skipping tag push"
          else
            git tag -a "v${VERSION}" -m "Release v${VERSION}"
            git push origin "v${VERSION}"
          fi
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "GitHub release v${VERSION} already exists (recovery re-run) — skipping"
          else
            gh release create "v${VERSION}" --title "v${VERSION}" --generate-notes
          fi

      # Publish every workspace at its (already-merged) package.json version via OIDC.
      # #756: derive the workspace set from .release-it.json — ONE source of truth, dependency
      # order preserved (core … mailwoman). --tolerate-republish makes re-runs no-ops per package;
      # the loop continues past per-package failures and reports the full failed set at the end, so
      # one run pinpoints every package that still rejects OIDC instead of stopping at the first.
      - name: Publish workspaces (per-workspace, OIDC)
        if: ${{ !inputs.dry_run }}
        env:
          MAILWOMAN_SKIP_WEIGHTS_COPY: "1"
          RELEASE_IT_WORKSPACES_TAG: latest
          RELEASE_IT_WORKSPACES_ACCESS: public
        run: | # shell
          set -uo pipefail
          # publish-workspace.ts imports @mailwoman/core/env, which resolves to the COMPILED
          # core/out tree (#874) — compile first or every workspace publish dies ERR_MODULE_NOT_FOUND.
          yarn compile
          WORKSPACES=$(node -p "require('./.release-it.json').plugins['@release-it-plugins/workspaces'].workspaces.join(' ')")
          echo "workspaces (from .release-it.json): ${WORKSPACES}"
          FAILED=()
          for ws in ${WORKSPACES}; do
            echo "::group::publish ${ws}"
            if RELEASE_IT_WORKSPACES_PATH_TO_WORKSPACE="./${ws}" node scripts/publish-workspace.ts; then
              echo "  ✓ ${ws}"
            else
              echo "::warning::publish failed for ${ws}"
              FAILED+=("${ws}")
            fi
            echo "::endgroup::"
          done
          if [ ${#FAILED[@]} -gt 0 ]; then
            echo "::error::publish: failed workspaces: ${FAILED[*]}"
            exit 1
          fi
          echo "All workspaces published at v${{ steps.version.outputs.version }}."

      # THE DRY RUN IS THE PREFLIGHT (#1894). It stages the tracked tree in an isolated root, materializes
      # the same Hugging Face artifacts a real publish fetches, then packs and audits ALL 51 release
      # tarballs through the same packWorkspaceForPublish + verifyTarball path the publish loop above
      # uses — one dry-run contract, identical to the real one but for the destination. It writes nothing
      # outside its own staging root: no tag, no release, no registry write, and the checkout is left
      # byte-identical.
      #
      # Unlike the compile-only leg it replaces, this DOES require the version's weights to be staged on
      # HF. That is the point: a preview that skipped the dependency the real run has is precisely the
      # weaker contract #1894 was opened over — the old leg finished with `yarn compile` and passed
      # through all three of the v9.2.0 failures.
      - name: "Dry run: materialize from Hugging Face + audit every release tarball"
        if: ${{ inputs.dry_run }}
        run: | # shell
          set -euo pipefail
          yarn compile
          node scripts/release-preflight.ts --source hf
          echo "Dry run: v${{ steps.version.outputs.version }} staged, packed and audited. No tag, no release, no publish."

  # Regenerate the Python + Rust API clients (Phase 5 Task 4) as INSPECTION ARTIFACTS — this job
  # never publishes anything (registry publishing = publish-python.yml / publish-cargo.yml, each
  # bound to its GitHub environment). Additive: it only starts once `publish` has already succeeded
  # (`needs: publish`), so it can't turn a working npm release red.
  clients:
    needs: publish
    runs-on:
      - self-hosted
      - Linux
      - X64
    timeout-minutes: 20
    # NOTE: this job occupies the workflow-level `publish` concurrency group. During an incident:
    # cancel THIS job from the Actions UI (always safe — it publishes nothing) to free the queue.
    # Least privilege: no pushes, no OIDC — neither `contents: write` nor `id-token: write`.
    permissions:
      contents: read
    steps:
      # `ref: main` is deliberate: on a publish run, main already carries the merged release commit
      # (phase 1's PR), so `mailwoman/package.json`'s version — the version every generated client
      # syncs to (see `mailwoman/tools/generate-clients.ts`) — is the just-published one.
      - uses: actions/checkout@v7
        with:
          ref: main
          # Least privilege (see the job's `permissions: contents: read` above): this job never
          # pushes, so it has no business holding a credential that could.
          persist-credentials: false

      # The build block lives in the local composite action (shared with publish-clients.yml's
      # generate job) — setup, compile, `mailwoman clients generate`, crate tarball.
      - name: Generate + verify API clients
        uses: ./.github/actions/generate-clients

      - name: Upload Python client artifact
        uses: actions/upload-artifact@v7
        with:
          name: mailwoman-client-python
          path: clients-build/python/dist/*
          if-no-files-found: error

      - name: Upload Rust client artifact
        uses: actions/upload-artifact@v7
        with:
          name: mailwoman-client-rust
          path: clients-build/mailwoman-client-rust.tar.gz
          if-no-files-found: error
