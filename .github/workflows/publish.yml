# Releases every workspace to npm in two manually dispatched phases.
#
# The ruleset on `main` requires every change to arrive through a PR with a green `test` check,
# so the release splits at the merge.
#
# 1. mode=prepare bumps every manifest on a `release/v<version>` branch, opens the release PR and
#    enables auto-merge. The PR merges when `test` passes.
# 2. mode=publish runs after the merge. It tags the merged commit, creates the GitHub release,
#    fetches the weight binaries from Hugging Face and publishes every workspace. Every step
#    tolerates work that already happened, so re-dispatching this mode recovers a partial failure.
#
# npm Trusted Publishing accepts OIDC tokens from this workflow file, so no npm token is stored.
# A real publish requires the model for the card version to be staged on Hugging Face first,
# using `mailwoman release hf` on the operator's host.
#
# The fetch and tarball audit logic lives in `@mailwoman/release-kit`. Run
# `yarn release:preflight --source hf` to exercise the same logic locally.
name: NPM Publish

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "prepare bumps versions and opens the auto-merging release PR. publish tags and publishes the merged release commit on main, and also recovers a partial failure."
        required: true
        default: prepare
        type: choice
        options:
          - prepare
          - publish
      version:
        description: "prepare only: version bump (patch / minor / major / specific semver like 2.1.0)"
        required: false
        default: patch
        type: string
      dry_run:
        description: "Show what would happen without pushing or publishing anything."
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # The onnxruntime-node postinstall fetches GPU binaries from a CDN that the lab runners cannot
  # always reach. CI uses the CPU libraries bundled in the npm tarball, so the download is skipped.
  ONNXRUNTIME_NODE_INSTALL: skip

# Runs queue without cancelling because an interrupted push or publish leaves partial state.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  # Phase 1 bumps versions on a release branch and opens an auto-merging PR.
  prepare:
    if: ${{ inputs.mode == 'prepare' }}
    runs-on:
      - self-hosted
      - Linux
      - X64
    timeout-minutes: 15
    permissions:
      contents: write # push the release/v<version> branch
      pull-requests: write # open the release PR + enable auto-merge
      actions: write # dispatch the Test workflow against the release branch
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          # The setup-node cache stays off because restores can hang on the lab runners.
          # The global Yarn cache in .yarnrc.yml already serves installs offline.

      - name: Enable Corepack (yarn 4)
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      # This check fails when the model version in the en-US model card is missing from the
      # ledger, releases page or status page. It also runs on dry runs.
      - name: Verify release metadata is propagated
        run: yarn mwops release verify-metadata

      - name: Resolve + bump versions
        id: bump
        run: | # shell
          set -euo pipefail
          OUT=$(yarn mwops release prepare-version --version "${{ inputs.version }}" --json)
          echo "${OUT}"
          VERSION=$(echo "${OUT}" | jq -r '.resolvedVersion')
          # Collision guards — the version must be new to both git and npm.
          if git tag -l "v${VERSION}" | grep -q .; then
            echo "::error::tag v${VERSION} already exists — pick a different version"; exit 1
          fi
          if npm view "mailwoman@${VERSION}" version >/dev/null 2>&1; then
            echo "::error::mailwoman@${VERSION} is already on npm — pick a different version"; exit 1
          fi
          yarn oxfmt package.json '**/package.json'
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      # The man page and CLI reference embed the version, so every bump regenerates them.
      # The generators spawn the compiled CLI, so the step compiles first.
      - name: Compile + regenerate version-stamped surfaces
        run: | # shell
          yarn compile
          yarn mwops release generated-surfaces

      - name: "Dry run: show the bump and stop"
        if: ${{ inputs.dry_run }}
        run: | # shell
          echo "Would open release PR for v${{ steps.bump.outputs.version }} with:"
          git diff --stat
          git diff package.json

      - name: Open the auto-merging release PR
        if: ${{ !inputs.dry_run }}
        env:
          # RELEASE_PR_TOKEN is a fine-grained PAT with contents and pull-requests write on this repo.
          # A PR opened with it runs `on: pull_request` workflows without manual approval.
          # Without the secret, the step uses GITHUB_TOKEN and dispatches Test explicitly.
          GH_TOKEN: ${{ secrets.RELEASE_PR_TOKEN || secrets.GITHUB_TOKEN }}
          HAS_RELEASE_PR_TOKEN: ${{ secrets.RELEASE_PR_TOKEN != '' }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: | # shell
          set -euo pipefail
          BRANCH="release/v${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "${BRANCH}"
          # The explicit release allowlist (#1891): versioned manifests + the generated
          # surfaces the bump stales. Anything else dirty is a fault to surface, never to ship —
          # a release commit that silently carries an unexpected file is how drift hides.
          git add package.json '*/package.json' release.config.json \
            packages/mailwoman/man/mailwoman.1 docs/articles/developers/reference/cli.mdx
          UNEXPECTED=$(git status --porcelain --untracked-files=no | grep -v '^[AMDR]' || true)
          if [ -n "${UNEXPECTED}" ]; then
            echo "::error::changed files outside the release allowlist — refusing to commit them silently:"
            echo "${UNEXPECTED}"
            exit 1
          fi
          git commit -m "release: v${VERSION}"
          # Push with the same identity that opens the PR (the PAT when present) — a PAT-authored
          # PR whose branch was pushed by the bot still counts the pusher as the triggering actor
          # for `on: pull_request`, so both operations must ride the same token.
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${BRANCH}"
          PR_URL=$(gh pr create --base main --head "${BRANCH}" \
            --title "release: v${VERSION}" \
            --body "Automated release PR (publish.yml mode=prepare). Version bump across the root + all $(node -p "require('./.release-it.json').plugins['@release-it-plugins/workspaces'].workspaces.length") workspaces. Auto-merges when the required \`test\` check passes. then dispatch \`publish.yml\` with mode=publish to tag + npm-publish.")
          echo "release PR: ${PR_URL}"
          if [ "${HAS_RELEASE_PR_TOKEN}" != "true" ]; then
            # GITHUB_TOKEN-created PRs don't trigger `on: pull_request` workflows (anti-recursion),
            # so the required `test` check would never report and auto-merge would hang forever.
            # Dispatch the Test workflow against the branch explicitly — its check run lands on the
            # branch head SHA, which is exactly what the ruleset's required check matches on. (With
            # the PAT, `pull_request` fires naturally and a second dispatched run would just burn a
            # lab runner slot — skip it.)
            gh workflow run test.yml --ref "${BRANCH}"
          fi
          gh pr merge --auto --squash "${PR_URL}"
          {
            echo "## Release PR opened: v${VERSION}"
            echo ""
            echo "- ${PR_URL} (auto-merges when \`test\` is green)"
            echo "- Next: dispatch this workflow with **mode=publish** after the merge."
          } >> "${GITHUB_STEP_SUMMARY}"

  # Phase 2 tags, releases and publishes the merged release commit on main.
  # Re-dispatching it is safe after a partial failure.
  publish:
    if: ${{ inputs.mode == 'publish' }}
    # npm rejects provenance from self-hosted runners, so this job must stay on a GitHub-hosted runner.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # push the version tag + create the GitHub release
      id-token: write # npm Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org

      - name: Enable Corepack (yarn 4)
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      # Every workspace manifest on main must match the root version. A mismatch means the release
      # PR has not merged. After the check passes, the root manifest supplies the version.
      - name: Verify version sync on main
        id: version
        run: | # shell
          set -euo pipefail
          yarn mwops health version-sync
          echo "version=$(node -p "require('./package.json').version")" >> "${GITHUB_OUTPUT}"

      # The fetch reads the public Hugging Face bucket without credentials. It downloads each weights
      # package's declared `files` that git does not track, and checks them against the model card
      # md5s. It probes every remote object first, so an unstaged version reports all missing
      # objects in one run. Dry runs skip this step because the preflight step fetches into a
      # staging tree.
      - name: Materialize weight artifacts from Hugging Face
        if: ${{ !inputs.dry_run }}
        run: yarn mwops release fetch-hf-weights

      # A stale pair index left on the bucket can pass the fetch check and still disagree with its
      # model card. This parity test checks the fetched files against the cards. The package script
      # selects the test by name, so moving the test file does not break this step.
      - name: Verify staged pair indexes match their model cards
        run: yarn ci:test:pair-index-parity

      # PRs run the full-scale locality-surface build only when a lexicon path changes.
      # A release always runs it because the fixture tests do not cover the full-scale assertions.
      - name: Full-scale locality-surface build
        run: yarn ci:test:lexicon-full

      - name: Tag + GitHub release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: | # shell
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --tags origin "v${VERSION}" | grep -q .; then
            echo "tag v${VERSION} already on origin (recovery re-run) — skipping tag push"
          else
            git tag -a "v${VERSION}" -m "Release v${VERSION}"
            git push origin "v${VERSION}"
          fi
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "GitHub release v${VERSION} already exists (recovery re-run) — skipping"
          else
            gh release create "v${VERSION}" --title "v${VERSION}" --generate-notes
          fi

      # The workspace list and its dependency order come from .release-it.json. The loop keeps going
      # after a failed package and reports every failure at the end.
      - name: Publish workspaces (per-workspace, OIDC)
        if: ${{ !inputs.dry_run }}
        env:
          MAILWOMAN_SKIP_WEIGHTS_COPY: "1"
          RELEASE_IT_WORKSPACES_TAG: latest
          RELEASE_IT_WORKSPACES_ACCESS: public
        run: | # shell
          set -uo pipefail
          # The publish operation imports @mailwoman/core/env, which resolves to the compiled
          # core/out tree (#874) — compile first or every workspace publish dies ERR_MODULE_NOT_FOUND.
          yarn compile
          # Plan → execute: seal head, the version, every release workspace and every weights artifact
          # under one digest, then hand that plan to each publish. publish-workspace refuses when head
          # is dirty, head moved, or the recomputed digest differs from the plan it was given.
          PLAN="${RUNNER_TEMP}/release-plan.json"
          yarn mwops release plan --json > "${PLAN}"
          echo "release plan: $(jq -r '.planDigest' "${PLAN}") at $(jq -r '.gitHead' "${PLAN}") for v$(jq -r '.version' "${PLAN}")"
          WORKSPACES=$(node -p "require('./.release-it.json').plugins['@release-it-plugins/workspaces'].workspaces.join(' ')")
          echo "workspaces (from .release-it.json): ${WORKSPACES}"
          FAILED=()
          for ws in ${WORKSPACES}; do
            echo "::group::publish ${ws}"
            if yarn mwops release publish-workspace --workspace "./${ws}" --plan "${PLAN}"; then
              echo "  ✓ ${ws}"
            else
              echo "::warning::publish failed for ${ws}"
              FAILED+=("${ws}")
            fi
            echo "::endgroup::"
          done
          if [ ${#FAILED[@]} -gt 0 ]; then
            echo "::error::publish: failed workspaces: ${FAILED[*]}"
            exit 1
          fi
          echo "All workspaces published at v${{ steps.version.outputs.version }}."

      # The dry run stages the tracked tree in an isolated root and fetches the same Hugging Face
      # files. It then packs and audits every release tarball through the same code as the publish
      # loop. It writes only inside its staging root. Like a real publish, it needs the weights
      # staged on Hugging Face.
      - name: "Dry run: materialize from Hugging Face + audit every release tarball"
        if: ${{ inputs.dry_run }}
        run: | # shell
          set -euo pipefail
          yarn compile
          yarn mwops release preflight --source hf
          echo "Dry run: v${{ steps.version.outputs.version }} staged, packed and audited. Nothing was tagged, released or published."

  # This job regenerates the Python and Rust API clients as workflow artifacts for inspection.
  # publish-clients.yml publishes them to their registries.
  #
  # A failure here marks the whole run failed, but the npm packages are already published.
  # Fix the generator and dispatch publish-clients.yml. Do not republish the npm release.
  clients:
    needs: publish
    runs-on:
      - self-hosted
      - Linux
      - X64
    timeout-minutes: 20
    # This job holds the `publish` concurrency group. Cancelling it is safe because it publishes nothing.
    permissions:
      contents: read
    steps:
      # Main carries the merged release commit, so the clients take the just-published version.
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      # publish-clients.yml shares this composite action.
      - name: Generate + verify API clients
        uses: ./.github/actions/generate-clients

      - name: Upload Python client artifact
        uses: actions/upload-artifact@v7
        with:
          name: mailwoman-client-python
          path: clients-build/python/dist/*
          if-no-files-found: error

      - name: Upload Rust client artifact
        uses: actions/upload-artifact@v7
        with:
          name: mailwoman-client-rust
          path: clients-build/mailwoman-client-rust.tar.gz
          if-no-files-found: error
