# Dependabot version-update config.
#
# Quick summary:
# - Runs weekly.
# - Covers 3 ecosystems: npm, uv (Python), and GitHub Actions.
# - Minor + patch updates are grouped.
#
# Important:
# - Security updates are handled separately in GitHub repo settings.
# - `ignore` only suppresses *version-update PRs*.
# - Security alerts / security PRs still appear, even for ignored packages.
version: 2
updates:
  # npm (Yarn 4 workspaces)
  # - One root lockfile covers all workspaces.
  # - Using directory "/" updates everything.
  # - Minor + patch updates are grouped weekly.
  # - Major updates come as separate PRs.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-dependencies:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    ignore:
      # onnxruntime packages:
      # - Bumps can change inference output.
      # - These are handled manually with eval checks.
      # - In @mailwoman/neural, browser runtime also pins an exact ORT dev build.
      # - So: never via Dependabot PRs.
      - dependency-name: "onnxruntime-node"
      - dependency-name: "onnxruntime-web"
      # release-it:
      # - Intentionally pinned to ^19.x.
      # - @release-it-plugins/workspaces (used for multi-workspace publish)
      #   only supports release-it peer: "^17 || ^18 || ^19".
      # - No support for 20/21 yet.
      # - Ignore major bumps until plugin support catches up.
      # - Context: #1327 bumped to 21 and would have broken releases.
      - dependency-name: "release-it"
        update-types: ["version-update:semver-major"]

  # Python (uv)
  # - Dependency files: root pyproject.toml + uv.lock.
  # - Source code location: corpus-python/.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    groups:
      python-dependencies:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Exact pins for the int8 / mobile-Safari WebGPU invariant.
      # Before bumping, read the pin note in root pyproject.toml.
      #
      # This list mirrors verify_toolchain.py -> INVARIANT_DEPS.
      # If any of these change, updates must be coordinated together:
      # - pyproject
      # - Modal image
      # - export-verification flow
      #
      # Dependabot PRs only touch pyproject, so they fail verify-toolchain CI.
      - dependency-name: "torch"
      - dependency-name: "transformers"
      - dependency-name: "onnx"
      - dependency-name: "onnxruntime"

  # GitHub Actions
  # - Handles tag pins (e.g., @v7).
  # - Handles SHA pins (updates SHA + trailing `# vX` comment).
  # - All action updates are grouped into one PR.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions:
        patterns:
          - "*"
